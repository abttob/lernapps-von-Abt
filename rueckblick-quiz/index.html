<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rückblick-Quiz Kurstag 1 – Gestalten mit Pflanzen</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root { --g:#98C723; --gd:#4E7A12; --gl:#EEF6DC; --dk:#22262A; --grey:#6B7378;
          --a0:#E21B3C; --a1:#1368CE; --a2:#D89E00; --a3:#26890C; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family: "Century Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif; color:var(--dk); background:#F6F8F2; }
  button { font:inherit; cursor:pointer; border:0; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--grey); }
  .top a { color:var(--gd); text-decoration:none; }
  h1 { font-size:26px; margin:14px 0 4px; }
  .sub { color:var(--grey); margin:0 0 18px; }
  .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:14px; }
  label { display:block; font-weight:700; margin:10px 0 6px; }
  input { width:100%; font:inherit; font-size:20px; padding:14px; border-radius:12px; border:2px solid #D7DDCF; }
  input:focus { outline:none; border-color:var(--g); }
  .btn { display:block; width:100%; padding:16px; border-radius:14px; background:var(--g); color:var(--dk); font-size:20px; font-weight:700; margin-top:14px; }
  .btn.dark { background:var(--dk); color:#fff; }
  .btn:disabled { opacity:.5; }
  .err { color:#B5462B; font-weight:700; margin-top:10px; min-height:1.2em; }
  .center { text-align:center; }
  .big { font-size:28px; font-weight:800; }
  .muted { color:var(--grey); }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .ans { min-height:120px; border-radius:16px; color:#fff; font-size:17px; font-weight:700; padding:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.18); }
  .ans .sym { font-size:30px; line-height:1; }
  .ans:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .c0{background:var(--a0)} .c1{background:var(--a1)} .c2{background:var(--a2)} .c3{background:var(--a3)}
  .result { border-radius:18px; padding:28px 18px; color:#fff; text-align:center; }
  .result.ok { background:var(--a3); } .result.no { background:var(--a0); } .result.wait { background:var(--dk); }
  .pill { display:inline-block; background:var(--gl); color:var(--gd); border-radius:99px; padding:6px 14px; font-weight:700; }
  .spinner { width:46px; height:46px; border:5px solid #DDE5CF; border-top-color:var(--g); border-radius:50%; margin:18px auto; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ---------- Beamer ---------- */
  body.beamer { background:#1F2A14; color:#fff; overflow:hidden; }
  .bm { position:fixed; inset:0; display:flex; flex-direction:column; padding:2.2vh 3vw; }
  .bm-head { display:flex; justify-content:space-between; align-items:center; font-size:2.2vh; color:#C9D6B4; }
  .bm-head b { color:#fff; }
  .bm-main { flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; }
  .bm-foot { display:flex; justify-content:space-between; align-items:center; font-size:2vh; color:#C9D6B4; }
  .bm .btn { width:auto; display:inline-block; padding:1.4vh 3vw; font-size:2.6vh; margin:0; }
  .lobby { display:grid; grid-template-columns: 1fr 1.2fr; gap:4vw; align-items:center; }
  .lobby .qr { background:#fff; border-radius:2vh; padding:2vh; display:inline-block; }
  .lobby .qr img, .lobby .qr canvas { width:30vh; height:30vh; image-rendering:pixelated; display:block; }
  .code { font-size:12vh; font-weight:800; letter-spacing:1vh; color:var(--g); line-height:1; }
  .url { font-size:2.6vh; color:#E6EED8; }
  .names { display:flex; flex-wrap:wrap; gap:1vh; margin-top:2vh; max-height:40vh; overflow:hidden; }
  .names span { background:rgba(255,255,255,.12); padding:.8vh 1.6vh; border-radius:99px; font-size:2.4vh; animation:pop .3s; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  .qtitle { font-size:4.6vh; font-weight:800; text-align:center; margin:1vh 4vw 3vh; line-height:1.2; }
  .qnum { text-align:center; font-size:2.4vh; color:#C9D6B4; }
  .timer { width:12vh; height:12vh; border-radius:50%; background:var(--g); color:var(--dk); display:flex; align-items:center; justify-content:center; font-size:5vh; font-weight:800; }
  .qmid { display:flex; justify-content:space-between; align-items:center; margin:0 4vw 3vh; }
  .qmid .cnt { text-align:center; font-size:2.4vh; } .qmid .cnt b { display:block; font-size:5vh; }
  .bm .answers { gap:1.6vh; margin:0; }
  .bm .ans { min-height:13vh; font-size:3.4vh; flex-direction:row; justify-content:flex-start; padding:0 2.5vw; gap:2vw; text-align:left; box-shadow:none; transition:opacity .3s; }
  .bm .ans .sym { font-size:5vh; }
  .bm .ans.dim { opacity:.25; }
  .bm .ans .bar { margin-left:auto; font-size:3vh; }
  .board { margin:0 auto; width:min(80vw, 110vh); }
  .row { display:grid; grid-template-columns:7vh 1fr 14vh; align-items:center; background:rgba(255,255,255,.08); border-radius:1.2vh; margin-bottom:1vh; padding:1.1vh 1.6vh; font-size:3vh; }
  .row .rk { font-weight:800; color:var(--g); }
  .row .pts { text-align:right; font-weight:800; }
  .row.top1 { background:rgba(152,199,35,.35); }
  .podium { display:flex; justify-content:center; align-items:flex-end; gap:2vw; height:46vh; }
  .pod { width:22vw; text-align:center; }
  .pod .nm { font-size:3.4vh; font-weight:800; margin-bottom:1vh; }
  .pod .pt { font-size:2.4vh; color:#C9D6B4; margin-bottom:1vh; }
  .pod .blk { border-radius:1.4vh 1.4vh 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:2vh; font-size:7vh; font-weight:800; color:var(--dk); animation:up .9s ease-out both; }
  @keyframes up { from { transform:scaleY(0); transform-origin:bottom; } }
  .p1 .blk { height:30vh; background:#E8C547; } .p2 .blk { height:22vh; background:#C9CDD2; } .p3 .blk { height:15vh; background:#D49A6A; }
  .hard { display:grid; grid-template-columns:repeat(3,1fr); gap:1.6vw; margin-top:3vh; }
  .hard div { background:rgba(255,255,255,.08); border-radius:1.4vh; padding:1.6vh; font-size:2.1vh; line-height:1.3; }
  .hard b { color:var(--g); display:block; font-size:2.6vh; margin-bottom:.6vh; }
  .hard i { color:#E6EED8; font-style:normal; display:block; margin-top:.8vh; }
  .hint { font-size:1.8vh; color:#93A07C; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const URL_ = "https://bbgqfuyezgxdcjcncrel.supabase.co/rest/v1/rpc/";
  const KEY = "sb_publishable_z0hjQLCnjFoV00YvPUK9lw_JH6iskSy";
  const LIMIT = 20;            // Sekunden pro Frage
  const SYM = ["▲", "◆", "●", "■"];
  const qs = new URLSearchParams(location.search);
  const BEAMER = qs.has("beamer");
  const $ = s => document.querySelector(s);
  const app = $("#app");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---------- 15 Fragen: Rückblick Kurstag 1 (Gestalten mit Pflanzen) ----------
  const Q = [
    { q: "Welche Farben sind die Farben 1. Ordnung?", a: ["Gelb, Rot, Blau", "Orange, Violett, Grün", "Rot, Grün, Blau", "Gelb, Orange, Rot"], c: 0 },
    { q: "Wie entstehen die Farben 2. Ordnung?", a: ["Grundfarbe + Weiss", "Mischung aus zwei Grundfarben", "Mischung aus allen drei Grundfarben", "Grundfarbe + Schwarz"], c: 1 },
    { q: "Wie wirken warme Farben (Gelb, Orange, Rot) in einer Pflanzung?", a: ["Sie treten zurück und wirken fern", "Sie wirken neutral und verbindend", "Sie drängen nach vorne und wirken nah", "Sie lassen den Raum grösser wirken"], c: 2 },
    { q: "Was bewirken kalte Farben (Blau, Blaugrün) in einem kleinen Garten?", a: ["Der Raum wirkt enger", "Der Raum wirkt tiefer und weiter", "Sie drängen nach vorne", "Sie haben keine Wirkung auf den Raum"], c: 1 },
    { q: "Welche Farbe hat die grösste Leuchtkraft?", a: ["Rot", "Blau", "Violett", "Gelb"], c: 3 },
    { q: "Welche Pflanzen prägen den Spätwinter- und Frühlingsaspekt vor dem Laubaustrieb?", a: ["Herbstastern und Gräser", "Frühblüher wie Galanthus und Crocus", "Sedum und Rudbeckia", "Prachtstauden wie Phlox"], c: 1 },
    { q: "Warum braucht es von Violett mehr Pflanzen als von Gelb, damit die Fläche ausgewogen wirkt?", a: ["Violett blüht kürzer", "Violett hat eine geringere Leuchtkraft", "Gelb ist eine Farbe 2. Ordnung", "Violett ist eine warme Farbe"], c: 1 },
    { q: "Was ist ein Farb-Zweiklang?", a: ["Zwei benachbarte Farben im Farbkreis", "Zwei Helligkeitsstufen derselben Farbe", "Zwei Farben, die sich im Farbkreis gegenüberstehen", "Weiss und Grün"], c: 2 },
    { q: "Welche Farbe ist die Komplementärfarbe zu Violett?", a: ["Gelb", "Blau", "Rot", "Grün"], c: 0 },
    { q: "Wie entsteht eine harmonische Farbwirkung?", a: ["Mit Komplementärfarben", "Mit möglichst vielen Farben", "Nur mit Weiss", "Mit benachbarten Farben im Farbkreis"], c: 3 },
    { q: "Welche Aufgabe hat Weiss in einer Pflanzung?", a: ["Es schluckt alle anderen Farben", "Es trennt konkurrierende Farben und hellt Schatten auf", "Es wirkt nur am Mittag", "Es macht die Pflanzung unruhig"], c: 1 },
    { q: "Was beschreibt die Textur einer Pflanze?", a: ["Das Zweiggerüst im Winter", "Die Oberflächenqualität, vor allem durch die Belaubung", "Die Blütenfarbe", "Die Wurzelform"], c: 1 },
    { q: "Wann ist die Struktur einer Pflanze am besten sichtbar?", a: ["Zur Hauptblütezeit", "Beim Austrieb im Frühling", "Im unbelaubten Zustand", "Nur bei immergrünen Pflanzen"], c: 2 },
    { q: "Wie lautet der Merksatz zu Textur und Struktur?", a: ["Strukturen kontrastieren, Texturen harmonisieren", "Texturen kontrastieren, Strukturen harmonisieren", "Beide sollen immer kontrastieren", "Beide sind nur im Winter wichtig"], c: 0 },
    { q: "Welche Staude bringt mit ihren Fruchtständen einen schönen Winteraspekt?", a: ["Tulipa", "Viola × wittrockiana", "Crocus vernus", "Phlomis russeliana"], c: 3 },
  ];

  // ---------- Helpers ----------
  async function rpc(fn, args){
    const r = await fetch(URL_ + fn, { method:"POST", headers:{ "apikey":KEY, "Authorization":"Bearer " + KEY, "Content-Type":"application/json" }, body:JSON.stringify(args) });
    const txt = await r.text(); let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) throw new Error((data && (data.message || data.hint)) || txt || "Fehler");
    return data;
  }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function msg(e){
    const m = String(e && e.message || e);
    if (/nicht gefunden/i.test(m)) return "Spiel nicht gefunden. Prüfe den Code.";
    if (/Name/i.test(m)) return "Der Name braucht 2 bis 20 Zeichen.";
    if (/voll/i.test(m)) return "Das Spiel ist voll.";
    if (/geschlossen/i.test(m)) return "Zu spät – die Frage ist schon geschlossen.";
    if (/fetch|network|Failed/i.test(m)) return "Keine Verbindung. Prüfe dein Internet.";
    return "Das hat nicht geklappt. Versuche es nochmals.";
  }
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

  BEAMER ? beamer() : player();

  // =================================================================
  //  SPIELER (Handy)
  // =================================================================
  function player(){
    let code = (qs.get("code") || store("rq:code") || "").replace(/\D/g, "").slice(0, 6);
    let pid = null, name = "", lastKey = "", timer = null, answeredQ = -1;

    function login(err){
      app.innerHTML = `<div class="wrap">
        <div class="top"><a href="../">← Alle Apps</a><span>BBZ BL · EFZ 2</span></div>
        <h1>Rückblick-Quiz</h1><p class="sub">Kurstag 1 – Gestalten mit Pflanzen</p>
        <div class="card">
          <label for="c">Spiel-Code (steht am Beamer)</label>
          <input id="c" inputmode="numeric" maxlength="6" placeholder="z. B. 4821" value="${esc(code)}">
          <label for="n">Dein Name</label>
          <input id="n" maxlength="20" placeholder="Vorname" value="${esc(store("rq:name") || "")}">
          <button class="btn" id="go">Mitspielen</button>
          <div class="err" id="err">${esc(err || "")}</div>
        </div>
      </div>`;
      $("#go").onclick = async () => {
        code = $("#c").value.replace(/\D/g, ""); name = $("#n").value.trim();
        if (code.length < 4) return $("#err").textContent = "Bitte den Code eingeben.";
        $("#go").disabled = true;
        try {
          pid = await rpc("rq_join", { p_code: code, p_name: name });
          store("rq:code", code); store("rq:name", name); store("rq:pid:" + code, pid);
          poll();
        } catch (e) { $("#err").textContent = msg(e); $("#go").disabled = false; }
      };
    }

    async function poll(){
      clearTimeout(timer);
      try {
        const s = await rpc("rq_state", { p_code: code, p_player: pid });
        if (!s) { pid = null; return login("Das Spiel wurde beendet."); }
        render(s);
      } catch (e) { /* kurz offline: weiter versuchen */ }
      timer = setTimeout(poll, 1000);
    }

    function header(s){
      const me = s.me || {};
      return `<div class="top"><span>${esc(me.name || name)}</span><span class="pill">${me.score || 0} Punkte</span></div>`;
    }

    function render(s){
      const key = [s.phase, s.q, s.my ? s.my.choice + "/" + s.my.correct : "-", s.me ? s.me.score : 0].join("|");
      if (key === lastKey) return; lastKey = key;
      const me = s.me || {};
      let body = "";
      if (s.phase === "lobby") {
        body = `<div class="card center"><div class="big">Du bist dabei! 🌱</div><p>Schau auf den Beamer.<br>Gleich geht es los …</p><div class="spinner"></div><p class="muted">${s.players} Personen im Spiel</p></div>`;
      } else if (s.phase === "question") {
        const q = Q[s.q];
        if (s.my || answeredQ === s.q) {
          body = `<div class="result wait"><div class="big">Antwort gespeichert</div><p>Warte auf die anderen …</p><div class="spinner"></div></div>`;
        } else {
          body = `<p class="center muted">Frage ${s.q + 1} von ${Q.length}</p><div class="card"><b>${esc(q.q)}</b></div>
            <div class="answers">${q.a.map((t, i) => `<button class="ans c${i}" data-i="${i}"><span class="sym">${SYM[i]}</span>${esc(t)}</button>`).join("")}</div>
            <div class="err" id="err"></div>`;
        }
      } else if (s.phase === "reveal") {
        const q = Q[s.q];
        if (!s.my) body = `<div class="result no"><div class="big">Keine Antwort</div><p>Richtig war: ${SYM[q.c]} ${esc(q.a[q.c])}</p></div>`;
        else if (s.my.correct) body = `<div class="result ok"><div class="big">Richtig! ✔</div><p class="big">+${s.my.points}</p></div>`;
        else body = `<div class="result no"><div class="big">Leider falsch ✘</div><p>Richtig war: ${SYM[q.c]} ${esc(q.a[q.c])}</p></div>`;
        body += `<p class="center muted">Schau auf den Beamer.</p>`;
      } else if (s.phase === "leaderboard") {
        body = `<div class="card center"><p class="muted">Dein Zwischenrang</p><div class="big" style="font-size:56px">${me.rank || "–"}.</div><p>von ${s.players}</p><span class="pill">${me.score || 0} Punkte</span></div>`;
      } else if (s.phase === "end") {
        const r = me.rank || 0;
        const medal = r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : "🌿";
        body = `<div class="card center"><div style="font-size:70px">${medal}</div><div class="big">Rang ${r || "–"} von ${s.players}</div><p><span class="pill">${me.score || 0} Punkte</span></p><p>Danke fürs Mitspielen!</p></div>`;
      }
      app.innerHTML = `<div class="wrap">${header(s)}${body}</div>`;
      document.querySelectorAll(".ans").forEach(b => b.onclick = async () => {
        const i = +b.dataset.i;
        document.querySelectorAll(".ans").forEach(x => { x.disabled = true; if (x !== b) x.style.opacity = .3; });
        try { await rpc("rq_answer", { p_code: code, p_player: pid, p_q: s.q, p_choice: i }); answeredQ = s.q; lastKey = ""; }
        catch (e) { const el = $("#err"); if (el) el.textContent = msg(e); }
      });
    }

    const saved = code && store("rq:pid:" + code);
    if (saved && !qs.get("neu")) { pid = saved; name = store("rq:name") || ""; poll(); } else login();
  }

  // =================================================================
  //  BEAMER (Lehrperson)
  // =================================================================
  function beamer(){
    document.body.classList.add("beamer");
    let code = store("rq:hostcode"), token = store("rq:hosttoken");
    let st = null, busy = false, timer = null, lastQ = -2, prevRanks = {};
    const joinUrl = location.origin + location.pathname;

    async function newGame(){
      code = String(Math.floor(1000 + Math.random() * 9000));
      token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()) + "x";
      await rpc("rq_create", { p_code: code, p_token: token });
      store("rq:hostcode", code); store("rq:hosttoken", token);
    }
    async function start(){
      app.innerHTML = `<div class="bm"><div class="bm-main center"><div class="spinner"></div></div></div>`;
      try {
        if (!code || !token || qs.has("neu")) { await newGame(); try { history.replaceState(null, "", location.pathname + "?beamer=1"); } catch (e) {} }
        else { try { await rpc("rq_host", { p_code: code, p_token: token }); } catch (e) { await newGame(); } }
        poll();
      } catch (e) { app.innerHTML = `<div class="bm"><div class="bm-main center"><div class="big">${esc(msg(e))}</div><p><button class="btn" onclick="location.reload()">Nochmals</button></p></div></div>`; }
    }
    async function setPhase(p, q){ await rpc("rq_phase", { p_code: code, p_token: token, p_phase: p, p_q: q }); }
    async function reveal(){ if (busy) return; busy = true;
      try { await rpc("rq_reveal", { p_code: code, p_token: token, p_q: st.q, p_correct: Q[st.q].c, p_limit: LIMIT }); } finally { busy = false; } }
    async function next(){
      if (busy || !st) return; busy = true;
      try {
        if (st.phase === "lobby") await setPhase("question", 0);
        else if (st.phase === "question") { busy = false; await reveal(); busy = true; }
        else if (st.phase === "reveal") {
          prevRanks = {}; (st.players || []).forEach((p, i) => prevRanks[p.id] = i);
          await setPhase(st.q >= Q.length - 1 ? "end" : "leaderboard", st.q);
        }
        else if (st.phase === "leaderboard") await setPhase("question", st.q + 1);
      } catch (e) {} finally { busy = false; lastKey = ""; poll(); }
    }
    document.addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowRight" || e.code === "Enter") { e.preventDefault(); next(); } });

    let lastKey = "";
    async function poll(){
      clearTimeout(timer);
      try {
        st = await rpc("rq_host", { p_code: code, p_token: token });
        if (st.phase === "question") {
          const left = LIMIT - (st.elapsed || 0);
          if ((left <= 0 || (st.players.length && st.answered >= st.players.length)) && !busy) { await reveal(); st = await rpc("rq_host", { p_code: code, p_token: token }); }
        }
        render();
      } catch (e) {}
      timer = setTimeout(poll, 800);
    }

    function head(right){
      return `<div class="bm-head"><span>🌿 <b>Rückblick-Quiz</b> · Kurstag 1 – Gestalten mit Pflanzen</span><span>${right || ""}</span></div>`;
    }
    function foot(label){
      return `<div class="bm-foot"><span class="hint">Weiter mit Leertaste oder Klick · Code <b>${code}</b> · ${st.players.length} Spieler</span>${label ? `<button class="btn" id="nx">${label}</button>` : "<span></span>"}</div>`;
    }

    function render(){
      const s = st; const key = [s.phase, s.q, s.answered, s.players.length, s.phase === "question" ? Math.ceil(LIMIT - s.elapsed) : ""].join("|");
      if (key === lastKey) return; lastKey = key;
      let html = "";
      if (s.phase === "lobby") {
        html = head("Lobby") + `<div class="bm-main"><div class="lobby">
            <div class="center"><div class="qr" id="qr"></div><p class="url">${esc(joinUrl.replace(/^https?:\/\//, ""))}</p></div>
            <div><p style="font-size:3vh;margin:0">Handy öffnen, QR-Code scannen<br>und diesen Code eingeben:</p>
              <div class="code">${code}</div>
              <p style="font-size:2.6vh">${s.players.length} angemeldet</p>
              <div class="names">${s.players.map(p => `<span>${esc(p.name)}</span>`).join("")}</div></div>
          </div></div>` + foot(s.players.length ? "Quiz starten ▶" : "");
      } else if (s.phase === "question") {
        const q = Q[s.q]; const left = Math.max(0, Math.ceil(LIMIT - s.elapsed));
        html = head(`Frage ${s.q + 1} / ${Q.length}`) + `<div class="bm-main">
            <div class="qtitle">${esc(q.q)}</div>
            <div class="qmid"><div class="timer">${left}</div><div class="cnt"><b>${s.answered}</b>Antworten</div></div>
            <div class="answers">${q.a.map((t, i) => `<div class="ans c${i}"><span class="sym">${SYM[i]}</span>${esc(t)}</div>`).join("")}</div>
          </div>` + foot("Auflösen");
      } else if (s.phase === "reveal") {
        const q = Q[s.q]; const n = s.players.length || 1;
        html = head(`Frage ${s.q + 1} / ${Q.length}`) + `<div class="bm-main">
            <div class="qtitle">${esc(q.q)}</div>
            <div class="answers">${q.a.map((t, i) => `<div class="ans c${i} ${i === q.c ? "" : "dim"}"><span class="sym">${i === q.c ? "✔" : SYM[i]}</span>${esc(t)}<span class="bar">${(s.dist || [])[i] || 0}</span></div>`).join("")}</div>
            <p class="center" style="font-size:2.6vh;margin-top:2.5vh">${pct(((s.dist || [])[q.c]) || 0, n)} % haben richtig geantwortet</p>
          </div>` + foot(s.q >= Q.length - 1 ? "Siegerpodest 🏆" : "Rangliste");
      } else if (s.phase === "leaderboard") {
        const top = s.players.slice(0, 8);
        html = head(`Rangliste nach Frage ${s.q + 1} / ${Q.length}`) + `<div class="bm-main"><div class="board">
            ${top.map((p, i) => { const d = prevRanks[p.id]; const mv = d === undefined || d === i ? "" : d > i ? ` <span style="color:var(--g)">▲${d - i}</span>` : ` <span style="color:#E8826B">▼${i - d}</span>`;
              return `<div class="row ${i === 0 ? "top1" : ""}"><span class="rk">${i + 1}.</span><span>${esc(p.name)}${mv}</span><span class="pts">${p.score}</span></div>`; }).join("")}
          </div></div>` + foot("Nächste Frage ▶");
      } else if (s.phase === "end") {
        const p = s.players; const n = p.length || 1;
        const rate = Q.map((q, i) => { const x = (s.stats || []).find(z => z.q === i); return { i, r: x ? x.ok / n : 0 }; });
        const hard = rate.sort((a, b) => a.r - b.r).slice(0, 3);
        const pod = (k, cls) => p[k] ? `<div class="pod ${cls}"><div class="nm">${esc(p[k].name)}</div><div class="pt">${p[k].score} Punkte</div><div class="blk">${k + 1}</div></div>` : `<div class="pod ${cls}"></div>`;
        html = head("Siegerpodest 🏆") + `<div class="bm-main">
            <div class="podium">${pod(1, "p2")}${pod(0, "p1")}${pod(2, "p3")}</div>
            <p class="center" style="font-size:2.6vh;margin:3vh 0 0">Die 3 anspruchsvollsten Fragen</p>
            <div class="hard">${hard.map(h => `<div><b>${Math.round(h.r * 100)} % richtig</b>${esc(Q[h.i].q)}<i>✔ ${esc(Q[h.i].a[Q[h.i].c])}</i></div>`).join("")}</div>
          </div>` + `<div class="bm-foot"><span class="hint">Code ${code} · ${n} Spieler</span><button class="btn" id="neu">Neues Spiel</button></div>`;
      }
      app.innerHTML = `<div class="bm">${html}</div>`;
      const nx = $("#nx"); if (nx) nx.onclick = next;
      const nb = $("#neu"); if (nb) nb.onclick = () => { store("rq:hostcode", ""); store("rq:hosttoken", ""); location.href = location.pathname + "?beamer=1&neu=1"; };
      if (s.phase === "lobby") drawQR();
    }
    function drawQR(){
      const el = $("#qr"); if (!el || typeof qrcode === "undefined") return;
      const q = qrcode(0, "M"); q.addData(joinUrl + "?code=" + code); q.make();
      el.innerHTML = q.createImgTag(8, 0);
    }
    start();
  }
})();
</script>
</body>
</html>
