<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 Lade-Champion · Abschlussspiel L63–65</title>
<style>
:root{--bg:#12161a;--card:#1d242b;--ink:#f3f5f2;--mut:#9fb0a6;--g:#98c723;--ok:#2ecc71;--bad:#ff5a5a;--y:#ffc400}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:2.2vh 3vw}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--mut);font-size:2.2vh}
.top a{color:var(--mut);text-decoration:none}
.stripes{height:1.2vh;background:repeating-linear-gradient(45deg,var(--y) 0 2vh,#222 2vh 4vh);border-radius:6px;margin:1.2vh 0 2vh}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:7vh;margin:0 0 2vh}
.rules{font-size:3.4vh;line-height:1.5;max-width:1300px}
.rules b{color:var(--y)}
.tag{display:inline-block;background:#2a333c;border-radius:999px;padding:.6vh 2vh;font-weight:800;font-size:2.4vh;color:var(--g);margin-bottom:2.4vh}
.stmt{font-size:6vh;font-weight:800;line-height:1.25;max-width:1500px}
.thumbs{display:flex;gap:6vw;margin-top:4vh;font-size:4vh;font-weight:900}
.thumbs div{background:var(--card);border-radius:3vh;padding:2vh 4vh}
.cd{font-size:12vh;font-weight:900;color:var(--y);margin-top:2vh;font-variant-numeric:tabular-nums}
.verdict{font-size:11vh;font-weight:900;margin:1vh 0}
.verdict.r{color:var(--ok)}.verdict.f{color:var(--bad)}
.why{font-size:3.6vh;max-width:1400px;background:var(--card);border-radius:2.4vh;padding:2.4vh 3.4vh;line-height:1.4;margin-top:1vh}
.joker{font-size:7vh;font-weight:900;color:var(--y)}
.bar{display:flex;gap:1.2vw;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2vh}
button{font:inherit;border:0;border-radius:1.6vh;padding:1.6vh 3vh;font-size:2.8vh;font-weight:900;cursor:pointer}
.go{background:var(--g);color:#12161a}
.sec{background:#2a333c;color:var(--ink)}
.prog{height:1vh;background:#2a333c;border-radius:9px;overflow:hidden;margin-top:2vh}
.prog i{display:block;height:100%;background:var(--g);transition:width .4s}
.hint{color:var(--mut);font-size:2vh;margin-top:1.4vh}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:sh .5s}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">← Alle Apps</a><span>🚚 L63 · L64 · L65 · Transport & Ladungssicherung</span><span id="cnt"></span></div>
  <div class="stripes"></div>
  <div class="stage" id="stage"></div>
  <div class="prog"><i id="pg" style="width:0%"></i></div>
  <div class="hint">Leertaste oder ➜ = weiter · Esc = Start · Ton: <label><input type="checkbox" id="snd" checked> an</label></div>
</div>
<script>
const Q=[
 ["Bei einem Überhang von 1.5 m hinten brauche ich einen Signalkörper.",1,"Richtig: Ragt die Ladung hinten <b>mehr als 1 m</b> über, braucht es einen Signalkörper (Kugel, Pyramide, Fahne)."],
 ["Der Überhang hinten wird ab Ende der Ladefläche gemessen.",0,"Falsch: Gemessen wird ab <b>Mitte Hinterachse</b>. Erlaubt sind dort höchstens <b>5 m</b>."],
 ["Mit einer Antirutschmatte darf ich auf Gurte verzichten.",0,"Falsch: Die Matte erhöht die Reibung, ersetzt aber die Sicherung nicht. Beim Niederzurren immer <b>2 Gurte</b>."],
 ["Ein flach gespannter Gurt drückt die Ladung stärker auf die Brücke als ein steiler.",0,"Falsch: <b>Steil</b> drückt stark nach unten, flach nur etwa <b>halb so stark</b>."],
 ["Doppelt so schnell in die Kurve = doppelt so viel Kraft auf die Ladung.",0,"Falsch: Doppelt so schnell = <b>4-mal</b> so viel Kraft!"],
 "JOKER",
 ["Mit 14 Jahren darf ich nach einer Instruktion den Palettenhubwagen bedienen.",0,"Falsch: Mindestalter <b>15 Jahre</b> (SUVA) und eine dokumentierte <b>Instruktion</b>."],
 ["Für die Ladung verantwortlich ist die Person, die geladen hat.",0,"Falsch: Verantwortlich ist <b>immer die Person am Steuer</b>. Sie wird gebüsst."],
 ["Direktzurren ist laut Ordner die beste Sicherungsmethode.",1,"Richtig: Die Gurte halten die Ladung direkt in alle Richtungen. Es braucht aber <b>mehr Gurte</b>."],
 ["Bei Frost darf ich nassen Kies laden, wenn ich langsam fahre.",0,"Falsch: Tropfendes Wasser <b>gefriert auf der Strasse</b> ➜ Glatteis. Auch langsam verboten."],
 ["3500 kg Gesamtgewicht, 2300 kg leer. 2 Mitfahrer (200 kg) und 0.6 m³ Kiessand (1 m³ = 1800 kg) sind erlaubt.",0,"Falsch: Erlaubt sind 1200 kg. 200 + 1080 = <b>1280 kg</b> ➜ 80 kg zu viel = <b>überladen</b>."],
 "JOKER",
 ["Eine Lücke zur Stirnwand macht den Aufprall bei einer Vollbremsung stärker.",1,"Richtig: In der Lücke nimmt die Ladung <b>Schwung</b> und knallt gegen die Wand. Darum <b>formschlüssig</b> laden."],
 ["Weihnachtssterne kommen in Schrumpffolie, damit sie nicht zerkratzen.",0,"Falsch: Die Folie schützt vor <b>Temperaturschock</b> (Kälte)."],
 ["Die Lenkachse muss mindestens 20 % des Gewichts tragen.",1,"Richtig: Sonst wird vorne zu leicht ➜ <b>schlecht lenken und bremsen</b>. Nicht alles Schwere ganz hinten laden!"],
 ["Pflanzen auf der offenen Brücke trocknen auf der Autobahn schneller aus.",1,"Richtig: Mehr Tempo = mehr <b>Fahrtwind</b>. Abdecken oder Landstrasse fahren."],
 ["Die Ladung darf seitlich 10 cm über das Fahrzeug hinausragen.",0,"Falsch: Die Ladung darf höchstens so breit sein wie das <b>Fahrzeug</b>."],
 "FINALE",
 ["Beim Auffahrunfall mit 50 km/h ist die Kraft auf die Ladung ungefähr gleich gross wie bei einer Vollbremsung.",0,"Falsch: Beim Unfall ist sie etwa <b>5-mal so gross</b>. Nur sehr gut gesicherte Ladung hält."]
];
const $=id=>document.getElementById(id);
let i=-1, phase="start", timer=null;
const TIME=10;
let AC=null;
function beep(f,d,type="sine",vol=.25){if(!$("snd").checked)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function fanfare(){[523,659,784,1046].forEach((f,k)=>setTimeout(()=>beep(f,.25,"triangle",.3),k*140));}
function buzz(){beep(140,.5,"sawtooth",.25);}
const real=Q.filter(q=>Array.isArray(q)).length;
function nr(){return Q.slice(0,i+1).filter(q=>Array.isArray(q)).length;}
function render(html,cls){const s=$("stage");s.innerHTML=html;s.classList.remove("pop","shake");void s.offsetWidth;if(cls)s.classList.add(cls);$("pg").style.width=Math.max(0,nr()/real*100)+"%";$("cnt").textContent=i>=0&&i<Q.length?`Frage ${nr()} / ${real}`:"";}
function start(){i=-1;phase="start";clearInterval(timer);
 render(`<h1>🏆 Lade-Champion</h1><div class="rules">
  1️⃣ <b>Alle stehen auf.</b><br>
  2️⃣ Eine Aussage erscheint. Ihr habt <b>10 Sekunden</b>.<br>
  3️⃣ Alle gleichzeitig: <b>👍 Daumen hoch = richtig</b> · <b>👎 Daumen runter = falsch</b><br>
  4️⃣ Wer falsch liegt, <b>setzt sich</b>. Bei ⭐ <b>JOKER</b> stehen alle wieder auf!<br>
  🏆 Wer im <b>FINALE</b> noch steht, ist <b>Lade-Champion</b>.</div>
  <div class="bar"><button class="go" onclick="next()">▶ Start</button></div>`,"pop");}
function next(){clearInterval(timer);
 if(phase==="ask"){reveal();return;}
 i++;
 if(i>=Q.length){phase="end";fanfare();render(`<h1>🏆 Lade-Champions!</h1><div class="rules">Wer noch steht: <b>Applaus!</b> 👏<br>Ihr wisst jetzt, wie man Ladung richtig sichert.<br><br>➜ Jetzt: <b>Checkout</b> in der Tages-App = Ticket zum Aufräumen 🎟️</div><div class="bar"><button class="sec" onclick="start()">↺ Nochmals</button></div>`,"pop");return;}
 const q=Q[i];
 if(q==="JOKER"){phase="joker";fanfare();render(`<div class="joker">⭐ JOKER! ⭐</div><div class="rules">Alle stehen wieder auf!</div><div class="bar"><button class="go" onclick="next()">Weiter ➜</button></div>`,"pop");return;}
 if(q==="FINALE"){phase="joker";fanfare();render(`<div class="joker">🔥 FINALE 🔥</div><div class="rules">Nur wer jetzt noch steht, spielt mit.<br>Die schwierigste Frage kommt …</div><div class="bar"><button class="go" onclick="next()">Weiter ➜</button></div>`,"pop");return;}
 phase="ask";let t=TIME;
 render(`<span class="tag">Richtig oder falsch?</span><div class="stmt">${q[0]}</div><div class="thumbs"><div>👍 richtig</div><div>👎 falsch</div></div><div class="cd" id="cd">${t}</div><div class="bar"><button class="sec" onclick="reveal()">Auflösen ➜</button></div>`,"pop");
 timer=setInterval(()=>{t--;const c=$("cd");if(c)c.textContent=t;if(t<=3&&t>0)beep(880,.12);else if(t>3)beep(440,.05,"sine",.08);if(t<=0){clearInterval(timer);beep(220,.4,"square",.2);const c2=$("cd");if(c2){c2.textContent="Daumen hoch!";c2.style.fontSize="7vh";}}},1000);
}
function reveal(){clearInterval(timer);if(phase!=="ask")return;phase="rev";const q=Q[i];
 q[1]?fanfare():buzz();
 render(`<div class="stmt" style="font-size:4.2vh;opacity:.85">${q[0]}</div><div class="verdict ${q[1]?"r":"f"}">${q[1]?"👍 RICHTIG":"👎 FALSCH"}</div><div class="why">${q[2]}</div><div class="rules" style="font-size:3vh;margin-top:1.6vh">Wer falsch lag: <b>hinsetzen</b>.</div><div class="bar"><button class="go" onclick="next()">Nächste ➜</button></div>`,q[1]?"pop":"shake");}
document.addEventListener("keydown",e=>{if(e.key===" "||e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();if(phase==="start"||phase==="joker"||phase==="rev"||phase==="ask")next();}else if(e.key==="Escape")start();});
start();
</script>
</body>
</html>
