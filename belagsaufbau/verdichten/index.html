älle wird das Planum erstellt?", "opts": ["Waagrecht", "Im gleichen Gefälle wie der Deckbelag", "Gegen das Haus", "Beliebig"], "a": 1, "why": "So fliesst Wasser ab und die Aufbaustärke ist überall gleich."}]}, {"type": "match", "title": "Geräte zuordnen", "task": "Tippe links ein Gerät an, dann rechts den passenden Einsatz.", "pairs": [["Handstampfer", "Randbereiche und kleine Flächen (Notlösung)"], ["Vibrationsstampfer", "Gräben, Ränder, bindiges Material"], ["Rüttelplatte", "Wege, Plätze, Pflaster und Fundation"], ["Vibrationswalze", "Grosse Flächen und Zufahrten"]]}, {"type": "quiz", "title": "Foto-Quiz: Geräte erkennen", "questions": [{"q": "Welches Gerät siehst du?", "opts": ["Handstampfer", "Vibrationsstampfer", "Vibrationswalze", "Rüttelplatte"], "a": 1, "why": "Der Vibrationsstampfer verdichtet in Gräben, an Kanten und auf kleinen Flächen.", "img": "../img/ph_stampfer.jpg"}, {"q": "Welches Gerät siehst du?", "opts": ["Vibrationsstampfer", "Handstampfer", "Rüttelplatte (Reversierplatte)", "Dumper"], "a": 2, "why": "Die Rüttelplatte verdichtet Wege und Plätze.", "img": "../img/ph_ruettel.jpg"}, {"q": "Dieses Gerät verdichtet die Fundation auf einer Fläche von 25 m². Wie heisst es?", "opts": ["Vibrationsstampfer", "Rüttelplatte", "Handstampfer", "Walze"], "a": 1, "why": "Rüttelplatte (Reversierplatte): fährt vor und zurück, geeignet für Wege und Plätze.", "img": "../img/lk_image9.png"}], "info": "Schau genau hin.", "count": 3}, {"type": "quiz", "title": "Fälle: Welches Gerät, welche Lage?", "questions": [{"q": "Leitungsgraben, 40 cm breit: Welches Gerät verdichtest du damit?", "opts": ["Vibrationswalze", "Vibrationsstampfer", "Grosse Rüttelplatte 400 kg", "Dumper"], "a": 1, "why": "Der Stampfer arbeitet in Gräben, an Kanten und auf kleinen Flächen."}, {"q": "Garageneinfahrt 25.6 m² mit 30 cm Fundation: Gerät und Vorgehen?", "opts": ["Handstampfer, ein Zug", "Rüttelplatte, 2 Lagen", "Walze 10 t, ein Zug", "Nichts, Kies setzt sich selbst"], "a": 1, "why": "Mehr a
