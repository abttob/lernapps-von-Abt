<!DOCTYPE html><html lang="de-CH"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lehrer-Dashboard</title><link rel="stylesheet" href="../assets/app.css">
<style>.wrap{max-width:1200px}table.pr{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff;border-radius:14px;overflow:hidden}table.pr th,table.pr td{border:1px solid var(--line);padding:.5rem .45rem;text-align:center}table.pr th{background:#e8f6e2;position:sticky;top:0;font-size:.8rem}table.pr td:first-child,table.pr th:first-child{text-align:left;font-weight:800;position:sticky;left:0;background:#fff}.sc{min-width:56px;font-weight:800;border-radius:8px;padding:.15rem .3rem;display:inline-block}.sc small{display:block;font-size:.68rem;font-weight:700;opacity:.8}
.g0{background:#f1f1f1;color:#999}.g1{background:#fde0de}.g2{background:#fff0b8}.g3{background:#d6f5d3}.scroll{overflow:auto;max-height:70vh;border-radius:14px;border:3px solid var(--line)}.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}.tools .btn{width:auto;min-height:48px;font-size:.95rem;margin:0}</style></head><body>
<div class="hero"><a href="../">← Alle Lernpfade</a><div class="who" id="who"></div><h1>👩‍🏫 Lehrer-Dashboard</h1><p>Lernfortschritt aller Lernenden und die Fotos der Klasse</p></div>
<div class="wrap" id="root"><div class="card">Lädt …</div></div>
<script src="../assets/config.js"></script><script src="../assets/core.js"></script>
<script>
const APPS=[{"slug": "schichtaufbau", "title": "Schichtaufbau und Toleranzen", "icon": "🧱", "stages": 6}, {"slug": "koernung", "title": "Körnungen und Fundationsmaterial", "icon": "🔬", "stages": 3}, {"slug": "verdichten", "title": "Verdichten und Geräte", "icon": "🔨", "stages": 4}, {"slug": "verkehrslast", "title": "Verkehrslastklassen und Fundationsstärke", "icon": "🚗", "stages": 3}, {"slug": "planum", "title": "Bankett und Planum", "icon": "📐", "stages": 3}, {"slug": "mengen", "title": "Mengen, Fahrten und Kosten", "icon": "🚛", "stages": 4}, {"slug": "einfassungen", "title": "Einfassungen und Rasenrand", "icon": "🧩", "stages": 4}, {"slug": "betonbedarf", "title": "Betonbedarf in Litern", "icon": "🧮", "stages": 3}, {"slug": "gefaelle", "title": "Rechenwerkstatt: Gefälle, Kote, Einheiten", "icon": "📐", "stages": 6}, {"slug": "verlegemuster", "title": "Verlegemuster, Verschnitt und Verlegen", "icon": "🔷", "stages": 6}, {"slug": "bauweisen", "title": "Bauweisen und sickerfähige Beläge", "icon": "🧩", "stages": 6}, {"slug": "natursteine", "title": "Natursteine: Gesteine und Oberflächen", "icon": "🪨", "stages": 4}, {"slug": "material", "title": "Holz, Materialien und Instandhaltung", "icon": "🪵", "stages": 5}, {"slug": "fall", "title": "Fall Splitt-Weber: Plane die Anlage", "icon": "🏡", "stages": 4}, {"slug": "kolloquium", "title": "Mini-Kolloquium: Alles gemischt", "icon": "🎯", "stages": 1}, {"slug": "materialbuch", "title": "Materialsammlung: eigene Fotos sammeln", "icon": "📸", "stages": 0}, {"slug": "belaganalyse", "title": "Belag-Detektive: draussen analysieren", "icon": "🔍", "stages": 0}, {"slug": "lernkarten", "title": "Lernkarten: alles üben", "icon": "🃏", "stages": 0}];
const $=s=>document.querySelector(s),esc=LA.esc;
const cls=p=>p==null?'g0':p>=80?'g3':p>=50?'g2':'g1';
LA.requireLogin().then(async()=>{
 LA.who($('#who'));const root=$('#root');
 if(LA.user.role!=='teacher'){root.innerHTML=`<div class="card"><b>Nur für Lehrpersonen.</b><p>Du bist als <b>${LA.esc(LA.user.name)}</b> (Lernende/r) angemeldet. Das Dashboard öffnet sich nur mit einem Lehrer-Konto: Melde dich ab, wähle «Neu registrieren» und gib im Feld <b>Klassencode</b> den <b>Lehrercode</b> ein.</p><button class="btn" id="lo">Abmelden und als Lehrperson anmelden</button></div>`;document.getElementById('lo').onclick=()=>LA.logout();return}
 root.innerHTML='<div class="card">Lädt …</div>';
 let profs,prog;try{[profs,prog]=await Promise.all([LA.profiles(),LA.allProgress()])}catch(e){root.innerHTML='<div class="msg err">'+esc(e.message)+'</div>';return}
 const stu=profs.filter(p=>p.role==='student');const by={};prog.forEach(r=>{(by[r.user_id]=by[r.user_id]||{})[r.slug]=r});
 const quiz=APPS.filter(a=>a.stages>0);
 function table(){const h='<tr><th>Lernende</th>'+APPS.map(a=>`<th title="${esc(a.title)}">${a.icon}<br>${esc(a.title.split(':')[0].slice(0,18))}</th>`).join('')+'<th>Fertig</th><th>Zuletzt aktiv</th></tr>';
  const rows=stu.map(s=>{const P=by[s.id]||{};let done=0,last='';
   const cells=APPS.map(a=>{const r=P[a.slug];if(!r)return'<td><span class="sc g0">–</span></td>';const d=r.data||{};const best=d.best!=null?d.best:r.pct;
    if(a.stages>0&&(d.runs||0)>0)done++;if(!last||r.updated_at>last)last=r.updated_at;
    const sub=a.stages>0?`Stufe ${Math.min(d.stage||0,a.stages)}/${a.stages}`:(d.count!=null?d.count+' Einträge':'');
    return`<td><span class="sc ${cls(a.stages>0?(d.runs?best:null):r.pct)}">${a.stages>0&&!d.runs?(r.pct||0)+'%':r.pct+'%'}<small>${sub}</small></span></td>`}).join('');
   return`<tr><td>${esc(s.name)}</td>${cells}<td><b>${done}/${quiz.length}</b></td><td>${last?new Date(last).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'–'}</td></tr>`}).join('');
  return`<div class="scroll"><table class="pr">${h}${rows||'<tr><td colspan="99">Noch keine Lernenden registriert.</td></tr>'}</table></div>`}
 root.innerHTML=`<div class="card"><h2 style="margin-top:0">Lernfortschritt (${stu.length} Lernende)</h2><p class="small">Grün ab 80 %, gelb ab 50 %. «Stufe 3/6» = so weit ist die Person im Lernpfad. Prozent = bestes Resultat nach dem ersten kompletten Durchgang, sonst Fortschritt.</p><div class="tools"><button class="btn small" id="csv">⬇ CSV exportieren</button><button class="btn small sec" id="rf">🔄 Aktualisieren</button></div>${table()}</div>
 <div class="card"><h2 style="margin-top:0">📸 Materialsammlung (Fotos der Klasse)</h2><div id="mb" class="pgrid">Lädt …</div></div>
 <div class="card"><h2 style="margin-top:0">🔍 Belag-Detektive (Gruppen-Ergebnisse)</h2><div id="ba">Lädt …</div></div>`;
 $('#rf').onclick=()=>location.reload();
 $('#csv').onclick=()=>{const head=['Name',...APPS.map(a=>a.title),'Fertig'];const lines=[head].concat(stu.map(s=>{const P=by[s.id]||{};return[s.name,...APPS.map(a=>P[a.slug]?P[a.slug].pct:''),Object.values(P).filter(r=>r.data&&r.data.runs).length]}));
  const csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='lernfortschritt.csv';a.click()};
 try{const ph=(await LA.list('photo')).filter(r=>(r.data.ctx||'').startsWith('material:'));
  $('#mb').innerHTML=ph.length?ph.map(r=>`<div class="photo"><img src="${esc(r.data.url)}" loading="lazy"><div><b>${esc(r.data.ctx.slice(9))}</b> · ${esc(r.owner_name)}<br>${esc(r.data.caption||'')}<br><a href="#" data-d="${r.id}">löschen</a></div></div>`).join(''):'<span class="small">Noch keine Fotos.</span>';
  const rep=await LA.list('report');const allp=await LA.list('photo');
  $('#ba').innerHTML=rep.length?rep.map(r=>{const d=r.data,fs=allp.filter(p=>p.data.ctx==='report:'+r.id);return`<div class="card" style="box-shadow:none"><b>${esc(r.grp||'')}</b> · ${esc(d.ort||'')} <span class="small">(${esc(r.owner_name)})</span><br>Belag: ${esc(d.belag||'')} · Bewertung: ${'★'.repeat(d.sterne||0)}<br><span class="small">${esc(d.gut||'')}</span><div class="pgrid" style="margin-top:.5rem">${fs.map(p=>`<div class="photo"><img src="${esc(p.data.url)}" loading="lazy"><div>${esc(p.data.caption||'')}<br><a href="#" data-d="${p.id}">Foto löschen</a></div></div>`).join('')}</div><a href="#" data-r="${r.id}">Bericht löschen</a></div>`}).join(''):'<span class="small">Noch keine Berichte.</span>';
  document.body.addEventListener('click',async e=>{const a=e.target.closest('a[data-d],a[data-r]');if(!a)return;e.preventDefault();if(!confirm('Wirklich löschen?'))return;await LA.remove(a.dataset.d||a.dataset.r);location.reload()})
 }catch(e){$('#mb').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}
});
</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
