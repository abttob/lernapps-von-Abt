en", "Belag abrütteln", "Fugen erneut füllen"], "why": "Zuerst abstecken und den Boden vorbereiten, dann Tragschicht und Rand, danach Bettung und Steine. Am Schluss wird abgerüttelt und die Fuge nochmals gefüllt."}, {"type": "order", "title": "Arbeitsschritte beim Pflastern", "task": "Sortiere die Arbeitsschritte, <b>zuerst</b> oben.", "top": "⬆ zuerst", "bottom": "⬇ zuletzt", "items": ["Planum, Fundation und Randabschluss erstellen", "Bettungsschicht (Splitt 2/4) einbauen und abziehen", "Steine im Muster verlegen, Randsteine zuschneiden", "Fugenbild und Höhen kontrollieren", "Fugen vor dem Abrütteln mit Fugenmaterial füllen und abwischen", "Mit Vibroplatte (Kunststoffmatte) abrütteln, vom Rand zur Mitte", "Fugen mit Brechsand 0/4 einwischen und nochmals abrütteln", "Belag reinigen, später nachsanden (Unterhaltsarbeit)"], "why": "Der Randabschluss kommt vor dem Verlegen. Die Bettung wird höher eingebaut, weil sie sich beim Abrütteln setzt."}, {"type": "quiz", "title": "Richtig oder falsch?", "questions": [{"q": "Betonplatten werden einvibriert.", "opts": ["Richtig", "Falsch"], "a": 1, "why": "Betonplattenbeläge werden nicht einvibriert, sondern mit dem Gummihammer angeklopft."}, {"q": "Ein Betonsteinbelag wird vom Rand gegen die Mitte abgerüttelt.", "opts": ["Richtig", "Falsch"], "a": 0, "why": "Mit dem Abrütteln beginnt man vom Rand her gegen die Mitte."}, {"q": "Warum wird die Bettungsschicht etwas höher eingebaut?", "opts": ["Sie setzt sich beim Abrütteln", "Damit sie teurer ist", "Damit Wasser abläuft", "Wegen der Frostgefahr"], "a": 0, "why": "Durch das Abrütteln setzt sich die Bettungsschicht."}, {"q": "Wie breit sind offene Fugen bei Betonplatten mit Fugenkreuzen laut J5?", "opts": ["1 mm", "3 bis 8 mm", "2 cm", "Keine Fugen"], "a": 1, "why": "Offene Fugen 3 bis 8 mm, mit Fugenkreuzen verlegt."}, {"q": "Braucht ein Betonsteinbelag einen Randabschluss?", "opts": ["Ja, zwingend", "Nein, nie", "Nur bei Naturstein", "Nur im Winter"], "a": 0, "why": "Betonsteinbeläge brauchen zwingend einen Randabschluss."}, {"q": "Mit welchem Material werden die Fugen von Verbundsteinen eingewischt?", "opts": ["Brechsand 0/4", "Kiesgemisch 0/45", "Mergel", "Rundkies 16/32"], "a": 0, "why": "Fugen mit Brechsand 0/4 einwischen und nochmals abrütteln."}, {"q": "Das Nachsanden der Fugen ist ...", "opts": ["eine Garantiearbeit", "eine Unterhaltsarbeit", "verboten", "nur bei Holz nötig"], "a": 1, "why": "Nachsanden = Unterhaltsarbeit, keine Garantiearbeit."}, {"q": "Welches Fugenmaterial wird vor dem Abrütteln auf die Fläche gebracht?", "opts": ["Gar keines", "Fugenmaterial, abgestimmt auf die Bettung", "Frischbeton", "Erde"], "a": 1, "why": "Das Fugenmaterial sollte immer auf Verfugen und Abrütteln abgestimmt sein."}, {"q": "Betonplatten reinigen mit Hochdruck ist ...", "opts": ["immer richtig", "heikel: Teilchen werden weggesprengt", "Pflicht", "nur für Holz"], "a": 1, "why": "Herstellerempfehlung beachten, Hochdruck kann Oberfläche schädigen."}]}]};</script><script src="../assets/engine.js"></script><script>startApp()</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
