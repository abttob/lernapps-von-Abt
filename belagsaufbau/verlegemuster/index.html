einem Fisch."}, {"q": "Wie viel Verlust (Verhau) rechnet J5 bei Mosaik/formwild mit?", "opts": ["Bis 5 %", "Bis 10 %", "Bis 25 %", "Keinen"], "a": 2, "why": "Je nach Bearbeitungsart bis zu 25 %. Eine Tonne Gneisplatten ergibt ca. 8 m² unbearbeitete Platten.", "h": "Das aufwendigste Muster hat den grössten Verschnitt."}, {"q": "Welche Fuge soll bei Natursteinplatten <b>vermieden</b> werden?", "opts": ["Versetzte Fugen", "Kreuzfugen", "Fugen mit Fugensand", "Fugen ≥ 3 mm"], "a": 1, "why": "Keine Kreuzfugen, keine Spinnenfugen (mehr als 4 Fugen), keine Schlangenfugen.", "h": "Wo vier Ecken zusammenstossen, entsteht eine Schwachstelle."}, {"q": "Wie gross soll der Fugenversatz mindestens sein?", "opts": ["2 cm", "5 cm", "10 cm oder 1/3 der Kantenlänge", "50 cm"], "a": 2, "why": "Fugenversatz nicht kleiner als 10 cm oder 1/3 der Kantenlänge.", "h": "Etwa eine Handbreite."}, {"q": "Wie breit sind offene Fugen bei Betonplatten mit Fugenkreuzen laut J5?", "opts": ["Keine Fuge", "1 mm", "3 bis 8 mm", "3 cm"], "a": 2, "why": "Offene Fugen 3 bis 8 mm, mit Fugenkreuzen verlegt.", "h": "Ein paar Millimeter, nicht Zentimeter."}], "bg": {"t": "Verlegemuster für Platten: <b>englisch</b> (Bahnen), <b>schottisch/römisch</b> (verschiedene Formate), <b>formwild/Mosaik</b>. Für Pflaster: Reihe, Kreis, Schuppe, Bogen, wild. Kreuzfugen vermeiden, Fugenversatz mind. 10 cm oder 1/3 der Kantenlänge. Betonplatten-Fugen 3–8 mm. Verschnitt: Bahnen ca. 5 %, Reihe 10 %, Kreis/Schuppe 15–20 %, Mosaik bis 25 %.", "lm": "S. 156–158 und 161–165", "d": "S. 27–29 und 34–35"}}, {"type": "quiz", "title": "Foto-Quiz: Pflästerungen erkennen", "questions": [{"q": "Welche Pflästerung zeigt das Foto?", "opts": ["Reihenpflästerung", "Kreispflästerung", "Bogenpflästerung", "Wildpflästerung"], "a": 0, "why": "Die Steine liegen in geraden Reihen.", "img": "../img/j_reihe.jpg", "h": "Gerade Linien."}, {"q": "Welche Pflästerung zeigt das Foto?", "opts": ["Reihenpflästerung", "Kreispflästerung", "Schuppenpflästerung", "Rundkopfpflästerung"], "a": 1, "why": "Die Steine bilden Kreise um eine Mitte.", "img": "../img/j_kreis.jpg", "h": "Ganze Kreise oder Kreisteile."}, {"q": "Welche Pflästerung zeigt das Foto?", "opts": ["Bogenpflästerung", "Wildpflästerung", "Reihenpflästerung", "Mosaik"], "a": 0, "why": "Die Steine liegen in Bögen.", "img": "../img/j_bogen.jpg", "h": "Bögen in Reihen nebeneinander."}, {"q": "Welche Pflästerung zeigt das Foto?", "opts": ["Reihenpflästerung", "Wildpflästerung", "Kreispflästerung", "Bogenpflästerung"], "a": 1, "why": "Unregelmässige Steine ohne festes Muster: Wildpflästerung.", "img": "../img/j_wild.jpg", "h": "Kein Muster erkennbar."}, {"q": "Welche Pflästerung zeigt das Foto?", "opts": ["Schuppenpflästerung", "Wildpflästerung", "Rundkopfpflästerung (Flussstein)", "Reihenpflästerung"], "a": 2, "why": "Runde Flusssteine: Rundkopfpflästerung.", "img": "../img/j_rundkopf.jpg", "h": "Runde, glatte Steine aus dem Fluss."}, {"q": "Welche Pflästerung zeigt das Foto?", "opts": ["Schuppenpflästerung", "Kreispflästerung", "Reihenpflästerung", "Bogenpflästerung"], "a": 0, "why": "Die Bögen überlagern sich wie Fischschuppen.", "img": "../img/j_schuppen.jpg", "h": "Wie Fischschuppen."}, {"q": "Diese beiden Steine haben eine einfache rechteckige Form. Was sind sie?", "opts": ["Betonverbundsteine", "Betonpflastersteine (ohne Verbundwirkung)", "Randsteine", "Sickersteine"], "a": 1, "why": "Betonpflastersteine sind rechteckig oder quadratisch, mit oder ohne Nocken.", "img": "../img/j_betonpflaster.jpg", "h": "Einfache Rechtecke ohne Verzahnung."}, {"q": "Diese beiden Steine verzahnen sich. Was sind sie?", "opts": ["Betonpflastersteine", "Betonverbundsteine", "Rasengittersteine", "Stellplatten"], "a": 1, "why": "Verbundsteine verzahnen sich und nehmen Scherkräfte des Fahrverkehrs besser auf.", "img": "../img/j_verbund.jpg", "h": "Die Steine greifen ineinander."}], "info": "Schau genau hin.", "count": 8, "bg": {"t": "Pflästerungen: <b>Reihe</b> (gerade Reihen), <b>Kreis</b> (Kreissegmente), <b>Bogen</b> (Bogenreihen), <b>Schuppe</b> (überlappende Bögen), <b>wild</b> (ohne Muster), <b>Rundkopf</b> (Flusssteine). Betonpflastersteine sind einfach rechteckig, Verbundsteine verzahnen sich.", "lm": "S. 161–165", "d": "S. 27–29"}}, {"type": "calc", "title": "Verschnitt in m²", "gens": ["verschnitt"], "count": 6, "info": "Reihe 5 %, Kreis/Schuppen ca. 15–20 %, Mosaik/formwild bis 25 % (J5)."}, {"type": "calc", "title": "Anzahl Platten bestellen", "gens": ["platten"], "count": 6, "info": "Fläche mit Verschnitt ÷ Fläche einer Platte. <b>Tipp: Immer auf ganze Platten aufrunden!</b> Auch 87.1 ergibt 88 Platten. Halbe Platten kann man nicht bestellen, und wer abrundet, hat am Schluss zu wenig."}, {"type": "order", "title": "Belagsarbeiten: von der Fundation zum Verlegen", "task": "Bringe die Arbeiten in die richtige Reihenfolge, <b>zuerst</b> oben.", "top": "⬆ zuerst", "bottom": "⬇ zuletzt", "items": ["Fundation einbauen", "Rohplanie", "Reinplanie", "Abstecken", "Bettung abziehen", "Belag verlegen"], "why": "Die Fundation wird eingebaut und roh, dann fein planiert (Rohplanie ±2 cm, Reinplanie ±1 cm). Erst danach wird abgesteckt, die Bettung abgezogen und der Belag verlegt.", "bg": {"t": "Ablauf: Fundation einbauen, Rohplanie, Reinplanie, abstecken (Höhen und Fluchten), Bettung abziehen, Belag verlegen.", "lm": "S. 146–155", "d": "S. 36"}, "h": "Von grob zu fein: Erst die Fundation grob, dann immer genauer. Erst ganz am Schluss kommt der Belag."}, {"type": "order", "title": "Pflastern: die 12 Arbeitsschritte", "task": "Bringe die Arbeitsschritte beim Pflastern in die richtige Reihenfolge, <b>zuerst</b> oben.", "top": "⬆ zuerst", "bottom": "⬇ zuletzt", "items": ["Abstecken", "Bodenabtrag («Auskoffern»)", "Verdichten des anstehenden Bodens", "Tragschicht einbauen und verdichten", "Randbefestigung herstellen", "Bettungsschicht einbauen und abziehen", "Pflastersteine verlegen", "Pflastersteine am Rand einschneiden", "Fugen füllen", "Belag abkehren", "Belag abrütteln", "Fugen erneut füllen"], "why": "Zuerst abstecken und den Boden vorbereiten, dann Tragschicht und Rand, danach Bettung und Steine. Am Schluss wird abgerüttelt und die Fuge nochmals gefüllt.", "bg": {"t": "Die 12 Schritte beim Pflastern gehen von unten nach oben: abstecken, auskoffern, Boden verdichten, Tragschicht, Rand, Bettung, verlegen, Rand einschneiden, Fugen füllen, abkehren, abrütteln, Fugen nochmals füllen.", "lm": "S. 161–165", "d": "S. 36"}, "h": "Zuerst messen, dann ausheben. Der Rand kommt vor der Bettung. Abgerüttelt wird erst, wenn die Fugen gefüllt und der Belag sauber ist."}, {"type": "order", "title": "Arbeitsschritte beim Pflastern", "task": "Sortiere die Arbeitsschritte, <b>zuerst</b> oben.", "top": "⬆ zuerst", "bottom": "⬇ zuletzt", "items": ["Planum, Fundation und Randabschluss erstellen", "Bettungsschicht (Splitt 2/4) einbauen und abziehen", "Steine im Muster verlegen, Randsteine zuschneiden", "Fugenbild und Höhen kontrollieren", "Fugen vor dem Abrütteln mit Fugenmaterial füllen und abwischen", "Mit Vibroplatte (Kunststoffmatte) abrütteln, vom Rand zur Mitte", "Fugen mit Brechsand 0/4 einwischen und nochmals abrütteln", "Belag reinigen, später nachsanden (Unterhaltsarbeit)"], "why": "Der Randabschluss kommt vor dem Verlegen. Die Bettung wird höher eingebaut, weil sie sich beim Abrütteln setzt.", "bg": {"t": "Beim Pflastern: Rand vor Bettung, Fugen vor dem Abrütteln füllen, mit Kunststoffmatte vom Rand zur Mitte abrütteln, nochmals einwischen. Nachsanden ist Unterhalt.", "lm": "S. 161–165", "d": "S. 36"}, "h": "Zuerst das Unterste. Am Schluss kommt das, was man später immer wieder machen muss."}, {"type": "quiz", "title": "Richtig oder falsch?", "questions": [{"q": "Betonplatten werden einvibriert.", "opts": ["Richtig", "Falsch"], "a": 1, "why": "Betonplattenbeläge werden nicht einvibriert, sondern mit dem Gummihammer angeklopft.", "h": "Platten können beim Rütteln brechen."}, {"q": "Ein Betonsteinbelag wird vom Rand gegen die Mitte abgerüttelt.", "opts": ["Richtig", "Falsch"], "a": 0, "why": "Mit dem Abrütteln beginnt man vom Rand her gegen die Mitte.", "h": "Wenn du in der Mitte beginnst, wandern die Steine nach aussen."}, {"q": "Warum wird die Bettungsschicht etwas höher eingebaut?", "opts": ["Sie setzt sich beim Abrütteln", "Damit sie teurer ist", "Damit Wasser abläuft", "Wegen der Frostgefahr"], "a": 0, "why": "Durch das Abrütteln setzt sich die Bettungsschicht.", "h": "Was passiert mit losem Splitt unter der Rüttelplatte?"}, {"q": "Wie breit sind offene Fugen bei Betonplatten mit Fugenkreuzen laut J5?", "opts": ["1 mm", "3 bis 8 mm", "2 cm", "Keine Fugen"], "a": 1, "why": "Offene Fugen 3 bis 8 mm, mit Fugenkreuzen verlegt.", "h": "Ein paar Millimeter."}, {"q": "Braucht ein Betonsteinbelag einen Randabschluss?", "opts": ["Ja, zwingend", "Nein, nie", "Nur bei Naturstein", "Nur im Winter"], "a": 0, "why": "Betonsteinbeläge brauchen zwingend einen Randabschluss.", "h": "Was hält die Steine am Rand, damit sie nicht wegwandern?"}, {"q": "Mit welchem Material werden die Fugen von Verbundsteinen eingewischt?", "opts": ["Brechsand 0/4", "Kiesgemisch 0/45", "Mergel", "Rundkies 16/32"], "a": 0, "why": "Fugen mit Brechsand 0/4 einwischen und nochmals abrütteln.", "h": "Fugen sind schmal, das Material muss fein sein."}, {"q": "Das Nachsanden der Fugen ist ...", "opts": ["eine Garantiearbeit", "eine Unterhaltsarbeit", "verboten", "nur bei Holz nötig"], "a": 1, "why": "Nachsanden = Unterhaltsarbeit, keine Garantiearbeit.", "h": "Muss die Firma das gratis machen?"}, {"q": "Welches Fugenmaterial wird vor dem Abrütteln auf die Fläche gebracht?", "opts": ["Gar keines", "Fugenmaterial, abgestimmt auf die Bettung", "Frischbeton", "Erde"], "a": 1, "why": "Das Fugenmaterial sollte immer auf Verfugen und Abrütteln abgestimmt sein.", "h": "Das Material muss zur Bettung passen."}, {"q": "Betonplatten reinigen mit Hochdruck ist ...", "opts": ["immer richtig", "heikel: Teilchen werden weggesprengt", "Pflicht", "nur für Holz"], "a": 1, "why": "Herstellerempfehlung beachten, Hochdruck kann Oberfläche schädigen.", "h": "Was macht ein harter Wasserstrahl mit der Oberfläche?"}], "bg": {"t": "Betonplatten werden mit dem Gummihammer angeklopft, nicht einvibriert. Betonsteine vom Rand zur Mitte abrütteln. Bettung etwas höher einbauen (setzt sich). Fugen 3–8 mm. Randabschluss zwingend. Fugen mit Brechsand 0/4. Nachsanden = Unterhalt. Kein Hochdruck.", "lm": "S. 152–155 und 161–165", "d": "S. 34–36"}}]};</script><script src="../assets/hilfe.js"></script><script src="../assets/engine.js"></script><script>startApp()</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
