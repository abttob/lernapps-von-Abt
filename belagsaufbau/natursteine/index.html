<script>const CFG={"type": "multi", "title": "Natursteine: Gesteine und Oberflächen", "slug": "natursteine", "stages": [{"type": "match", "title": "Gesteine zuordnen", "task": "Tippe links ein Gestein an, dann rechts die passende Eigenschaft.", "pairs": [["Granit", "Erstarrungsgestein, Hartgestein"], ["Gneis", "Umwandlungsgestein, Hartgestein"], ["Quarzit", "Umwandlungsgestein, Hartgestein"], ["Sandstein", "Ablagerungsgestein, Weichgestein"], ["Jurakalk", "Ablagerungsgestein, Weichgestein, nicht säurebeständig"]], "bg": {"t": "Gesteine nach Entstehung: <b>Erstarrungsgestein</b> (aus Magma, z. B. Granit, Porphyr), <b>Umwandlungsgestein</b> (unter Druck und Hitze verändert, z. B. Gneis, Quarzit), <b>Ablagerungsgestein</b> (z. B. Sandstein, Kalk). Hartgesteine sind für befahrene Flächen geeignet. Kalk ist nicht säurebeständig.", "lm": "S. 156–159 und 163", "d": "S. 29"}, "h": "Gneis und Quarzit wurden umgewandelt. Granit ist aus Magma erstarrt. Sandstein und Kalk sind abgelagert."}, {"type": "match", "title": "Oberflächen bearbeiten", "task": "Tippe links eine Oberfläche an, dann rechts die Beschreibung.", "pairs": [["bruchroh", "Gespalten, trittsicher"], ["geflammt", "Hitze lässt Plättchen abspringen, sehr rutschfest"], ["gestrahlt", "Druckluft, eben, nur bei weichen Gesteinen"], ["gestockt", "Mit dem Stockhammer aufgeraut"], ["geschliffen / poliert", "Glatt und rutschig: nur im Innenbereich"]], "bg": {"t": "Oberflächen: bruchroh (gespalten), geflammt (Hitze, sehr rutschfest), gestrahlt (Druckluft mit Sand), gestockt (Stockhammer), geschliffen/poliert (glatt, nur innen).", "lm": "S. 157", "d": "S. 37"}, "h": "Die Wörter sagen, womit bearbeitet wurde: Flamme, Strahl, Stockhammer, Schleifmaschine. Bruchroh = gebrochen."}, {"type": "quiz", "title": "Foto-Quiz: Steine und Oberflächen", "questions": [{"q": "Welcher Naturstein ist das (Pflastersteine 8/11 und 11/13)?", "opts": ["Granit", "Porphyr", "Quarzsandstein", "Jurakalk"], "a": 0, "why": "Granit: Hartgestein, nicht geschichtet, schwer zu bearbeiten, in verschiedenen Farben.", "img": "../img/j_granit.jpg", "h": "Grau mit schwarzen und weissen Punkten."}, {"q": "Rötlichbraun, leicht geschichtet. Welcher Stein?", "opts": ["Granit", "Porphyr", "Quarzsandstein", "Gneis"], "a": 1, "why": "Porphyr: Hartgestein, leicht geschichtet und etwas besser spaltbar. Farbe rötlichbraun.", "img": "../img/j_porphyr.jpg", "h": "Die Farbe erinnert an rote Erde aus dem Südtirol."}, {"q": "Braun-grau, gut bearbeitbar, viel härter als Sandstein. Welcher Stein?", "opts": ["Porphyr", "Granit", "Quarzsandstein", "Kalkstein"], "a": 2, "why": "Quarzsandstein ist gut bearbeitbar, aber viel härter als Sandstein.", "img": "../img/j_quarzsand.jpg", "h": "Ein Sandstein, der durch Quarz hart ist."}, {"q": "Quarzit: Welche Oberflächen siehst du?", "opts": ["Links gespalten (bruchroh), rechts geflammt", "Links poliert, rechts gestockt", "Links geschliffen, rechts gestrahlt", "Beide bruchroh"], "a": 0, "why": "Geflammte Oberflächen haben eine natürliche Optik.", "img": "../img/j_quarzit.jpg", "h": "Gespalten sieht anders aus als mit Feuer behandelt."}, {"q": "Beim Kalkstein hat die Bearbeitung eine andere Optik zur Folge. Was gilt?", "opts": ["Links bruchroh, oben rechts gespitzt, unten rechts gestockt", "Alles geschliffen", "Links gestrahlt, rechts geflammt", "Alles poliert"], "a": 0, "why": "Links: bruchroh/gespalten, oben rechts: gespitzt, unten rechts: gestockt.", "img": "../img/j_kalk.jpg", "h": "Gespitzt = mit dem Spitzeisen, gestockt = mit dem Stockhammer."}, {"q": "Gesägte Bodenplatte aus Gneis, vollkantig. Fugen mit Fugenmörtel: Welche Bauweise?", "opts": ["Gebundene Bauweise", "Ungebundene Bauweise", "Mischbauweise", "Keine"], "a": 0, "why": "Fugenmörtel = gebundene Fugen.", "img": "../img/j_gneis_gesaegt.jpg", "h": "Mörtel in den Fugen."}, {"q": "Bruchrohe Bodenplatte aus Gneis, handbekantet, Fugen mit Splitt 2/4: Welche Bauweise?", "opts": ["Gebundene Bauweise", "Ungebundene Bauweise", "Mörtelbettung", "Asphalt"], "a": 1, "why": "Splitt 2/4 in den Fugen: ungebundene Fugen.", "img": "../img/j_gneis_bruchroh.jpg", "h": "Splitt in den Fugen."}, {"q": "Unregelmässige Platten ohne feste Form: Wie heissen sie?", "opts": ["Polygonalplatten (formwild)", "Verbundsteine", "Randsteine", "Stellplatten"], "a": 0, "why": "Polygonalplatten werden formwild verlegt, der Verschnitt ist hoch.", "img": "../img/lk_image22.png", "h": "Die Form ist «wild», viele Ecken."}], "info": "Schau genau hin.", "count": 8, "bg": {"t": "Erkennen: Granit grau, körnig, gesprenkelt. Porphyr rötlich, leicht geschichtet. Quarzsandstein braun-grau, hart. Vollkantig gesägte Platten mit Fugenmörtel = gebunden, bruchrohe Platten mit Splittfugen = ungebunden. Polygonalplatten = formwild.", "lm": "S. 156–159 und 163", "d": "S. 29 und 33"}}, {"type": "quiz", "title": "Fälle: Welcher Stein, welche Oberfläche?", "questions": [{"q": "Befahrene Fläche mit Natursteinpflaster. Welche Gesteinsart wählst du?", "opts": ["Weichgestein, z. B. Sandstein", "Hartgestein, z. B. Granit oder Gneis", "Kreide", "Jede Art genügt"], "a": 1, "why": "Hartgestein ist witterungs- und verschleissbeständig.", "h": "Was hält Autos besser aus: hart oder weich?"}, {"q": "Im Aussenbereich beim Sitzplatz: Platte «geschliffen und poliert» oder «gestockt/geflammt»?", "opts": ["Poliert, wegen der Optik", "Gestockt oder geflammt, weil poliert bei Nässe rutschig ist", "Egal", "Nur gebürstet"], "a": 1, "why": "Polierte Flächen sind nass sehr glatt. Draussen sind raue Oberflächen sicherer.", "h": "Denke an Regen und Eis."}, {"q": "Gneis ist ein …", "opts": ["Ergussgestein", "Umwandlungsgestein (Metamorphit)", "Ablagerungsgestein", "Kunststein"], "a": 1, "why": "Gneis entsteht unter Druck und Hitze aus anderem Gestein.", "h": "Der Stein wurde unter Druck und Hitze umgewandelt."}, {"q": "Granit entsteht …", "opts": ["Aus Ablagerungen im Meer", "Beim Erkalten von Magma (Erstarrungsgestein)", "Beim Pressen von Sand", "Aus Beton"], "a": 1, "why": "Granit ist ein Erstarrungsgestein (Magma).", "h": "Granit kommt aus dem Erdinnern."}], "info": null, "count": 4, "bg": {"t": "Befahrene Flächen: Hartgestein (Granit, Gneis). Draussen keine polierten Oberflächen, sie sind nass rutschig. Gneis = Umwandlungsgestein, Granit = Erstarrungsgestein.", "lm": "S. 156–159 und 163", "d": "S. 29 und 37"}}]};</script><script src="../assets/hilfe.js"></script><script src="../assets/engine.js"></script><script>startApp()</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
