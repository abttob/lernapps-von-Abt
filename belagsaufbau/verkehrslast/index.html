ns?", "opts": ["2", "3", "4", "5"], "a": 1, "why": "60 ÷ 25 = 2.4, also 3 Lagen."}, {"q": "Ein Lastwagen eines Zügelunternehmens fährt einmal im Jahr auf den Fussweg. Wonach richtest du die Klasse?", "opts": ["Nach dem Gewicht des Lastwagens", "Nach der Anzahl Überfahrten pro Tag, nicht nach dem Einzelgewicht", "Immer T3", "Immer ZP"], "a": 1, "why": "Die Klasse folgt den Überfahrten pro Tag. Seltene Einzelfahrten ändern die Klasse nicht."}], "info": null, "count": 6}]};</script><script src="../assets/engine.js"></script><script>startApp()</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
