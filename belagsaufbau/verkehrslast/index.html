<script>const CFG={"type": "multi", "title": "Verkehrslastklassen und Fundationsstärke", "slug": "verkehrslast", "stages": [{"type": "quiz", "title": "Klassen unterscheiden", "questions": [{"q": "Zugangsweg zum Hauseingang, nur Fussgänger. Welche Klasse?", "opts": ["ZP", "T1", "T2", "T3"], "a": 0, "why": "ZP = Gehbereich, nicht befahren.", "h": "Fährt hier überhaupt ein Auto?"}, {"q": "Garageneinfahrt eines Einfamilienhauses mit ca. 4 Überfahrten pro Tag. Welche Klasse?", "opts": ["ZP", "T1", "T2", "T3"], "a": 1, "why": "T1 = bis 30 Überfahrten pro Tag.", "h": "Wie viele Überfahrten pro Tag? Die Grenze von T1 liegt bei 30."}, {"q": "Hofzufahrt mit ca. 60 Überfahrten pro Tag. Welche Klasse?", "opts": ["T1", "T2", "T3", "ZP"], "a": 1, "why": "T2 = 30 bis 100 Überfahrten pro Tag.", "h": "T2 geht von 30 bis 100 Überfahrten."}, {"q": "Anlieferung mit ca. 200 Überfahrten pro Tag. Welche Klasse?", "opts": ["T1", "T2", "T3", "ZP"], "a": 2, "why": "T3 = 100 bis 300 Überfahrten pro Tag.", "h": "T3 geht von 100 bis 300 Überfahrten."}, {"q": "Was kategorisiert die Verkehrslastklasse?", "opts": ["Das Gewicht eines Fahrzeugs", "Die Anzahl Überfahrten pro Tag", "Die Länge des Weges", "Die Dicke der Deckschicht"], "a": 1, "why": "Sie bezieht sich auf die Anzahl Überfahrten pro Tag, mit einer Referenzachslast von 8.16 t.", "h": "Ein schwerer Lastwagen einmal im Jahr macht noch keine schwere Klasse."}, {"q": "Wie gross ist die Referenzachslast?", "opts": ["3.5 t", "8.16 t", "12 t", "20 t"], "a": 1, "why": "Referenzachslast 8.16 Tonnen.", "h": "Die Zahl hat zwei Stellen nach dem Punkt und liegt bei etwas über 8 t."}, {"q": "25 Überfahrten pro Tag: Welche Klasse?", "opts": ["ZP", "T1", "T2", "T3"], "a": 1, "why": "Bis 30 Überfahrten = T1.", "h": "T1 geht bis 30 Überfahrten pro Tag."}, {"q": "Was bedeutet S1?", "opts": ["Hohe Tragfähigkeit", "Mittlere Tragfähigkeit", "Geringe Tragfähigkeit des Untergrunds", "Sehr leichter Verkehr"], "a": 2, "why": "S1 = geringe, S2 = mittlere, S3 = hohe Tragfähigkeit von Unterbau/Untergrund.", "h": "S beschreibt den Boden. Die Nummer 1 ist die schwächste."}, {"q": "Sitzplatz im Garten: Welche Klasse?", "opts": ["ZP", "T1", "T2", "T3"], "a": 0, "why": "Nur Fussgänger: ZP.", "h": "Wer fährt auf einem Sitzplatz?"}, {"q": "Bis zu welchem Gesamtgewicht darf ein Lieferwagen ungefähr wiegen?", "opts": ["1.5 t", "3.5 t", "7.5 t", "18 t"], "a": 1, "why": "Lieferwagen: bis 3.5 t. Zügelwagen/Kleinlastwagen: bis ca. 7.5 t.", "h": "Mit dem normalen Autoführerausweis (Kat. B) darfst du so ein Fahrzeug fahren."}, {"q": "Ein Tanklöschfahrzeug der Feuerwehr wiegt ungefähr ...", "opts": ["2 t", "3.5 t", "ca. 15–18 t", "40 t"], "a": 2, "why": "Feuerwehrfahrzeuge sind schwer (ca. 13–18 t). Die Zufahrt wird aber nur selten befahren: Achslast und Tragfähigkeit prüfen!", "h": "Das ist ein schwerer Lastwagen, aber kein 40-Tönner."}, {"q": "Ein Zügelunternehmen fährt einmal im Jahr mit 7.5 t auf den Sitzplatz. Wie zählt das für die Verkehrslastklasse?", "opts": ["Als T3", "Es zählt die Anzahl Überfahrten, hier fast keine", "Das Gewicht entscheidet allein", "Gar nicht, Sitzplätze sind nie befahren"], "a": 1, "why": "Die Klasse zählt Überfahrten pro Tag. Trotzdem sollte man bei seltenen schweren Fahrzeugen die Tragfähigkeit prüfen. (Ergänzung)", "h": "Zählt das Gewicht oder die Häufigkeit?"}, {"q": "Welches Fahrzeug gehört zur Klasse T1, wenn es oft kommt (bis 30 pro Tag)?", "opts": ["Personenwagen und Lieferwagen", "Nur 40-t-Lastzüge", "Nur Fussgänger", "Nur Velos"], "a": 0, "why": "T1 = sehr leicht befahren: Garageneinfahrt, Personenwagen, Lieferwagen.", "h": "Das sind die Fahrzeuge, die du jeden Tag vor einem Wohnhaus siehst."}], "bg": {"t": "Die <b>Verkehrslastklasse</b> zählt die <b>Überfahrten pro Tag</b> mit einer Referenzachslast von 8.16 t, nicht das Gewicht eines einzelnen Fahrzeugs.<ul><li><b>ZP</b>: nur Fussgänger und Velos</li><li><b>T1</b>: bis 30 Überfahrten pro Tag</li><li><b>T2</b>: 30 bis 100</li><li><b>T3</b>: 100 bis 300</li></ul>S1 / S2 / S3 = Tragfähigkeit des Untergrunds gering / mittel / hoch.", "lm": "S. 146–147", "d": "S. 16–18"}}, {"type": "calc", "title": "Fundationsstärke ablesen", "gens": ["fund"], "count": 8, "info": "Tabelle J5: Klasse und Untergrund S1/S2/S3.", "bg": {"t": "Tabelle Fundationsstärke (cm) für S1 / S2 / S3:<ul><li>ZP: 30 / 20 / 10</li><li>T1: 50 / 30 / 20</li><li>T2 und T3: 60 / 35 / 25</li></ul>Je schlechter der Untergrund (S1) und je mehr Verkehr, desto dicker.", "lm": "S. 146–147", "d": "S. 18"}}, {"type": "quiz", "title": "Fälle mit Zahlen", "questions": [{"q": "Zufahrt für ca. 60 Fahrzeuge pro Tag (Personenwagen und Lieferwagen), Untergrund S2. Klasse und Fundation?", "opts": ["T1, 30 cm", "T2, 35 cm", "T3, 35 cm", "ZP, 20 cm"], "a": 1, "why": "T2 = 30–100 Überfahrten pro Tag. T2 auf S2 = 35 cm.", "h": "60 Überfahrten: Welche Klasse ist das? Dann Spalte S2 ablesen."}, {"q": "Garageneinfahrt mit 4 Überfahrten pro Tag, Untergrund S2. Fundationsstärke?", "opts": ["20 cm", "30 cm", "35 cm", "50 cm"], "a": 1, "why": "4 Überfahrten = T1 (bis 30 pro Tag). T1 auf S2 = 30 cm.", "h": "4 Überfahrten pro Tag = T1. Was steht bei T1 in der Spalte S2?"}, {"q": "Fussweg im Garten (ZP), Untergrund S1 (schlecht tragfähig): Wie viele Lagen sind nötig?", "opts": ["1 Lage", "2 Lagen", "3 Lagen", "4 Lagen"], "a": 1, "why": "ZP/S1 = 30 cm. Eine Lage darf höchstens 25 cm stark sein, also zwei Lagen.", "h": "ZP auf S1 = 30 cm. Eine Lage ist höchstens 25 cm."}, {"q": "T1 auf S1: Wie viele Lagen mindestens?", "opts": ["1", "2", "3", "4"], "a": 1, "why": "T1/S1 = 50 cm. 50 ÷ 25 = 2 Lagen.", "h": "T1 auf S1 = 50 cm. Eine Lage ist höchstens 25 cm."}, {"q": "T2 auf S1 verlangt 60 cm. Wie viele Lagen mindestens?", "opts": ["2", "3", "4", "5"], "a": 1, "why": "60 ÷ 25 = 2.4, also 3 Lagen.", "h": "60 ÷ 25 = 2.4. Kann es eine halbe Lage geben?"}, {"q": "Ein Lastwagen eines Zügelunternehmens fährt einmal im Jahr auf den Fussweg. Wonach richtest du die Klasse?", "opts": ["Nach dem Gewicht des Lastwagens", "Nach der Anzahl Überfahrten pro Tag, nicht nach dem Einzelgewicht", "Immer T3", "Immer ZP"], "a": 1, "why": "Die Klasse folgt den Überfahrten pro Tag. Seltene Einzelfahrten ändern die Klasse nicht.", "h": "Was zählt bei der Verkehrslastklasse: das Gewicht oder wie oft gefahren wird?"}], "info": null, "count": 6, "bg": {"t": "Zuerst die Klasse bestimmen (Überfahrten pro Tag), dann mit dem Untergrund (S1–S3) die Fundationsstärke ablesen. Eine Lage ist max. 25 cm: Anzahl Lagen = Stärke ÷ 25, aufgerundet.", "lm": "S. 146–147", "d": "S. 16–18"}}]};</script><script src="../assets/hilfe.js"></script><script src="../assets/engine.js"></script><script>startApp()</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
