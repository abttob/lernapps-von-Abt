<script>const CFG={"type": "multi", "title": "Holz, Materialien und Instandhaltung", "slug": "material", "stages": [{"type": "quiz", "title": "Materialien beurteilen", "questions": [{"q": "Welche Holzart gehört zur Dauerhaftigkeitsklasse 1 (über 25 Jahre)?", "opts": ["Fichte", "Robinie", "Buche", "Douglasie"], "a": 1, "why": "Klasse 1: Robinie, Öl-Hitze-Vergütung, Tech-Wood.", "h": "Ein sehr hartes Holz, die Bäume haben Dornen."}, {"q": "Lärche gehört zur Klasse ...", "opts": ["1", "2", "3", "5"], "a": 1, "why": "Klasse 2 (15 bis 25 Jahre): Lärche, Eiche, Edelkastanie.", "h": "Lärche ist dauerhaft, aber nicht die beste Klasse."}, {"q": "Douglasie ist ...", "opts": ["sehr dauerhaft", "dauerhaft", "mässig dauerhaft (10–15 Jahre)", "nicht dauerhaft"], "a": 2, "why": "Klasse 3.", "h": "Douglasie liegt in der Mitte der Skala."}, {"q": "Fichte unbehandelt im Freien: Lebensdauer ca.?", "opts": ["über 25 Jahre", "15–25 Jahre", "5–10 Jahre", "über 50 Jahre"], "a": 2, "why": "Klasse 4: wenig dauerhaft, 5–10 Jahre.", "h": "Fichte ist ein weiches Bauholz und fault draussen schnell."}, {"q": "Welches Label steht für nachhaltige Waldnutzung?", "opts": ["CE", "FSC", "GS", "VSS"], "a": 1, "why": "FSC = Forest Stewardship Council.", "h": "Das Label hat einen Baum als Logo."}, {"q": "Welche Gesteinsgruppe ist <b>Hartgestein</b>?", "opts": ["Jurakalk", "Sandstein", "Granit, Gneis, Quarzit", "Alpenkalk"], "a": 2, "why": "Hartgesteine sind witterungsbeständig; Weichgesteine (Kalk, Sandstein) sind nicht säurebeständig.", "h": "Harte Gesteine sind kristallin und kommen aus den Alpen oder dem Tessin."}, {"q": "Welche Oberfläche ist für den Aussenbereich <b>ungeeignet</b>?", "opts": ["Bruchroh", "Geflammt", "Geschliffen/poliert", "Gestrahlt"], "a": 2, "why": "Geschliffen/poliert: nur Innenbereich.", "h": "Wenn es nass ist: Welche Oberfläche ist glatt?"}, {"q": "Natursteinplatten dehnen sich bei Wärme aus. Was folgt daraus?", "opts": ["Fugen sind nötig", "Keine Fugen", "Nur gebunden verlegen", "Nur im Winter verlegen"], "a": 0, "why": "Ohne Fugen entstehen Kantenschäden: abgebrochene Ecken und Abplatzungen.", "h": "Was braucht ein Material, das grösser wird?"}, {"q": "Welche Wirkung hat Hochdruck auf Betonplatten?", "opts": ["Keine", "Winzige Teilchen werden von der Oberfläche weggesprengt", "Sie werden dichter", "Sie werden frostsicher"], "a": 1, "why": "J5: Betonplatten mit Hochdruck zu reinigen kann negative Folgen haben.", "h": "Was macht ein harter Wasserstrahl mit feinen Teilchen?"}], "bg": {"t": "<b>Holz</b> wird nach Dauerhaftigkeit eingeteilt: Klasse 1 Robinie (über 25 Jahre), 2 Lärche, 3 Douglasie, 4 Fichte, 5 Buche (unter 5 Jahre). FSC = nachhaltige Waldnutzung. <b>Naturstein</b>: Hartgestein (Granit, Gneis, Quarzit) für stark beanspruchte Flächen. Polierte Oberflächen sind draussen rutschig. Steine dehnen sich aus: Fugen nötig. Betonplatten nicht mit Hochdruck reinigen.", "lm": "S. 156–159 und 172–174", "d": "S. 30 und 37"}}, {"type": "quiz", "title": "Foto-Quiz: Pflege und Holz", "questions": [{"q": "Darf man ungebundene Pflästerungen mit dem Hochdruckreiniger reinigen?", "opts": ["Ja, das ist am schnellsten", "Nein, es ist von Hand mit dem Besen zu reinigen (kein Hochdruck)", "Nur mit warmem Wasser", "Ja, ohne Fugenmaterial"], "a": 1, "why": "J5: Bei ungebundenen Fugen auf saugende Geräte und Hochdruckreiniger verzichten, schonend von Hand mit dem Besen reinigen.", "img": "../img/ph_hochdruck.jpg", "h": "Was passiert mit dem Fugenmaterial bei Hochdruck?"}, {"q": "Nach einigen Jahren sieht das Holzdeck grau aus. Wie nennt man das?", "opts": ["Fäulnis", "Patina (Vergrauung)", "Korrosion", "Verwitterung durch Frost"], "a": 1, "why": "Die Patina ist die natürliche Vergrauung des Holzes.", "img": "../img/j_holz3.jpg", "h": "Ein schönes Wort für die graue Schicht."}, {"q": "Welche Massnahme verlängert die Lebensdauer des Holzdecks?", "opts": ["Nie reinigen", "Periodisch mit schwacher Lauge reinigen und lasieren oder ölen", "Mit Hochdruck abspritzen", "Nur schleifen"], "a": 1, "why": "J5: periodisch mit schwacher Lauge reinigen, danach lasieren oder ölen.", "img": "../img/j_holz2.jpg", "h": "Reinigen und schützen."}], "info": "Schau genau hin.", "count": 3, "bg": {"t": "Pflege: ungebundene Beläge von Hand oder mit dem Besen reinigen, kein Hochdruck (spült die Fugen aus). Holz vergraut durch UV-Licht (Patina). Periodisch mit schwacher Lauge reinigen und lasieren oder ölen.", "lm": "S. 172–174", "d": "S. 30 und 35"}}, {"type": "match", "title": "Holzarten und Klassen", "task": "Tippe links eine Holzart an, dann rechts die Dauerhaftigkeit.", "pairs": [["Robinie", "Klasse 1: sehr dauerhaft (über 25 Jahre)"], ["Lärche", "Klasse 2: dauerhaft (15–25 Jahre)"], ["Douglasie", "Klasse 3: mässig dauerhaft (10–15 Jahre)"], ["Fichte unbehandelt", "Klasse 4: wenig dauerhaft (5–10 Jahre)"], ["Buche unbehandelt", "Klasse 5: nicht dauerhaft (unter 5 Jahre)"]], "bg": {"t": "Dauerhaftigkeit von Holz im Freien: Klasse 1 Robinie (über 25 J.), 2 Lärche (15–25 J.), 3 Douglasie (10–15 J.), 4 Fichte (5–10 J.), 5 Buche (unter 5 J.).", "lm": "S. 173–174", "d": "S. 30"}, "h": "Je mehr Harz oder Gerbstoffe ein Holz hat, desto länger hält es draussen. Ein sehr hartes Laubholz ist am besten, ein unbehandeltes Laubholz aus dem Buchenwald am schlechtesten."}, {"type": "match", "title": "Materialbegriffe", "task": "Welche Beschreibung gehört zu welchem Begriff?", "pairs": [["Wasserfestigkeit", "Hält Feuchte und Staunässe aus"], ["UV-Beständigkeit", "Bleicht und versprödet in der Sonne nicht"], ["Fäulnisbeständigkeit", "Pilze greifen das Holz kaum an"], ["Windfestigkeit", "Hält Windlast aus (z. B. Sichtschutzwand)"], ["Korrosionsbeständigkeit", "Rostet nicht (z. B. Edelstahl)"]], "bg": {"t": "Materialeigenschaften: Wasserfestigkeit, UV-Beständigkeit, Fäulnisbeständigkeit, Windfestigkeit, Korrosionsbeständigkeit. Bei der Wahl überlegen: Was muss das Material am Einsatzort aushalten?", "lm": "S. 172–174", "d": "S. 30"}}, {"type": "match", "title": "Pflege und Unterhalt", "task": "Tippe links ein Stichwort an, dann rechts die passende Aussage.", "pairs": [["Flecken auf Betonplatten", "Herstellerempfehlung beachten, Reinigungsmittel nach Angabe"], ["Betonplatten reinigen", "Nicht mit Hochdruck: Teilchen werden von der Oberfläche weggesprengt"], ["Sickersteine im Winter", "Keinesfalls Salz streuen"], ["Auswahl von Natursteinen", "Nicht alle Steinarten sind tausalzbeständig, schon bei der Wahl beachten"], ["Nachsanden der Fugen", "Unterhaltsarbeit, keine Garantiearbeit"], ["Setzungen bei Aufschüttungen anderer Unternehmen", "Von der Mängelhaftung ausgeschlossen (SIA 118/318)"]], "bg": {"t": "Unterhalt: Hersteller-Empfehlungen beachten, kein Hochdruck, kein Salz auf Sickersteinen, tausalzbeständige Steine wählen. Nachsanden ist Unterhalt, keine Garantiearbeit. Setzungen von fremden Aufschüttungen sind von der Mängelhaftung ausgeschlossen (SIA 118/318).", "lm": "S. 151–153", "d": "S. 35 und 42"}}]};</script><script src="../assets/hilfe.js"></script><script src="../assets/engine.js"></script><script>startApp()</script><p class="copy">© Tobias Abt, BBZ BL</p></body></html>
