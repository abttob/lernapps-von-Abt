const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const SC=["loading","home","quiz","sort","res","teacher"];
function show(id){SC.forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}
function pop(t){const p=$("pop");p.textContent=t;p.classList.remove("go");void p.offsetWidth;p.classList.add("go");}
const cls=p=>p==null?"g0":p>=80?"g3":p>=50?"g2":"g1";
const NIV={1:"Basis",2:"Standard",3:"Profi"};
let S={niveau:2,ci:null,mods:{},co:[]};
function load(){const p=LA.getProgress(SLUG);if(p&&p.data)S=Object.assign(S,p.data);}
async function save(){const pct=Math.round(([S.ci?1:0,S.mods.sort?1:0,S.mods.quiz?1:0,S.co.length?1:0].reduce((a,b)=>a+b,0))/4*100);try{await LA.saveProgress(SLUG,Object.assign({pct},S));}catch(e){}}
function openForStudents(){return nowMs()>=CHECKOUT_TS;}
const EARLY=[]; // Namen hier eintragen, wenn jemand früher gehen muss (z. B. ["brosi"])
function earlyOk(){const n=((LA.user&&LA.user.name)||"").toLowerCase();return EARLY.some(e=>n.split(/[\s,]+/).includes(e));}
function checkoutOpen(){return openForStudents()||earlyOk();} // gilt für alle, auch für die Lehrperson in der Schüleransicht
function untilText(){let m=Math.max(0,Math.ceil((CHECKOUT_TS-nowMs())/60000));return m>=60?Math.floor(m/60)+" h "+(m%60)+" min":m+" min";}

/* ================= QUIZ-MOTOR (Check-in, Training, Checkout) ================= */
let mode="",set=[],qi=0,pts=0,streak=0,right=0,log=[],t0=0,tick=null,locked=false,TIME=25,order=[];
function pool(n,G){const M=MC.filter(q=>G.includes(q.lz));return n===1?M.filter(q=>q.lv===1).concat(shuffle(M.filter(q=>q.lv===2)).slice(0,6)):n===2?M.filter(q=>q.lv<=2):M.filter(q=>q.lv>=2);}
function pick(p,N,G){const out=[];G.forEach(l=>out.push(...shuffle(p.filter(q=>q.lz===l)).slice(0,Math.floor(N/G.length))));const rest=shuffle(p.filter(q=>!out.includes(q)));while(out.length<N&&rest.length)out.push(rest.pop());return shuffle(out);}
function startQ(m){if(m==="co"&&!checkoutOpen()&&!(LA.user&&LA.user.role==="teacher")){goCO();return;}mode=m;
 if(m==="ci"){set=shuffle(CI);TIME=25;}
 else{const G=m==="co"?ALLG:KOLL;set=pick(pool(S.niveau,G),m==="co"?8:10,G);TIME=S.niveau===3?20:0;}
 qi=0;pts=0;streak=0;right=0;log=[];show("quiz");drawQ();}
function drawQ(){
 const q=set[qi];locked=false;
 let idx=q.o.map((_,k)=>k);if(mode!=="ci"&&S.niveau===1)idx=[0,...shuffle(idx.slice(1)).slice(0,2)];order=shuffle(idx);
 $("pos").textContent=({ci:"🎟️ Check-in",quiz:"🧠 Training",co:"✅ Checkout"})[mode]+" · "+(qi+1)+"/"+set.length;
 $("pts").textContent=mode==="ci"?pts+" Pkt.":right+" richtig";
 $("streak").classList.toggle("hidden",!(mode==="ci"&&streak>=3));$("streak").textContent="🔥 "+streak;
 $("tag").textContent=LZ[q.lz]+(mode!=="ci"?" · "+NIV[S.niveau]:"");$("qtext").textContent=q.q;$("feedback").innerHTML="";$("next").classList.add("hidden");
 $("answers").innerHTML="";order.forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=q.o[k];b.dataset.k=k;b.onclick=()=>answer(k);$("answers").appendChild(b);});
 clearInterval(tick);$("tWrap").classList.toggle("hidden",!TIME);
 if(TIME){t0=Date.now();$("tbar").style.width="100%";tick=setInterval(()=>{const left=TIME-(Date.now()-t0)/1000;$("tbar").style.width=Math.max(0,left/TIME*100)+"%";if(left<=0)answer(-1);},200);}else t0=Date.now();
}
function answer(k){
 if(locked)return;locked=true;clearInterval(tick);
 const q=set[qi],ok=k===0,sec=Math.min(TIME||99,(Date.now()-t0)/1000);let gain=0;
 if(ok){right++;streak++;if(mode==="ci"){gain=100+Math.round(50*(1-sec/TIME))+(streak>=3?25:0);pts+=gain;pop(streak>=3?"🔥 +"+gain:"+"+gain);}else pop("✅");}else streak=0;
 log.push({id:q.id,ok});
 document.querySelectorAll("#answers .btn").forEach(b=>{b.disabled=true;if(+b.dataset.k===0)b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("no");});
 $("feedback").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"✅ Richtig!"+(gain?" +"+gain:""):k<0?"⏱ Zeit abgelaufen!":"❌ Leider falsch."}</b>${ok?"":"Richtig: <b style='display:inline'>"+esc(q.o[0])+"</b><br>"}${esc(q.e)}</div>`;
 $("pts").textContent=mode==="ci"?pts+" Pkt.":right+" richtig";
 const n=$("next");n.classList.remove("hidden");n.textContent=qi<set.length-1?"Weiter ➜":"🏁 Resultat";n.focus();
}
$("next").onclick=()=>{qi++;if(qi<set.length)drawQ();else finish();};
function byLz(src){const o={};log.forEach(x=>{const q=src.find(y=>y.id===x.id);(o[q.lz]=o[q.lz]||{n:0,ok:0});o[q.lz].n++;if(x.ok)o[q.lz].ok++;});return o;}
async function finish(){
 const pct=Math.round(right/set.length*100),src=mode==="ci"?CI:MC,lz=byLz(src);
 const wrong=log.filter(x=>!x.ok).map(x=>src.find(q=>q.id===x.id));
 let head="";
 if(mode==="ci"){const first=!S.ci;if(first)S.ci={pts,right,total:set.length,pct,byLz:lz,log,at:new Date().toISOString()};
  head=`<div class="big">${pts} Pkt.</div><p style="text-align:center;margin:0">${right} von ${set.length} richtig</p>${first?"":"<p class='small' style='text-align:center'>Trainingsrunde – gewertet bleibt dein 1. Check-in ("+S.ci.pts+" Pkt.).</p>"}
  <div class="card" style="margin-top:12px;text-align:center;background:#2f3b20;border-color:var(--lime)"><b>📵 Jetzt: Handy nach vorne aufs Pult. Laptop zuklappen.</b></div>`;}
 else if(mode==="quiz"){const m=S.mods.quiz||{best:0,runs:0};m.best=Math.max(m.best,pct);m.runs++;m.niv=S.niveau;S.mods.quiz=m;head=`<div class="big">${pct} %</div><p style="text-align:center">${right} von ${set.length} richtig</p>`;}
 else{S.co.push({at:new Date().toISOString(),niv:S.niveau,score:right,total:set.length,pct,byLz:lz,log});
  head=`<div class="ticket"><div class="t">🎟️ TICKET ZUM AUFRÄUMEN</div><div style="font-size:1.2rem;margin:6px 0"><b>${esc(LA.user.name)}</b> · ${new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})}</div>
  <div>Checkout: <b>${S.co[0].score} / ${S.co[0].total}</b> ${S.co.length>1?"(gewertet: 1. Versuch)":""}</div><div class="small">Zeig das Ticket der Lehrperson ➜ dann aufräumen 🧹</div></div>`;}
 await save();
 $("resBox").innerHTML=head+Object.keys(lz).map(l=>`<div class="row"><span>${LZ[l]}</span><b>${lz[l].ok} / ${lz[l].n}</b></div>`).join("")+
  (wrong.length?"<h2 style='margin-top:12px'>Nochmals anschauen</h2>"+wrong.map(q=>`<div class="row" style="display:block">${esc(q.q)}<br><b style="color:var(--lime)">✔ ${esc(q.o[0])}</b></div>`).join(""):"");
 show("res");
}

/* ================= SORTIEREN ================= */
let sset=[],si=0,sright=0,sdone=false,stimer=null;
function startSort(){const n=S.niveau===1?10:S.niveau===2?14:16;const A=shuffle(SORT.filter(x=>x[1])),B=shuffle(SORT.filter(x=>!x[1]));sset=shuffle(A.slice(0,Math.ceil(n/2)).concat(B.slice(0,Math.floor(n/2))));si=0;sright=0;show("sort");drawS();}
function drawS(){sdone=false;$("spos").textContent="Karte "+(si+1)+"/"+sset.length+(S.niveau===3?" · ⏱ 6 s":"");$("sscore").textContent=sright+" richtig";$("scard").textContent=sset[si][0];$("sfb").innerHTML="";$("snext").classList.add("hidden");
 ["sA","sB"].forEach(id=>{$(id).disabled=false;$(id).className="btn";});clearTimeout(stimer);if(S.niveau===3)stimer=setTimeout(()=>{if(!sdone)ansS(null);},6000);}
function ansS(c){if(sdone)return;sdone=true;clearTimeout(stimer);const r=sset[si][1],ok=c===r;if(ok)sright++;
 $(r?"sA":"sB").classList.add("ok");if(c!==null&&!ok)$(c?"sA":"sB").classList.add("no");["sA","sB"].forEach(id=>$(id).disabled=true);
 $("sfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"✅ Richtig!":c===null?"⏱ Zu langsam!":"❌ Falsch."}</b>${r?"Die Aussage stimmt. ":"Die Aussage stimmt nicht. "}${esc(sset[si][2])}</div>`;
 $("sscore").textContent=sright+" richtig";$("snext").classList.remove("hidden");$("snext").textContent=si<sset.length-1?"Weiter":"Resultat";}
$("sA").onclick=()=>ansS(true);$("sB").onclick=()=>ansS(false);
$("snext").onclick=async()=>{si++;if(si<sset.length)drawS();else{const pct=Math.round(sright/sset.length*100);const m=S.mods.sort||{best:0,runs:0};m.best=Math.max(m.best,pct);m.runs++;S.mods.sort=m;await save();
 $("resBox").innerHTML=`<div class="big">${pct} %</div><p style="text-align:center">${sright} von ${sset.length} richtig entschieden.</p>`;show("res");}};

async function goCO(){await syncTime();if(!checkoutOpen()){const t=LA.user&&LA.user.role==="teacher";
 $("resBox").innerHTML=`<div class="lockbox"><div style="font-size:3rem">🔒</div><div class="clock">16.45 Uhr</div><p>Der Checkout öffnet erst um 16.45 Uhr.<br>Noch <b>${untilText()}</b>.</p><p class="small">Bis dahin: Dossier fertig, Simulator-Missionen, Kolloquium-Training.</p>${t?'<p class="small" style="margin-top:14px">👩‍🏫 Nur für dich als Lehrperson sichtbar:</p><button class="btn" id="tPrev">Vorschau Checkout (Lehrperson)</button>':""}</div>`;
 show("res");if(t)$("tPrev").onclick=()=>startQ("co");return;}startQ("co");}
const GO={ci:()=>startQ("ci"),sort:startSort,quiz:()=>startQ("quiz"),co:goCO,sim:()=>{location.href="../ladungs-simulator/";}};

/* ================= LEHRPERSON ================= */
const BEAMER=/[?&]beamer=1/.test(location.search);let tT=null;
async function teacher(){
 $("wrap").classList.add("wide");if(BEAMER)$("wrap").classList.add("beamer");
 $("subline").innerHTML=BEAMER?"🏆 Check-in · Live-Rangliste":`Live-Übersicht Klasse ${esc(LA.klasse)} · <a href="?beamer=1" style="color:var(--lime)">🏆 Rangliste Beamer</a> · <a href="../handy-liste/" style="color:var(--lime)">📱 Handy-Liste</a> · <a href="?test=1" style="color:var(--lime)">▶ ausprobieren</a>`;
 show("teacher");await drawT();clearInterval(tT);tT=setInterval(drawT,BEAMER?5000:12000);
}
async function drawT(){
 let profs,prog;try{[profs,prog]=await Promise.all([LA.profiles(),LA.allProgress()]);}catch(e){$("teacher").innerHTML='<div class="card">⚠ '+esc(e.message)+'</div>';return;}
 const P=Object.fromEntries(profs.map(p=>[p.id,p]));
 const studs=profs.filter(p=>p.role==="student"&&p.klasse===LA.klasse);
 const rec=Object.fromEntries(prog.filter(r=>r.slug===SLUG&&P[r.user_id]).map(r=>[r.user_id,r]));
 const rows=studs.map(p=>({name:p.name,d:(rec[p.id]&&rec[p.id].data)||{},at:rec[p.id]&&rec[p.id].updated_at})).sort((a,b)=>a.name.localeCompare(b.name,"de"));
 const ci=rows.filter(r=>r.d.ci),co=rows.filter(r=>r.d.co&&r.d.co.length);
 const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null;
 const lzAvg=(arr,key)=>{const o={};arr.forEach(r=>{const b=key(r);Object.keys(b).forEach(l=>{(o[l]=o[l]||{n:0,ok:0});o[l].n+=b[l].n;o[l].ok+=b[l].ok;});});return o;};
 const ciLz=lzAvg(ci,r=>r.d.ci.byLz),coLz=lzAvg(co,r=>r.d.co[0].byLz);
 const kp=(v,t)=>`<div class="kpi"><b>${v}</b><span>${t}</span></div>`;
 const pc=o=>o&&o.n?Math.round(o.ok/o.n*100)+" %":"–";
 const top=ci.slice().sort((a,b)=>b.d.ci.pts-a.d.ci.pts).slice(0,5);
 const hard=CI.map(q=>{let n=0,ok=0;ci.forEach(r=>r.d.ci.log.forEach(x=>{if(x.id===q.id){n++;if(x.ok)ok++;}}));return{q,n,p:n?Math.round(ok/n*100):null};}).filter(x=>x.n).sort((a,b)=>a.p-b.p);
 const lb=`<div class="card"><h2>🏆 Check-in Top 5</h2>${top.map((r,i)=>`<div class="lbr"><div class="m">${["🥇","🥈","🥉","4","5"][i]}</div><b>${esc(r.name)}</b><span class="p">${r.d.ci.pts}</span></div>`).join("")||'<p class="small">Noch niemand fertig …</p>'}</div>`;
 const hd=hard.length?`<div class="card"><h2>🤔 Schwierigste Check-in-Fragen</h2>${hard.slice(0,BEAMER?2:5).map(x=>`<div class="row"><span>${esc(x.q.q)}<br><span class="small">✔ ${esc(x.q.o[0])}</span></span><span class="sc ${cls(x.p)}">${x.p} %</span></div>`).join("")}</div>`:"";
 const kpis=`<div class="kpis">${kp(ci.length+" / "+rows.length,"Check-in fertig")}${kp(avg(ci.map(r=>r.d.ci.pct))==null?"–":avg(ci.map(r=>r.d.ci.pct))+" %","Schnitt Check-in")}${["L63","L64","L65"].map(l=>kp(pc(ciLz[l]),"Check-in "+LZ[l])).join("")}</div>`;
 if(BEAMER){$("teacher").innerHTML=kpis+lb+hd;return;}
 const now=new Date();
 const kpis2=`<div class="kpis">${kp(co.length+" / "+rows.length,"Checkout fertig")}${kp(avg(co.map(r=>r.d.co[0].pct))==null?"–":avg(co.map(r=>r.d.co[0].pct))+" %","Schnitt Checkout")}${ALLG.map(l=>kp(pc(coLz[l]),"Checkout "+LZ[l])).join("")}${kp(openForStudents()?"🔓 offen":"🔒 ab 16.45","Checkout für Lernende")}</div>`;
 const c=(v,p)=>v==null?'<span class="sc g0">–</span>':`<span class="sc ${cls(p)}">${v}</span>`;
 $("teacher").innerHTML=kpis+kpis2+`<div class="card"><h2>👀 Alle Lernenden</h2><p class="small">Aktualisiert alle 12 Sekunden. Check-in und Checkout: gewertet wird der 1. Versuch.</p>
 <div style="margin-bottom:8px"><button class="btn inline" id="csv">⬇ CSV</button><button class="btn inline" onclick="drawT()">🔄 Aktualisieren</button></div>
 <div class="scroll"><table><tr><th>Name</th><th>Niveau</th><th>🎟️ Check-in</th><th>L63</th><th>L64</th><th>L65</th><th>🎤 Stimmt's?</th><th>🧠 Training</th><th>✅ Checkout</th><th>L53–56</th><th>L57/59</th><th>L58–62</th><th>L66–68</th><th>L63–65</th><th>Zuletzt</th></tr>
 ${rows.map(r=>{const d=r.d,ciR=d.ci,coR=d.co&&d.co[0];const lz=(o,l)=>o&&o.byLz[l]?c(o.byLz[l].ok+"/"+o.byLz[l].n,Math.round(o.byLz[l].ok/o.byLz[l].n*100)):c(null);
  return `<tr><td><b>${esc(r.name)}</b></td><td>${d.niveau?'<i class="dot d'+d.niveau+'"></i>'+NIV[d.niveau]:"–"}</td><td class="n">${ciR?c(ciR.right+"/"+ciR.total,ciR.pct):c(null)}</td><td class="n">${lz(ciR,"L63")}</td><td class="n">${lz(ciR,"L64")}</td><td class="n">${lz(ciR,"L65")}</td>
  <td class="n">${d.mods&&d.mods.sort?c(d.mods.sort.best+" %",d.mods.sort.best):c(null)}</td><td class="n">${d.mods&&d.mods.quiz?c(d.mods.quiz.best+" %",d.mods.quiz.best):c(null)}</td>
  <td class="n">${coR?c(coR.score+"/"+coR.total,coR.pct):c(null)}</td>${ALLG.map(l=>`<td class="n">${lz(coR,l)}</td>`).join("")}<td>${r.at?new Date(r.at).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}):"–"}</td></tr>`;}).join("")||'<tr><td>Noch keine Lernenden registriert.</td></tr>'}
 </table></div></div>`+lb+hd;
 $("csv").onclick=()=>{const L=[["Name","Niveau","Check-in","Check-in %","Stimmt's %","Training %","Checkout","Checkout %"]].concat(rows.map(r=>{const d=r.d,a=d.ci,b=d.co&&d.co[0];return[r.name,NIV[d.niveau]||"",a?a.right+"/"+a.total:"",a?a.pct:"",d.mods&&d.mods.sort?d.mods.sort.best:"",d.mods&&d.mods.quiz?d.mods.quiz.best:"",b?b.score+"/"+b.total:"",b?b.pct:""];}));
  const csv=L.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download="tag-03-12-2026-GLA25A.csv";a.click();};
}

syncTime();
LA.requireLogin().then(async()=>{await syncTime();LA.who($("who"));load();
 if(LA.user.role==="teacher"&&!/[?&]test=1/.test(location.search))teacher();
 else if(/[?&]checkout=1/.test(location.search)){home();goCO();}
 else{home();}
});
</script>
