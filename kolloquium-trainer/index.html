<!DOCTYPE html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎤 Kolloquium-Trainer L53–68</title>
<style>
:root{--bg:#14151a;--card:#20232c;--card2:#2a2e3a;--ink:#f3f5f2;--muted:#a7b0aa;--lime:#98c723;--gelb:#ffc400;--gruen:#21c36b;--rot:#ff5a5a;--blau:#4da3ff;--line:#363b48}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
.wrap{max-width:740px;margin:0 auto;padding:14px 14px 70px}
a.back{color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:25px;margin:8px 0 2px}h2{margin:6px 0}.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.tile{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.tile:hover{border-color:var(--lime)}.tile .ic{font-size:32px}.tile b{font-size:17px}.tile span{display:block;color:var(--muted);font-size:13px}.tile .st{margin-left:auto;white-space:nowrap;font-size:14px;color:var(--lime);font-weight:700}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0}
.art{border-radius:14px;overflow:hidden;max-width:380px;margin:0 auto 10px}.art svg{display:block;width:100%;height:auto}
.q{font-size:18px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:7px 0;font:inherit;font-size:16px;cursor:pointer}
.opt.sel{border-color:var(--blau);background:#1d2b40}.opt.ok{border-color:var(--gruen);background:#143a27}.opt.bad{border-color:var(--rot);background:#3d1a1d}.opt.dim{opacity:.45}
.btn{background:var(--lime);color:#14151a;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin:8px 6px 0 0}
.btn.sec{background:var(--card2);color:var(--ink)}.btn.red{background:var(--rot);color:#fff}.btn.green{background:var(--gruen);color:#08130c}
.fb{margin-top:10px;padding:12px;border-radius:12px;background:var(--card2);font-size:15px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--lime)}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.chip{background:var(--card2);border:2px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}.chip.on{border-color:var(--lime);background:#26331a}
.badge{display:inline-block;background:var(--card2);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted);margin-right:6px}
.timer{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
ul.e{margin:6px 0 0 18px;padding:0}ul.e li{margin:4px 0}
.fbtn{display:inline-block;background:var(--card2);border:2px solid var(--line);color:var(--ink);border-radius:20px;padding:7px 12px;margin:4px;font:inherit;font-size:14px;cursor:pointer}.fbtn.on{border-color:var(--gruen);background:#143a27}
.ans{background:#26331a;border-left:4px solid var(--lime);padding:10px 12px;border-radius:8px;margin:8px 0}
.crit{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.crit b{font-size:15px}.crit small{display:block;color:var(--muted)}
.pts button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-weight:800;margin-left:4px;cursor:pointer}.pts button.on{background:var(--lime);color:#14151a;border-color:var(--lime)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.bin{background:var(--card2);border-radius:12px;padding:10px;min-height:80px}.bin h4{margin:0 0 6px;font-size:14px}
.item{display:inline-block;background:#33384a;border-radius:10px;padding:8px 10px;margin:4px;font-size:15px}
.flip{perspective:900px;cursor:pointer}.flip .in{position:relative;min-height:190px;transition:transform .5s;transform-style:preserve-3d}.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:22px;font-weight:800;background:var(--card)}
.flip .b{transform:rotateY(180deg);font-size:17px;font-weight:600;background:#26331a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.medal{font-size:64px;text-align:center}.center{text-align:center}.hint{color:var(--muted);font-size:13px}
.lzbar{display:flex;align-items:center;gap:8px;margin:6px 0}.lzbar span{width:190px;font-size:13px}.lzbar .bar{flex:1;margin:0}
</style></head><body><div class="wrap" id="app"></div>
<script src="art.js"></script><script src="cards.js"></script><script src="quiz.js"></script>
<script>
const KEY="kolloquium-trainer-v1";
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S.sim=S.sim||{};S.quiz=S.quiz||{};S.known=S.known||{};S.th=S.th||"alle";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$("#app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const inTh=th=>S.th==="alle"||S.th===th;
let timerId=null;const stopT=()=>{if(timerId){clearInterval(timerId);timerId=null}};
const CRIT=[["Lösungsweg","richtig und zielführend"],["Inhalt","korrekt"],["Fachbegriffe","richtig statt Umschreibungen"],["Kommunikation","deutlich, zügig, klar"]];
function chips(){return `<div class="chips">${[["alle","🌈 Alle Themen"],...Object.entries(TH)].map(([k,t])=>`<button class="chip ${S.th===k?"on":""}" data-th="${k}">${t}</button>`).join("")}</div>`}
function bindChips(f){app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.th=c.dataset.th;save();f()})}
/* ---------------- Home ---------------- */
function home(){stopT();
 const nSim=Object.keys(S.sim).length, qv=Object.values(S.quiz), qAvg=qv.length?Math.round(qv.reduce((a,b)=>a+b.best,0)/qv.length):null;
 app.innerHTML=`<a class="back" href="../">← Alle Apps</a><h1>🎤 Kolloquium-Trainer</h1><div class="sub">L53–68 · Kolloquium am 10.12. und 17.12.2026 · alles mit Ordner und Dossiers lösbar</div>
 <div class="card"><b>Wähle dein Thema</b>${chips()}</div>
 <button class="tile" data-m="sim"><span class="ic">🎤</span><div><b>1 · Kolloquium-Simulator</b><span>Fallkarte mit Bild · 4 Min. Vorbereitung · laut erzählen · Vertiefungsfragen · Selbstbewertung wie im echten Kolloquium</span></div><span class="st">${nSim}/${CARDS.length}</span></button>
 <button class="tile" data-m="mix"><span class="ic">🧠</span><div><b>2 · Quiz-Mix</b><span>12 Fragen in 7 Formen: Bild-Quiz, Stimmt's?, Fachbegriff, Reihenfolge, Sortieren, Paare, Lückentext</span></div><span class="st">${qAvg==null?"":qAvg+" %"}</span></button>
 <button class="tile" data-m="cards"><span class="ic">🃏</span><div><b>3 · Fachbegriffe-Karten</b><span>Antippen zum Umdrehen · «Kann ich» sammeln</span></div><span class="st">${Object.keys(S.known).length}/${GLOSS.length}</span></button>
 <button class="tile" data-m="stand"><span class="ic">📊</span><div><b>4 · Mein Stand</b><span>Wo bin ich sicher, wo muss ich noch üben?</span></div></button>
 <div class="card hint">💡 So übst du am besten: Simulator laut (mit Kollegin/Kollege) · Quiz-Mix für das Wissen · Karten für die Fachbegriffe.</div>`;
 bindChips(home);app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>({sim:simPick,mix,cards:flash,stand})[b.dataset.m]());
}
/* ---------------- 1 Simulator ---------------- */
function simPick(){stopT();
 const list=CARDS.map((c,i)=>[c,i]).filter(([c])=>inTh(LZG[c.lz]));
 app.innerHTML=`<a class="back" href="#" id="bk">← Übersicht</a><h2>🎤 Kolloquium-Simulator</h2>${chips()}
 <button class="btn" id="rnd">🎲 Zufällige Karte</button>
 ${list.map(([c,i])=>`<button class="tile" data-i="${i}"><span class="ic">${S.sim[i]!=null?"✅":"🎴"}</span><div><b>${i+1} · ${esc(c.t)}</b><span>${c.lz}</span></div><span class="st">${S.sim[i]!=null?S.sim[i]+"/16":""}</span></button>`).join("")}`;
 $("#bk").onclick=e=>{e.preventDefault();home()};bindChips(simPick);
 $("#rnd").onclick=()=>{const open=list.filter(([c,i])=>S.sim[i]==null);const p=(open.length?open:list);sim(p[Math.random()*p.length|0][1])};
 app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>sim(+b.dataset.i));
}
function sim(i){stopT();const c=CARDS[i];let left=240;
 app.innerHTML=`<div class="top"><span>🎤 Karte ${i+1} · ${c.lz}</span><a class="back" href="#" id="bk">✕ Abbrechen</a></div>
 <div class="card"><div class="art">${ART(c.a)}</div><h2>${esc(c.t)}</h2><p>${esc(c.s)}</p><b>Erzählen Sie:</b><ul class="e">${c.e.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="hint" style="margin-top:8px">📘 ${esc(c.q)}</div></div>
 <div class="card center"><div class="hint">⏱ Vorbereitung mit Ordner und Notizen (wie im Kolloquium: 10 Min.; hier 4 Min.)</div><div class="timer" id="t">4:00</div>
 <button class="btn sec" id="go">▶ Timer starten</button><button class="btn" id="ready">Ich bin bereit ➜ erzählen</button></div>`;
 $("#bk").onclick=e=>{e.preventDefault();simPick()};
 $("#go").onclick=()=>{if(timerId)return;timerId=setInterval(()=>{left--;$("#t").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){stopT();$("#t").textContent="⏰ Los!"}},1000)};
 $("#ready").onclick=()=>talk(i);
}
function talk(i){stopT();const c=CARDS[i];let left=300;
 app.innerHTML=`<div class="top"><span>🎤 Karte ${i+1} · Erzählen</span><span id="t2">5:00</span></div>
 <div class="card"><h2>🗣️ Jetzt laut erzählen!</h2><p class="hint">Allein: halblaut für dich oder ins Handy sprechen. Zu zweit: die andere Person hört zu.</p><b>Erzählen Sie:</b><ul class="e">${c.e.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
 <div class="card"><b>✅ Welche Fachbegriffe hast du gesagt?</b><div>${c.f.map((f,k)=>`<button class="fbtn" data-k="${k}">${esc(f)}</button>`).join("")}</div><button class="btn" id="n">Weiter ➜ Vertiefungsfragen</button></div>`;
 timerId=setInterval(()=>{left--;if(left<0){stopT();return}const el=$("#t2");if(el)el.textContent="⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")},1000);
 app.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
 $("#n").onclick=()=>{const nf=app.querySelectorAll(".fbtn.on").length;deep(i,0,0,nf)};
}
function deep(i,k,known,nf){stopT();const c=CARDS[i];
 if(k>=c.v.length) return rate(i,known,nf);
 app.innerHTML=`<div class="top"><span>❓ Vertiefungsfrage ${k+1}/${c.v.length}</span><span>Karte ${i+1}</span></div>
 <div class="card"><div class="q">${esc(c.v[k])}</div><p class="hint">Zuerst laut antworten, dann die Lösung anschauen.</p><button class="btn" id="sh">💡 Lösung zeigen</button><div id="a"></div></div>`;
 $("#sh").onclick=()=>{$("#sh").remove();$("#a").innerHTML=`<div class="ans">${esc(c.va[k])}</div><div class="row"><button class="btn green" id="y">✅ Gewusst</button><button class="btn red" id="no">❌ Noch nicht</button></div>`;
  $("#y").onclick=()=>deep(i,k+1,known+1,nf);$("#no").onclick=()=>deep(i,k+1,known,nf)};
}
function rate(i,known,nf){const c=CARDS[i];const r=[0,0,0,0];
 app.innerHTML=`<div class="top"><span>📝 Selbstbewertung · Karte ${i+1}</span></div>
 <div class="card"><p>Fachbegriffe: <b>${nf}/${c.f.length}</b> · Vertiefungsfragen gewusst: <b>${known}/${c.v.length}</b></p><p class="hint">Bewerte dich ehrlich wie im echten Kolloquium (je 1–4 Punkte):</p>
 ${CRIT.map((x,k)=>`<div class="crit"><div><b>${x[0]}</b><small>${x[1]}</small></div><div class="pts" data-k="${k}">${[1,2,3,4].map(p=>`<button data-p="${p}">${p}</button>`).join("")}</div></div>`).join("")}
 <div class="center"><h2 id="tot">0 / 16</h2></div><button class="btn" id="sv" disabled>💾 Speichern</button></div>`;
 app.querySelectorAll(".pts").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{r[+g.dataset.k]=+b.dataset.p;g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));const t=r.reduce((a,b)=>a+b,0);$("#tot").textContent=t+" / 16";$("#sv").disabled=r.includes(0)}));
 $("#sv").onclick=()=>{const t=r.reduce((a,b)=>a+b,0);S.sim[i]=Math.max(S.sim[i]||0,t);save();
  app.innerHTML=`<div class="card center"><div class="medal">${t>=14?"🏆":t>=11?"💪":t>=8?"👍":"🔁"}</div><h2>${t} / 16 Punkte</h2><p>${t>=14?"Stark! So kannst du ins Kolloquium.":t>=11?"Gut! Noch die Lücken mit dem Ordner schliessen.":"Lies das Thema im Ordner nach und probiere die Karte nochmals."}</p>
  <p class="hint">📘 ${esc(c.q)}</p><button class="btn" id="nx">🎲 Nächste Karte</button><button class="btn sec" id="ov">Kartenliste</button><button class="btn sec" id="hm">🏠 Übersicht</button></div>`;
  $("#nx").onclick=()=>{const l=CARDS.map((c,j)=>j).filter(j=>inTh(LZG[CARDS[j].lz])&&j!==i);sim(l[Math.random()*l.length|0])};$("#ov").onclick=simPick;$("#hm").onclick=home};
}
/* ---------------- 2 Quiz-Mix ---------------- */
const LBL={mc:"🖼️ Bild-Quiz",tf:"✅❌ Stimmt's?",fach:"🔤 Fachbegriff",order:"🔢 Reihenfolge",sort:"🗂️ Sortieren",match:"🔗 Paare",cloze:"✏️ Lückentext"};
function mix(){stopT();
 let pool=Q.filter(q=>inTh(q.th));
 const kinds=Object.keys(LBL);let set=[];
 kinds.forEach(k=>set.push(...shuffle(pool.filter(q=>q.k===k)).slice(0,1)));
 set=shuffle(set.concat(shuffle(pool.filter(q=>!set.includes(q))).slice(0,Math.max(0,12-set.length)))).slice(0,12);
 let i=0,score=0;
 const next=pts=>{score+=pts;i++;i<set.length?draw():end()};
 const head=q=>`<div class="top"><span>${LBL[q.k]} · ${TH[q.th].split(" (")[0]}</span><span>${i+1}/${set.length}</span></div><div class="bar"><i style="width:${i/set.length*100}%"></i></div>`;
 const fbk=(ok,txt,pts)=>{$("#fb").innerHTML=`<div class="fb">${ok?"✅ Richtig!":"❌ Nicht ganz."} ${txt?esc(txt):""}</div><button class="btn" id="n">Weiter ➜</button>`;$("#n").onclick=()=>next(pts)};
 function draw(){const q=set[i];
  if(q.k==="mc"||q.k==="fach"||q.k==="cloze"){const os=shuffle(q.o.map((t,j)=>[t,j===0]));
   app.innerHTML=head(q)+`<div class="card">${q.a?`<div class="art">${ART(q.a)}</div>`:""}<div class="q">${q.k==="fach"?"Wie heisst das richtig? "+esc(q.q):esc(q.q).replace("___","<u>&nbsp;?&nbsp;</u>")}</div>${os.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o[0])}</button>`).join("")}<div id="fb"></div></div>`;
   app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if($("#n"))return;const j=+b.dataset.j,c=os.findIndex(o=>o[1]);app.querySelectorAll(".opt")[c].classList.add("ok");if(j!==c)b.classList.add("bad");fbk(j===c,q.e||(q.k==="fach"?"Fachbegriff: "+q.o[0]:""),j===c?1:0)});}
  else if(q.k==="tf"){app.innerHTML=head(q)+`<div class="card"><div class="q">${esc(q.q)}</div><div class="row"><button class="btn green" data-v="1">✅ Stimmt</button><button class="btn red" data-v="0">❌ Stimmt nicht</button></div><div id="fb"></div></div>`;
   app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{if($("#n"))return;const ok=(b.dataset.v==="1")===q.r;fbk(ok,(q.r?"Die Aussage stimmt. ":"Die Aussage stimmt nicht. ")+q.e,ok?1:0)});}
  else if(q.k==="order"){const os=shuffle(q.o);const pick=[];
   app.innerHTML=head(q)+`<div class="card"><div class="q">${esc(q.q)}</div><p class="hint">Tippe in der richtigen Reihenfolge (zuerst das Erste).</p><div id="ol"></div>${os.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}<button class="btn sec" id="rs">↺ Neu</button><div id="fb"></div></div>`;
   const upd=()=>{$("#ol").innerHTML=pick.map((p,k)=>`<span class="item">${k+1}. ${esc(os[p])}</span>`).join("")};
   app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if($("#n"))return;const j=+b.dataset.j;if(pick.includes(j))return;pick.push(j);b.classList.add("dim");upd();
    if(pick.length===os.length){let r=0;pick.forEach((p,k)=>{if(os[p]===q.o[k])r++});const ok=r===q.o.length;$("#ol").innerHTML=q.o.map((o,k)=>`<div class="item" style="display:block;${os[pick[k]]===o?"":"outline:2px solid var(--rot)"}">${k+1}. ${esc(o)}</div>`).join("");$("#rs").remove();fbk(ok,ok?"":"So ist die richtige Reihenfolge. "+r+" von "+q.o.length+" am richtigen Platz.",r/q.o.length)}});
   $("#rs").onclick=()=>{pick.length=0;upd();app.querySelectorAll(".opt").forEach(b=>b.classList.remove("dim"))};}
  else if(q.k==="sort"){const os=shuffle(q.o);let k=0,r=0;
   const dr=()=>{app.innerHTML=head(q)+`<div class="card"><div class="q">${esc(q.q)}</div>${k<os.length?`<div class="center"><span class="item" style="font-size:20px;padding:12px 18px">${esc(os[k][0])}</span></div><div class="row" style="justify-content:center">${q.b.map((b,j)=>`<button class="btn ${j?"sec":""}" data-b="${j}">${b}</button>`).join("")}</div>`:""}
    <div class="bins">${q.b.map((b,j)=>`<div class="bin"><h4>${b}</h4>${os.slice(0,k).filter(o=>o[2]===j).map(o=>`<span class="item" style="${o[1]===j?"":"outline:2px solid var(--rot)"}">${o[1]===j?"":"❌ "}${esc(o[0])}</span>`).join("")}</div>`).join("")}</div><div id="fb"></div></div>`;
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const j=+b.dataset.b;os[k]=[os[k][0],os[k][1],j];if(os[k][1]===j)r++;k++;dr()});
    if(k>=os.length) fbk(r===os.length,r+" von "+os.length+" richtig einsortiert."+(r<os.length?" Rot = falsche Kiste.":""),r/os.length);};
   os.forEach((o,j)=>os[j]=[o[0],o[1]]);dr();}
  else if(q.k==="match"){const L=shuffle(q.p.map((p,j)=>[p[0],j])),R=shuffle(q.p.map((p,j)=>[p[1],j]));let selL=null,done=0,err=0;
   app.innerHTML=head(q)+`<div class="card"><div class="q">${esc(q.q)}</div><p class="hint">Links antippen, dann die passende Erklärung rechts.</p><div class="bins"><div>${L.map(l=>`<button class="opt" data-l="${l[1]}">${esc(l[0])}</button>`).join("")}</div><div>${R.map(r=>`<button class="opt" data-r="${r[1]}">${esc(r[0])}</button>`).join("")}</div></div><div id="fb"></div></div>`;
   app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{if(b.classList.contains("ok"))return;app.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");selL=+b.dataset.l});
   app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(selL==null||b.classList.contains("ok"))return;const lb=app.querySelector(`[data-l="${selL}"]`);
    if(+b.dataset.r===selL){b.classList.add("ok");lb.classList.remove("sel");lb.classList.add("ok");done++;selL=null;if(done===q.p.length)fbk(err===0,err?err+" Fehlversuch(e).":"",Math.max(0,1-err*0.25))}
    else{err++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500)}});}
 }
 function end(){const p=Math.round(score/set.length*100);const key=S.th;S.quiz[key]=S.quiz[key]||{best:0,n:0};S.quiz[key].best=Math.max(S.quiz[key].best,p);S.quiz[key].n++;save();
  app.innerHTML=`<div class="card center"><div class="medal">${p>=90?"🥇":p>=70?"🥈":p>=50?"🥉":"🔁"}</div><h2>${p} %</h2><p>${p>=90?"Top! Du bist bereit.":"Üb nochmals – jede Runde ist anders gemischt."}</p><button class="btn" id="a">🔁 Neue Runde</button><button class="btn sec" id="h">🏠 Übersicht</button></div>`;
  $("#a").onclick=mix;$("#h").onclick=home;}
 if(!set.length){app.innerHTML=`<div class="card">Keine Fragen für dieses Thema.</div>`;return}
 draw();
}
/* ---------------- 3 Karten ---------------- */
function flash(){stopT();const list=GLOSS.map((g,i)=>[g,i]).filter(([g])=>inTh(g[0]));let k=0;const order=shuffle(list);
 const dr=()=>{if(!order.length){app.innerHTML="Keine Karten";return}const [g,i]=order[k];
  app.innerHTML=`<a class="back" href="#" id="bk">← Übersicht</a><h2>🃏 Fachbegriffe-Karten</h2>${chips()}<div class="top"><span>${TH[g[0]]}</span><span>${k+1}/${order.length} · ✅ ${Object.keys(S.known).length}</span></div>
  <div class="flip card" id="fl"><div class="in"><div class="f">${esc(g[1])}</div><div class="b">${esc(g[2])}</div></div></div><p class="hint center">Antippen zum Umdrehen. Sag zuerst laut, was der Begriff bedeutet!</p>
  <div class="row" style="justify-content:center"><button class="btn red" id="no">🔁 Nochmals üben</button><button class="btn green" id="ok">✅ Kann ich</button></div>`;
  $("#bk").onclick=e=>{e.preventDefault();home()};bindChips(flash);$("#fl").onclick=()=>$("#fl").classList.toggle("on");
  $("#ok").onclick=()=>{S.known[i]=1;save();k=(k+1)%order.length;dr()};$("#no").onclick=()=>{delete S.known[i];save();k=(k+1)%order.length;dr()};};dr();}
/* ---------------- 4 Stand ---------------- */
function stand(){stopT();
 const rows=Object.entries(TH).map(([th,t])=>{const cs=CARDS.map((c,i)=>[c,i]).filter(([c])=>LZG[c.lz]===th);const done=cs.filter(([c,i])=>S.sim[i]!=null);const avg=done.length?done.reduce((a,[c,i])=>a+S.sim[i],0)/done.length/16*100:0;
  const gl=GLOSS.map((g,i)=>[g,i]).filter(([g])=>g[0]===th);const kn=gl.filter(([g,i])=>S.known[i]).length;
  return `<div class="card"><b>${t}</b><div class="lzbar"><span>🎤 Simulator ${done.length}/${cs.length} Karten</span><div class="bar"><i style="width:${avg}%"></i></div></div><div class="lzbar"><span>🃏 Fachbegriffe ${kn}/${gl.length}</span><div class="bar"><i style="width:${gl.length?kn/gl.length*100:0}%"></i></div></div><div class="hint">🧠 Quiz-Mix bestes Resultat: ${S.quiz[th]?S.quiz[th].best+" %":"–"}</div></div>`}).join("");
 app.innerHTML=`<a class="back" href="#" id="bk">← Übersicht</a><h2>📊 Mein Stand</h2><p class="hint">Grüner Balken = deine Selbstbewertung im Simulator. Kurze Balken = dort noch üben!</p>${rows}<button class="btn sec" id="rs">🗑️ Alles zurücksetzen</button>`;
 $("#bk").onclick=e=>{e.preventDefault();home()};$("#rs").onclick=()=>{if(confirm("Wirklich alles löschen?")){S={sim:{},quiz:{},known:{},th:"alle"};save();stand()}};
}
home();
</script></body></html>
