<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f2328">
<title>Baugeräteführer Theorie – EBA 2</title>
<style>
  :root{
    --bg:#f4f2ec;--card:#fff;--ink:#1f2328;--muted:#5f646b;--line:#ddd8cc;
    --yel:#f2b705;--yel-d:#c99600;--yel-l:#fff4cc;
    --ok:#2f7a4a;--ok-l:#dcf0e2;--no:#b3403a;--no-l:#f8e0de;--blue:#2b6a9a;--blue-l:#e1edf6;
    --fs:1rem;
  }
  *{box-sizing:border-box}
  html{font-size:16px}
  body.big{--fs:1.18rem}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
  header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--yel)}
  header .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  header a,header button{color:#fff;text-decoration:none;font-size:.92rem;background:none;border:0;font-family:inherit;cursor:pointer;padding:6px 0}
  header .sp{flex:1}
  header .chip{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 10px;font-weight:700;font-size:.85rem}
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px 60px}
  h1{font-size:1.55rem;margin:.4rem 0 .2rem;line-height:1.2}
  h2{font-size:1.15rem;margin:1.4rem 0 .6rem}
  .sub{color:var(--muted);margin:0 0 1rem}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px}
  .hero{background:var(--ink);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:repeating-linear-gradient(45deg,var(--yel) 0 14px,var(--ink) 14px 28px);opacity:.9;border-radius:50%}
  .hero h1{margin:0 0 .3rem;max-width:75%}
  .hero p{margin:0;color:#cfd3d8;max-width:75%}
  .stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;min-width:90px}
  .stat b{display:block;font-size:1.35rem}
  .stat small{color:#cfd3d8;font-size:.78rem}
  .bar{height:10px;background:#e6e1d4;border-radius:8px;overflow:hidden}
  .hero .bar{background:rgba(255,255,255,.15);margin-top:12px}
  .bar>div{height:100%;background:var(--yel);transition:width .4s}
  .btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:var(--fs);color:var(--ink);cursor:pointer;min-height:56px;font-family:inherit;line-height:1.35}
  .btn:hover{border-color:var(--yel-d)}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .btn .ic{font-size:1.6rem;flex:none;width:36px;text-align:center}
  .btn .tx{flex:1}
  .btn .tx small{display:block;color:var(--muted);font-size:.85rem}
  .btn.primary{background:var(--yel);border-color:var(--yel);font-weight:700;justify-content:center;text-align:center}
  .btn.primary:hover{background:#ffc414}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;justify-content:center}
  .btn.center{justify-content:center;font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px}
  .row .btn{margin:4px 0}
  .seg{display:flex;gap:8px;margin:6px 0 4px}
  .seg button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;min-height:48px}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:118px;display:flex;flex-direction:column;gap:4px;font-size:1rem}
  .tile:hover{border-color:var(--yel-d)}
  .tile .ic{font-size:1.8rem}
  .tile b{font-size:.98rem;line-height:1.2}
  .tile small{color:var(--muted);font-size:.8rem}
  .tile .bar{height:6px;margin-top:auto}
  .tile .bar>div{background:var(--ok)}
  /* Frage */
  .qmeta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:6px;gap:8px}
  .tag{background:var(--yel-l);color:#6b5200;border-radius:20px;padding:3px 10px;font-weight:700;font-size:.78rem}
  .qtext{font-size:calc(var(--fs) * 1.18);font-weight:700;margin:.3rem 0 .8rem;line-height:1.35}
  .qimg{display:block;margin:0 auto 10px;max-width:100%;max-height:240px;border-radius:10px;background:#fff;cursor:zoom-in}
  .note{background:var(--blue-l);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:8px}
  .opt{align-items:flex-start}
  .opt .lt{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800}
  .opt.ok{background:var(--ok-l);border-color:var(--ok)}
  .opt.ok .lt{background:var(--ok);color:#fff}
  .opt.no{background:var(--no-l);border-color:var(--no)}
  .opt.no .lt{background:var(--no);color:#fff}
  .opt.pick{border-color:var(--ink);background:#f0eee8}
  .opt.pick .lt{background:var(--ink);color:#fff}
  .fb{border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:600;font-size:var(--fs)}
  .fb.ok{background:var(--ok-l);color:#1d4f2f}
  .fb.no{background:var(--no-l);color:#7a2621}
  .tools{display:flex;gap:8px;margin-bottom:6px}
  .tbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:.9rem;cursor:pointer;font-family:inherit;min-height:40px}
  .streak{font-weight:800;color:var(--yel-d)}
  .big-score{font-size:3rem;font-weight:800;text-align:center;margin:.2rem 0}
  .center{text-align:center}
  .wrong-item{border-left:5px solid var(--no);padding:10px 12px;background:#fff;border-radius:10px;margin:8px 0}
  .wrong-item .a{color:var(--ok);font-weight:700;margin-top:4px}
  .wrong-item .y{color:var(--no);font-size:.9rem;margin-top:2px}
  input[type=search],select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font-size:1rem;font-family:inherit;background:#fff;min-height:48px}
  .look{background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0}
  .look .n{color:var(--muted);font-size:.8rem}
  .look .q{font-weight:700;margin:2px 0 6px}
  .look .a{color:var(--ok);font-weight:600}
  .look img{max-height:110px;max-width:60%;display:block;margin:4px 0}
  .zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
  .small{font-size:.85rem;color:var(--muted)}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  @media (min-width:600px){.tiles{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

<script>
const D = {"topics":{"pikto":"Piktogramme","strasse":"Strasse & Ausweise","umwelt":"Umweltschutz","anschlag":"Anschlagen & Heben","ladung":"Ladung & Transport","motor":"Motor & Wartung","hydraulik":"Hydraulik","maschinen":"Arbeiten mit Maschinen","sicherheit":"Sicherheit & Verhalten"},"q":[{"n":1,"q":"Wer ist für das Ladegut, das Sie mit dem Radlader transportieren, verantwortlich?","o":["Sie als Fahrer des Radladers.","Der zuständige Vorgesetzte.","Der Sicherheitsbeauftragte des Betriebes."],"a":0,"t":"maschinen"},{"n":2,"q":"Was machen Sie immer, bevor Sie den Ihnen anvertrauten Radlader verlasse?","o":["Ich stelle den Radlader vorschriftsgemäss ab, unterbreche die Stromzufuhr und ziehe den Schlüssel ab.","Ich reinige das Gerät mit Wasser und Lappen.","Ich parkiere das Gerät bei der Zisterne und führe die täglichen Wartungsarbeiten durch."],"a":0,"t":"maschinen"},{"n":3,"q":"Welche Flüssigkeit wird zum Nachfüllen einer Batterie verwendet?","o":["Verdünnte Schwefelsäure.","Leitungswasser.","Destilliertes oder deionisiertes (demineralisiertes) Wasser."],"a":2,"t":"motor"},{"n":4,"q":"Wie schützt man sich beim Kontrollieren und Warten einer Batterie?","o":["Es sind keine besonderen Schutzvorkehrungen notwendig.","Das Tragen einer Schutzbrille ist unerlässlich. Es müssen Plastikhandschuhe getragen werden.","Handschuhe und Sicherheitsschuhe sind zu empfehlen."],"a":1,"t":"motor"},{"n":5,"q":"Welche Gefahren sind beim Laden der Batterie zu beachten?","o":["Explosionsgefahr, da sich beim Ladevorgang in den Zellen Knallgas entwickelt.","Die Batterie muss immer ausgebaut werden.","Das Laden von Batterien ist völlig ungefährlich."],"a":0,"t":"motor"},{"n":6,"q":"Was machen Sie, wenn eine Baumaschine Feuer fängt?","o":["Sich aus der Gefahrenzone begeben, Alarmieren, Personen retten, Löschversuch unternehmen.","Ich rufe eine Person an, um beim Löschen zu helfen.","Ich lasse das Fahrzeug brennen und begebe mich in Sicherheit."],"a":0,"t":"sicherheit"},{"n":7,"q":"Worauf muss beim Betanken eines Fahrzeuges mit Verbrennungsmotor besonders geachtet werden?","o":["Bei jedem Betanken messe ich den Ölstand.","Motor abstellen. Das Rauchen ist einzustellen. Allfällig verschütteter Treibstoff ist aufzutrocknen.","Der Treibstoffbezug muss gemeldet oder eingetragen werden."],"a":1,"t":"motor"},{"n":8,"q":"Weshalb muss ein Dieselmotor bei kalten Temperaturen vorgewärmt werden?","o":["Damit der Motor weniger Treibstoff verbraucht.","Zur Erwärmung der Ansaugluft, damit der Motor leichter anspringt.","Damit sich die Batterie schneller aufladen kann."],"a":1,"t":"motor"},{"n":9,"q":"Warum darf ein Verbrennungsmotor in kaltem Zustand nicht mit hoher Drehzahl gefahren werden?","o":["Zu starke Lärmbelastung.","Das Motorenöl ist noch zu kalt und die Schmierung daher ungenügend. Der Motorenverschleiss ist unnötig viel höher.","Das Hydrauliköl ist noch zu dickflüssig."],"a":1,"t":"motor"},{"n":10,"q":"Wie oft reinigen Sie den Luftfilter?","o":["Der Luftfilter reinigt sich selbst.","Die Reinigung ist abhängig vom Einsatzort und Einsatzdauer der Maschine.","Bei heissen Temperaturen muss der Luftfilter jede Woche gereinigt werden."],"a":1,"t":"motor"},{"n":11,"q":"Sie prüfen den Kühlwasserstand und stellen fest, dass sich zu wenig Wasser im Ausgleichsbehälter befindet. Was füllen Sie nach?","o":["Sauberes Leitungswasser.","Destilliertes Wasser.","Kühlmittel mit Frostschutz gemäss den Angaben der Bedienungsanleitung."],"a":2,"t":"motor"},{"n":12,"q":"Wann prüfen Sie normalerweise den Motorenölstand?","o":["Immer freitags, damit die Maschine am Montag sofort einsatzbereit ist.","Nur wenn die Öldruck-Kontrolllampe aufleuchtet.","Bei kaltem Motor und dies, wenn möglich jeweils am Morgen."],"a":2,"t":"motor"},{"n":13,"q":"Sie haben den Ölmessstab gezogen und sehen, dass der Ölstand über dem Maximum steht. Wie beurteilen Sie diese Situation?","o":["Es ist besser, wenn es zu viel, als zu wenig Öl im Motor hat.","Die Schmierung des Turboladers ist hiermit sicher ausreichend.","Ich prüfe, ob die Maschine waagrecht steht. Wenn nein, Maschine waagrecht stellen und erneut den Ölstand prüfen. Wenn ja, melde ich mich umgehend bei der Werkstatt."],"a":2,"t":"motor"},{"n":14,"q":"Auf was achten Sie, bevor sie den Hydraulikölstand überprüfen?","o":["Die Arbeitsausrüstung gemäss Herstellerangaben positionieren.","Der Ölstand darf nur vom Werkstattpersonal kontrolliert werden.","Die Maschine muss vorher gereinigt werden."],"a":0,"t":"motor"},{"n":15,"q":"Als kompetenter Baumaschinenführer bedienen Sie verschiedene Maschinen. Wer ist für die Betriebssicherheit verantwortlich?","o":["Die Gerätehersteller.","Der Maschineninhaber.","Als Baumaschinenführer bin ich für die Betriebssicherheit verantwortlich."],"a":2,"t":"sicherheit"},{"n":16,"q":"Sie verlassen für ca. 2 – 3 Minuten die Führerkabine des Radladers. Auf was achten Sie?","o":["Ich ziehe die Handbremse an und lasse den Motor laufen, damit der Turbolader mit Öl versorgt wird.","Ich senke die Arbeitsausrüstung ab, stelle den Motor ab, schalte den Sicherungshebel der Hydraulik aus und sichere die Maschine gegen das Wegrollen.","Muss keine besonderen Massnahmen treffen, denn sobald der Fahrhebel auf neutral steht, ist auch die Maschine gesichert."],"a":1,"t":"maschinen"},{"n":17,"q":"Zwecks Wartungsarbeiten darf sich am Radlader das Hubgerüst nicht absenken. Welche Vorsichtsmassnahmen treffen Sie?","o":["Keine, denn die Hydraulikzylinder fahren nur ein, wenn ich den Bedienungshebel arretiere.","Die Ausrüstung muss gemäss Hersteller gesichert werden.","Die Ausrüstung muss nur gesichert werden, wenn das Hydrauliköl heiss ist."],"a":1,"t":"maschinen"},{"n":18,"q":"Wie viele Personen dürfen in einer Führerkabine mitfahren?","o":["Nur so viele Personen wie Sitzplätze vorhanden sind.","Falls die Kabinentür geschlossen wird, dürfen mehrere Personen mitfahren.","Aus Sicherheitsgründen darf sich nur der Fahrer in der Kabine befinden."],"a":0,"t":"sicherheit"},{"n":19,"q":"Während Sie mit dem Radlader arbeiten, kommt Ihr Vorgesetzter und steigt auf die Maschine. Wie verhalten Sie sich?","o":["Der Vorgesetzte hat diese Kompetenz und darf während der Fahrt ausserhalb der Kabine mitfahren.","Sollte etwas passieren, so trägt der Vorgesetzte die Verantwortung.","Ich halte an, nehme einen allfälligen Auftrag entgegen, fordere den Vorgesetzten auf, die Maschine zu verlassen und arbeite weiter."],"a":2,"t":"maschinen"},{"n":20,"q":"Wie ist die Stellung der Gabeln bei einer Fahrt ohne Last?","o":["Keine Vorschriften.","Waagrecht ca. 60 cm über dem Boden.","Waagrecht ca. 15 cm über dem Boden."],"a":2,"t":"maschinen"},{"n":21,"q":"Was überlegen Sie immer, bevor Sie eine Last vom Boden abheben?","o":["Ich vergewissere mich, ob die Wareneingangskontrolle durchgeführt ist.","Ich beurteile das Gewicht der Ladung in Bezug auf den Schwerpunktabstand.","Ich schaue, dass die Last immer an der Gabelwurzel anliegt, damit sie nicht beschädigt wird."],"a":1,"t":"maschinen"},{"n":22,"q":"Was versteht man unter “Lastschwerpunktabstand“?","o":["Das ist der Abstand des Schwerpunktes der Last vom Boden aus gemessen.","An diesem Punkt muss die Last angehoben werden.","Dies ist der Abstand des Schwerpunktes der Last von der Gabelwurzel."],"a":2,"t":"maschinen"},{"n":23,"q":"Darf eine Last mit nur einer Gabelzinke angehoben werden?","o":["Ja, ohne weiteres, wenn die Last nicht abrutscht.","Ja, sofern die Last nicht zu schwer ist.","Nein, denn die Gabeln können so verbogen werden."],"a":2,"t":"maschinen"},{"n":24,"q":"Wie verhalten Sie sich, wenn ein Vorgesetzter einen Transport befiehlt, der den Radlader eindeutig überlasten würde?","o":["Ich sage dem Vorgesetzten, dies „koste dann eine Runde“ und führe den Auftrag aus.","Einem Vorgesetzten widerspreche ich auf keinem Fall.","Ich weise auf die Tragfähigkeit des Staplers hin. Wenn der Sachverhalt eindeutig ist, lehne ich den Auftrag ab."],"a":2,"t":"maschinen"},{"n":25,"q":"Von welcher Seite wird eine Palette mit ungleich verteilter Ladung aufgenommen?","o":["Der schwerere Teil soll dem Fahrzeug zugewendet sein.","Eine solche Palette darf nicht transportiert werden.","Es spielt keine Rolle, wie die Palette aufgenommen wird."],"a":0,"t":"ladung"},{"n":26,"q":"Wie soll die Last für den Transport auf den Gabeln aufliegen?","o":["Möglichst am Gabelrücken anliegend, weil so der Lastschwerpunkt am günstigsten liegt.","Die Last soll ungefähr 5 cm vom Gabelrücken entfernt aufgenommen werden, da diese sonst beschädigt werden könnte.","Die Last muss so aufgenommen werden, dass die Gabelspitzen nicht über die Last hinausragen."],"a":0,"t":"maschinen"},{"n":27,"q":"Wer darf Radlader auf öffentlichen Strassen führen?","o":["Jedermann, der auch betriebsintern zum Führen des betreffenden Fahrzeuges berechtigt ist.","Alle betriebsintern Berechtigten, sofern der Betrieb eine Fahrzeug-Haftpflicht-Versicherung abgeschlossen hat.","Nur wer die Prüfung zum Führen des entsprechenden Fahrzeuges abgelegt hat und zudem einen für die Fahrzeugkategorie gültigen, amtlichen Führerausweis besitzt."],"a":2,"t":"strasse"},{"n":28,"q":"Dürfen Sie mit dem Radlader auf öffentlichen Strassen Lasten transportieren?","o":["Ja, sofern der Fahrer einen Führerausweis und die Staplerprüfung bestanden hat.","Dies ist verboten.","Nur mit einer Sonderbewilligung der zuständigen Behörde (Polizei)."],"a":2,"t":"strasse"},{"n":29,"q":"Wie fahren Sie mit einem beladenen Radlader hangabwärts?","o":["Vorwärts (Last talseitig).","Rückwärts (Last bergseitig) und langsamer Fahrt.","Dies spielt keine Rolle."],"a":1,"t":"maschinen"},{"n":30,"q":"Wie fahren Sie mit einem beladenen Radlader hangaufwärts, wenn die Ladung die Sicht nach vorn behindert?","o":["Vorwärts, im Schritttempo unter Beizug einer Hilfsperson.","Rückwärts (Last talseitig), und in langsamer Fahrt.","Eine solche Fahrt darf nicht ausgeführt werden."],"a":0,"t":"ladung"},{"n":31,"q":"Dürfen Sie mit dem Radlader Personen für das Schneiden von Hecken in die Höhe heben?","o":["Ja, wenn der Mitarbeiter sicher auf einer längs aufgenommenen Palette stehen kann.","Ja, sofern der Mitarbeiter in einer SUVA-geprüften Arbeitsschaufel stehen kann.","Nein, dies ist in jedem Fall verboten."],"a":2,"t":"sicherheit"},{"n":32,"q":"Dürfen auf den Gabeln eines Radladers Personen mitgeführt werden?","o":["Nein, niemals!","Ja, aber nur um eine unstabile Ladung zu sichern und wenn sich die Person festhalten kann.","Ja, wenn sehr vorsichtig gefahren wird."],"a":0,"t":"maschinen"},{"n":33,"q":"Wann darf ein Radlader bei hochgefahrener Last vom Fahrer verlassen werden?","o":["Nur, wenn die Handbremse angezogen ist und der Motor ausgeschaltet ist.","Überhaupt nicht.","Nur kurz, bei angezogener Handbremse."],"a":1,"t":"maschinen"},{"n":34,"q":"Worauf ist beim Wechsel der Fahrtrichtung von der Vor- zur Rückwärtsfahrt besonders zu achten?","o":["Vor dem Wechseln der Fahrtrichtung stark bremsen.","Nachfolgenden Verkehr beobachten, Fahrzeug zum Stillstand bringen und dann umschalten.","Nach dem Umschalten rasch beschleunigen."],"a":1,"t":"sicherheit"},{"n":35,"q":"Was ist bei Grabenabdeckungen zu beachten?","o":["Tragkraft und Gleitsicherheit.","Nichts Besonderes, wenn sie nicht markiert ist.","Solche Stellen dürfen generell nicht befahren werden."],"a":0,"t":"maschinen"},{"n":36,"q":"Wodurch wir die Arbeit des Radladerfahrers erschwert?","o":["Maschinen fahren ist einfach und bequem.","Durch die unbequeme Körperhaltung, die der Fahrer einnehmen muss.","Die Rundsicht ist eingeschränkt und der Raum oberhalb der Maschine muss ebenfalls beobachtet werden."],"a":2,"t":"maschinen"},{"n":37,"q":"Dürfen sich Hilfspersonen im Gefahrenbereich einer Baumaschine aufhalten?","o":["Grundsätzlich dürfen sich keine Personen im Gefahrenbereich aufhalten. Ist dies jedoch nicht möglich, darf sich die Hilfsperson nur im Sichtfeld des Fahrers aufhalten.","Wenn die Rückspiegel sauber und intakt sind, dürfen sich Hilfspersonen auch im Gefahrenbereich aufhalten.","Nur ausgebildete Hilfspersonen dürfen sich in den Gefahrenbereich begeben."],"a":0,"t":"sicherheit"},{"n":38,"q":"Welche Pflichten hat der Arbeitnehmer in Bezug auf die Arbeitssicherheit zu erfüllen?","o":["Solange er sich bei der Arbeit sicher fühlt hat er keine Pflichten zu erfüllen.","Wenn er die PSA trägt muss er keine weiteren Pflichten erfüllen.","Er muss den Anweisungen des Arbeitgebers Folge leisten und die zur Verfügung gestellte PSA benützen."],"a":2,"t":"sicherheit"},{"n":39,"q":"Welche Pflichten hat der Arbeitgeber in Bezug auf die Arbeitssicherheit zu erfüllen?","o":["Solange sich der Arbeitnehmer wohl fühlt keine.","Der Arbeitgeber muss alle Massnahmen zur Verhütung von Unfällen treffen die nach Erfahrung notwendig, nach Stand der Technik anwendbar und den Verhältnissen angepasst sind.","Er muss dem Arbeitnehmer genügend Lohn zahlen, damit er bei einem Unfall keine finanziellen Sorgen hat."],"a":1,"t":"sicherheit"},{"n":40,"q":"Warum ist eine Ausbildung für Baugeräte nötig?","o":["Das Führen von Baugeräten stellt eine Arbeit mit besonderen Gefahren dar. Deshalb müssen die Bediener gemäss der VUV Art. 8 ausgebildet sein.","Weil Baugeräte sehr billig sind.","Weil es mindestens einen Mitarbeiter im Betrieb braucht, der eine Ausbildung vorweisen kann."],"a":0,"t":"sicherheit"},{"n":41,"q":"Wie dürfen Sie einen Raddumper mit der unten abgebildeten Nummer im öffentlichen Verkehr einsetzen?","o":["Muss Schwerverkehrsabgabe bezahlen sonst darf er nicht eingesetzt werden","Es dürfen keine gewerblichen Transporte auf öffentlichen Strassen durchgeführt werden.","Der Raddumper darf nur von Personen der Feuerwehr bewegt werden."],"a":1,"img":"img/q41.png","t":"strasse"},{"n":42,"q":"Wie dürfen Sie einen Raddumper mit der unten abgebildeten Nummer im öffentlichen Verkehr einsetzen?","o":["Der Raddumper darf beladen werden und Transporte auf öffentlichen Strassen ausführen.","Der Raddumper darf nur am Tag eingesetzt werden.","Der Raddumper darf nur mit Personen mit Autofahrprüfung bewegt werden."],"a":0,"img":"img/q42.png","t":"strasse"},{"n":43,"q":"Welche Führerausweiskategorie benötigen Sie, nebst der Baugeräteführer-Ausbildung, um mit einen Raddumper auf öffentlichen Strassen zu fahren?","o":["Kategorie F","Keine weitere nötig, Baugeräteführer Ausbildung reicht.","Kategorie B"],"a":0,"t":"strasse"},{"n":44,"q":"Auf welcher Seite befindet sich das Antriebsrad beim Arbeiten mit einem Raupenbagger?","o":["Das Antriebsrad befindet sich in der Regel vorne.","Das Antriebsrad befindet sich in der Regel hinten.","Es spielt keine Rolle."],"a":1,"t":"maschinen"},{"n":45,"q":"Was machen Sie mit der Ausrüstung am Raupenbagger bevor Sie diesen verlassen?","o":["Nichts Besonderes, aber ich informiere die anderen, dass niemand unten durchläuft.","Beim Verlassen der Führerkabine darf die Ausrüstung 50 cm über dem Boden sein.","Wird die Führerkabine verlassen, muss die Arbeitsausrüstung vorher auf sicheren Boden abgesenkt werden."],"a":2,"t":"maschinen"},{"n":46,"q":"Auf welcher Seite befindet sich das Leitrad wenn Sie mit dem Raupenbagger ohne Planierschild Hangaufwärts fahren müssen?","o":["Es spielt keine Rolle auf welcher Seite sich das Leitrad befindet.","Beim Hangaufwärtsfahren befindet sich das Leitrad talseitig.","Beim Hangaufwärtsfahren befindet sich das Leitrad immer Bergseitig."],"a":2,"t":"maschinen"},{"n":47,"q":"Wie heisst der unten abgebildete Takt bei einem Viertaktmotor?","o":["Ansaugen","Verdichten","Arbeiten"],"a":2,"img":"img/q47.png","t":"motor"},{"n":48,"q":"Wie heisst der unten abgebildete Takt bei einem Viertaktmotor?","o":["Ansaugen","Verdichten","Arbeiten"],"a":1,"img":"img/q48.png","t":"motor"},{"n":49,"q":"Wie heisst der unten abgebildete Takt bei einem Viertaktmotor?","o":["Ansaugen","Ausstossen","Arbeiten"],"a":0,"img":"img/q49.png","t":"motor"},{"n":50,"q":"Wie heisst der unten abgebildete Takt bei einem Viertaktmotor?","o":["Ansaugen","Ausstossen","Arbeiten"],"a":1,"img":"img/q50.png","t":"motor"},{"n":51,"q":"Wie wird die Zündung beim Arbeitsgang im Zylinder eines Dieselmotors ausgelöst?","o":["Mit der Zündkerze wird ein Funken ausgelöst welcher das verdichtete Diesel-Luftgemisch entzündet.","Die Frischluft hat sich durch das verdichten stark erhitzt nun wird über eine Einspritzdüse Diesel in den Zylinder eingespritzt. Das Diesel Luftgemisch entzündet sich sehr schnell in der heissen Luft.","Da Diesel sich schwerer entzündet als Benzin, haben Diesel Motoren eine ganz spezielle Arbeitskerze welche die Zündung auslöst."],"a":1,"t":"motor"},{"n":52,"q":"Wie so dürfen Sie einen Motor mit Turbolader nie unter Volllast abstellen?","o":["Damit der Turbolader keinen Schaden nimmt und die Schmierung bis zum Stillstand des Turboladers gewährleistet ist.","Bei sofortigem abstellen hat der Motor keine Leistung mehr.","Damit der Turbolader bis zum Schluss schön warm bleibt."],"a":0,"t":"motor"},{"n":53,"q":"Welche Aufgabe hat der Dieselpartikelfilter?","o":["Er filtert den Diesel damit eine saubere Verbrennung gewährleistet ist.","Er filtert die Russpartikel und feinen Stäube aus den Abgasen damit die Luft weniger verschmutzt wird.","Er reinigt die Ansaugluft beim Motor damit dieser keinen Schaden nimmt."],"a":1,"t":"umwelt"},{"n":54,"q":"Wie ist die Ladung zu sichern?","o":["Die Ladung ist so zu sichern, dass nur eine geringe Bewegung während des Transportes möglich ist.","Die Ladung ist so zu sichern, dass eine Bewegung während des Transportes ausgeschlossen ist.","Die Sicherung der Ladung ist nicht speziell geregelt."],"a":1,"t":"ladung"},{"n":55,"q":"1000 kg sind ungefähr?","o":["1000 daN","10 daN","100 daN"],"a":0,"t":"ladung"},{"n":56,"q":"Welchen Einfluss hat das Gewicht auf die Reibung?","o":["Durch ein höheres Gewicht wird der Reibwert erhöht. Es werden weniger Zurrmittel benötigt","Durch ein höheres Gewicht wird der Reibwert vermindert. Es werden mehr Zurrmittel benötigt","Keinen"],"a":2,"t":"ladung"},{"n":57,"q":"Was bedeutet STF 450 daN?","o":["Vorspannkraft mit welcher die Ladung gegen den Fahrzeugboden gedrückt wird.","Maximale Zugkraft der Zurgurten.","Nutzlast der Zurrgurte."],"a":0,"img":"img/q57.png","t":"ladung"},{"n":58,"q":"Was bedeutet LC2500 daN?","o":["Belastbarkeit der Zurrgurten im geraden Zug.","Seriennummer der Zurrgurte.","Maximales Gewicht welches mit dieser Zurrgurte gesichert werden darf."],"a":0,"img":"img/q58.png","t":"ladung"},{"n":59,"q":"Dürfen Sie mit einer Zurrgurte Ladungen am Raupenbagger Anschlagen?","o":["Wenn ich die Nutzlast gemäss Tragfähigkeitsetikette Einhalte darf ich.","Nur, wenn die Zurrgurte in Einwandfreiem Zustand ist.","Das ist in jedem Fall verboten."],"a":2,"t":"anschlag"},{"n":60,"q":"Wann müssen Zurrmittel auf mögliche Schäden überprüft werden?","o":["Einmal pro Monat.","Hier gibt es keine Regelung.","Vor- und nach jeder Benutzung."],"a":2,"t":"ladung"},{"n":61,"q":"Wie ist die untenstehende Ladung gesichert?","o":["Kraft- und Formschlüssig","Formschlüssig","Kraftschlüssig"],"a":2,"img":"img/q61.png","t":"ladung"},{"n":62,"q":"Wie ist die untenstehende Ladung gesichert?","o":["Kraft- und Formschlüssig","Formschlüssig","Kraftschlüssig"],"a":1,"img":"img/q62.png","t":"ladung"},{"n":63,"q":"Zurrmittel ohne Etikette dürfen…?","o":["…nicht mehr verwendet werden und müssen ausgesondert werden.","…nur noch verwendet werden, wenn die maximale Zurrkraft (LC) bekannt ist.","…nur noch auf Nebenstrassen verwendet werden."],"a":0,"t":"ladung"},{"n":64,"q":"Muss die Ladungssicherung während der Fahrt kontrolliert werden?","o":["Ja, regelmässig.","Nein nur vor der Abfahrt.","Nur nach starken Fahrmanövern."],"a":0,"t":"ladung"},{"n":65,"q":"Wie Gross ist der maximale Neigungswinkel beim Anschlagen von Lasten?","o":["50°","60°","70°"],"a":1,"t":"anschlag"},{"n":66,"q":"Wie gross ist die Tragfähigkeit noch bei einem Anschlagmittel, wenn der Neigungswinkel 30° beträgt?","o":["70%","87%","100%"],"a":1,"img":"img/q66.png","t":"anschlag"},{"n":67,"q":"Wie gross ist die Tragfähigkeit noch bei einem Anschlagmittel, wenn der Neigungswinkel 60° beträgt?","o":["80%","60%","50%"],"a":2,"img":"img/q67.png","t":"anschlag"},{"n":68,"q":"Aus welchem Material ist eine Hebeband, wenn die Tragfähigkeitsetikette blau ist?","o":["Polypropylen (PP)","Polyamid (PA)","Polyester (PES)"],"a":2,"t":"anschlag"},{"n":69,"q":"Welche Tragfähigkeit hat eine Violette Rundschlinge?","o":["1000 kg","2000 kg","3000 Kg"],"a":0,"t":"anschlag"},{"n":70,"q":"Welche Tragfähigkeit hat eine gelbe Rundschlinge?","o":["1000 kg","2000 kg","3000 Kg"],"a":2,"t":"anschlag"},{"n":71,"q":"Wieso dürfen nasse gefrorene Rundschlingen nicht eingesetzt werden?","o":["Da sich die Rundschlinge bei der Belastung überdurchschnittlich ausdehnt.","Da sie dann Steif sind und nicht in die richtige Form passen.","bei der Dehnung werden die Textilfasern durch die Eiskristalle zerschnitten."],"a":2,"t":"anschlag"},{"n":72,"q":"Wie wird das Hydrauliksystem entlastet vor einer Greiferdemontage?","o":["Maschinen normal laufen lassen. Funktionshebel auf alle Seiten bewegen um Druck ab zu lassen, Maschine abstellen.","Motor abstellen, Zündung einschalten, Funktionshebel auf alle Seiten bewegen, Zündung ausschalten.","Bei der Demontage braucht es keine Entlastung erst vor der Montage."],"a":1,"t":"hydraulik"},{"n":73,"q":"Wie gehen Sie vor bei einer Greifer Montage?","o":["Greifer anhängen, Schläuche anhängen, Verriegelung kontrollieren, und fünf Minuten warten bis das Hydrauliköl durch die Restwärme warm ist.","Baggerhydraulik druckentlasten, Greifer anhängen, Verriegelung kontrollieren, abdrücken, Schläuche anhängen, und fünf Minuten warten bis das Hydrauliköl wieder überall verteilt ist.","Greifer anhängen, Verriegelung kontrollieren optisch, abdrücken mechanisch, Baggerhydraulik druckentlasten, Schläuche anhängen, Funktionskontrolle."],"a":2,"t":"hydraulik"},{"n":74,"q":"Wie reinigen Sie eine Trockenluftfilter Kartouche?","o":["Mit starker Druckluft.","Mit Wasserdruck und nur von innen nach aussen.","Durch ausklopfen."],"a":2,"t":"motor"},{"n":75,"q":"Wo steht die Hilfsperson, wenn ein Schacht versetzt wird mit dem Bagger?","o":["Es darf niemand in den Gefahrenbereich der Maschine.","Wenn der Maschinist das Zeichen gibt, kann die Hilfsperson in den Gefahrenbereich, aber nicht im seitlichen Schwenkbereich und nicht zwischen Maschine und Last und immer im Sichtbereich des Maschinisten.","Wenn der Maschinist und die Hilfsperson abgemacht haben was gemacht werden muss, steht die Hilfsperson zwischen Maschine und Schacht."],"a":1,"t":"maschinen"},{"n":76,"q":"Wie kann man zwei Rundschlingen verbinden?","o":["Verknüpfen","Mit einem Schäkel.","Ist nicht zugelassen."],"a":1,"t":"anschlag"},{"n":77,"q":"Wie parken Sie einen Raupenbagger im Winter?","o":["Arbeitsausrüstung gestreckt, Maschine auf Bretter und die Kolbenstangen bei Möglichkeit mit öligen Tüchern schützen.","Fahrwerk gereinigt, Maschine auf Bretter, Arbeitsausrüstung gestreckt und die Kolbenstangen abgedeckt gegen Witterungseinflüsse.","Die Maschine muss auf Brettern auf einem Asphaltbelag stehen (Frost), und die Werbung muss von der Strasse gut sichtbar sein."],"a":1,"t":"maschinen"},{"n":78,"q":"Wie gehen Sie vor, wenn die Tankkontrollleuchte aufleuchtet?","o":["Maschine sofort abstellen und Mechaniker benachrichtigen.","Ich fahre weiter, bis der Tank ganz leer ist.","Ich stoppe die Maschine bei nächster Gelegenheit und fülle den Tank mit dem richtigen Treibstoff auf."],"a":2,"t":"motor"},{"n":79,"q":"Welche Informationen müssen Sie als Baugeräteführer zwingend erhalten, um eine Ihnen unbekannte Maschine bedienen zu können?","o":["Inbetriebnahme, Funktion der Bedienelemente, Bedeutung der Warn / Funktionsleuchten, Fachgerechte Bedienung, Sicherheitsvorschriften, Ausserbetriebnahme.","Inbetriebnahme, Wartung und Reparatur, Technische Daten, Leistungsparameter, Ausserbetriebnahme.","Wie ist die Maschine zu starten und wie ist diese bei Regen zu verladen."],"a":0,"t":"sicherheit"},{"n":80,"q":"Welche der Aussagen zum Thema persönlicher Schutzausrüstung (PSA) trifft zu?","o":["PSA wird muss vom Betrieb zur Verfügung gestellt werden, von den Mitarbeitern auf Mann getragen und Situationsgerecht selbständig eingesetzt werden.","PSA kann von Betrieb zur Verfügung gestellt werden und kann von den Mitarbeitern Situationsgerecht eingesetzt werden.","PSA ist sehr teuer, daher sollte sie nur sehr vorsichtig und nur im äussersten Notfall eingesetzt werden."],"a":0,"t":"sicherheit"},{"n":81,"q":"Welche persönliche Schutzausrüstung (PSA) benötigen Sie zwingen auf der Baustelle, wenn folgende Maschinen im Einsatz sind? Dieselbetriebener Raupenbagger 1.5 Tonnen, Raddumper 1 Tonnen und 80 kg Vibroplatte.","o":["Helm, Schutzbrille, Gehörschutz, reflektierende Bekleidung, Sicherheitsschuhe S 3, Handschuhe.","Beim Umgang mit den erwähnten Maschinen ist keine PSA zwingend nötig.","Schutzbrille, Gehörschutz, reflektierende Bekleidung, Sicherheitsschuhe S3, Handschuhe."],"a":0,"t":"sicherheit"},{"n":82,"q":"Welche Anforderungen muss ein Arbeitsschuh im Gartenbau erfüllen?","o":["Er muss zur Firmenbekleidung passen und sollte eine Stahlkappe haben.","Er muss eine säureresistente Schuhsohle mit Stahleinlage und eine Stahlkappe haben.","Es muss ein anerkannter Sicherheitsschuh S3 sein."],"a":2,"t":"sicherheit"},{"n":83,"q":"Welche Aussagen zu Thema Gehörschutz sind zutreffend?","o":["Bei Lärmbelastungen ab 85 dB ist das Tragen eines Gehörschutzmittels obligatorisch.","Gehörschutzpfropfen sind sehr kostspielig und sollten so oft wie möglich getragen werden.","Akustische Warnsignale müssen mit dem Gehörschutz nicht mehr wahrgenommen werden können."],"a":0,"t":"sicherheit"},{"n":84,"q":"In welchen Situationen muss ein Helm zwingend getragen werden?","o":["Wenn Bagger oder Kräne im Einsatz sind. Wenn ein Gerüst vorhanden ist oder auf verschiedenen Höhenniveaus gearbeitet wird.","Nur bei Kraneinsätzen.","Nur wenn die Bauleitung auf der Baustelle dies anordnet."],"a":0,"t":"sicherheit"},{"n":85,"q":"Wann müssen Sie sich auf einer Baumaschine angurten?","o":["Wenn ich mich unsicher fühle und damit rechnen muss, dass die Maschine umstürzten kann.","Grundsätzlich immer, auch wenn ein Überrollschutz vorhanden ist.","Nur wenn ein Gurt vorhanden der nicht defekt ist."],"a":1,"t":"sicherheit"},{"n":86,"q":"Welches ist die korrekte und komplette Aussage zu einer täglichen Inbetriebnahme?","o":["Füllstandkontrolle von: Motorenöl, Hydrauliköl und Kühlerflüssigkeit. Rundgang und Sichtkontrolle Beschädigungen, Ölverluste und Sicherheitsrelevanter Bauteile. Treibstofffüllstand, sauberes Sichtfeld.","Ich kontrolliere den Treibstofffüllstand und lasse die Maschine warmlaufen.","Füllstandkontrolle: Motorenöl, Kühlerflüssigkeit. Rundgang Beschädigungen, Ölverluste und Sicherheitsrelevanter Bauteile."],"a":0,"t":"sicherheit"},{"n":87,"q":"Welches ist die korrekte und komplette Aussage zu einer täglichen Ausserbetriebnahme?","o":["Ich parkiere die Maschine, lese Die Stunden ab und fahre zurück ins Magazin","Ich parkiere die Maschine auf sauberen ebenen Grund, senke alle Anbauteile auf den Boden ab, sichere die Maschine gegen das Wegrollen, fülle dem Treibstoff auf und schmiere gemäss Wartungsplan. Ich ziehe den Schlüssel ab und fahre ins Magazin.","Ich parkiere die Maschine, senke alle Anbauteile auf den Boden ab, sichere die Maschine gegen das Wegrollen, fülle den Treibstoff auf. Ich ziehe den Schlüssel ab und fahre ins Magazin."],"a":1,"t":"sicherheit"},{"n":88,"q":"Sie arbeiten mit dem Raupenbagger, plötzlich leuchtet die rote Temperaturwarnanzeige auf. Wie verhalten Sie sich?","o":["Ich reduziere die Motorendrehzahl, senke die Arbeitsausrüstung auf dem Boden ab und stelle den Motor aus. Ich stelle die Zündung ein und öffne die Motorhaube.","Ich stelle den Motor auf Standgas, drehe die Heizung voll auf. Dann sichere ich die Maschine gegen das Wegrollen, stelle den Motor jedoch nicht ab, dann öffne ich die Motorhaube, um den Motor abkühlen zu lassen. Ich stelle die Ursache fest nach dem Abkühlen stelle ich den Motor ab und lasse die Ursache fachmännisch beheben.","Ich stelle den Motor sofort ab, fülle umgehend den Wasserkühler auf, und arbeite weiter."],"a":1,"t":"maschinen"},{"n":89,"q":"Was verstehen Sie unter Gefahrenbereich?","o":["Das ist die gesamte Fläche, die mit der Maschine bearbeitet wird.","Das ist der Fahr- und Schwenk- und Arbeitsbereich einer Maschine.","Das ist das ganze Baustellenareal."],"a":1,"t":"sicherheit"},{"n":90,"q":"Worauf ist beim Betrieb einer Grabenwalze besonders zu achten?","o":["Ich steuere das Gerät so, dass ich mich nirgends einklemmen kann. Ich fahre Steigungen stets von oben nach unten an und stehe oberhalb des Gerätes und halte Abstand zu Böschungen und Absätzen.","Ich steuere das Gerät so, dass ich mich nirgends einklemmen kann. Ich fahre Steigungen stets von unten nach oben an, dabei stehe ich am Hang oberhalb des Gerätes und halte Abstand zu Böschungen und Absätzen.","Solange ich min. zwei Mal über die selbe Fläche gefahren bin, brauche ich nichts anderes zu Beachten."],"a":1,"t":"maschinen"},{"n":91,"q":"Sie arbeiten mit dem Raupenbagger. Plötzlich spritzt Öl aus dem Hydraulikschlauch des Schwenklöffels. Wie verhalten Sie sich richtig?","o":["Ich stelle den Motor ab, verschliesse das Loch mit einem geeigneten Klebeband oder Lappen, dass es nicht mehr so spritzt. Danach arbeite ich weiter.","Ich stelle die Arbeitsausrüstung auf den Boden, stelle den Motor ab und mache die Hydraulikanlage drucklos. Ich fange das auslaufende Öl bestmöglich ab und beseitige das ausgelaufene Öl vorschriftsgemäss. Dann ersetze ich den kaputten Schlauch, fülle Hydraulik Öl nach und entlüfte das System, indem ich den betroffenen Zylinder einige Male langsam ein- und ausfahre. Danach arbeite ich weiter.","Ich stelle den Motor ab, wechsle den Schlauch und arbeite weiter."],"a":1,"t":"hydraulik"},{"n":92,"q":"Auf der Baustelle muss Material mit dem Raupendumper transportiert werden. Worauf muss beim Beladen besonders geachtet werden?","o":["Beim Beladen ist möglichst wenig Material zu verschütten, der Dumperfahrer muss nicht zwingend absteigen, wenn er den BGF-Ausweis besitzt. Jedoch sollte der Dumper maximal beladen werden.","Ohne Blickkontakt darf der Gefahrenbereich des Baggers nicht befahren werden, beim Ladevorgang muss der Dumperfahrer absteigen und den Gefahrenbereich verlassen. Die Ladung darf die Sicht des Fahrers nicht beeinträchtigen. Ebenfalls ist so zu Laden, dass keine Ladung verloren geht.","Die Arbeit muss speditiv erfolgen, allerdings sind Schäden an den Maschinen zu vermeiden. Der Dumperfahrer darf auf der Maschine stehen bleiben, wenn er Handschuhe und Helm trägt."],"a":1,"t":"maschinen"},{"n":93,"q":"Dürfen Vorschriftssignale ohne Bewilligung aufgestellt werden?","o":["Ja, da es eine Baustelle ist.","Nein, ich muss zwingend eine Bewilligung der Behörde einholen.","Ich darf nur Einbahntafeln selbst aufstellen."],"a":1,"t":"strasse"},{"n":94,"q":"Wie fahren Sie mit einem beladenen Raupendumper hangaufwärts?","o":["Vorwärts","Rückwärts","Ist egal solange ich keine Ladung verliere."],"a":0,"t":"maschinen"},{"n":95,"q":"Wie fahren Sie mit einem beladenen Dumper hangabwärts?","o":["Vorwärts","Rückwärts","Ist egal solange ich keine Ladung verliere."],"a":1,"t":"maschinen"},{"n":96,"q":"Der Raupendumper ist im schlammigen Untergrund stecken geblieben. Was machen Sie?","o":["Ich gebe Vollgas und versuche durch ständiges vor und zurücksetzten die Maschine aus dieser Lage zu befreien.","Ich lege Bretter oder Rampen unter die Raupen, reinige das Fahrwerk so gut wie möglich und fahre langsam und vorsichtig aus dem Schlamm.","Ich hänge den Raupendumper an den Bagger an und ziehe in aus dem Schlamm."],"a":1,"t":"maschinen"},{"n":97,"q":"Worauf müssen Sie beim Anbaugerätewechsel achten, wenn der Bagger mit einer hydraulischen Schnellwechseleinrichtung ausgerüstet ist?","o":["Ich bewege den Löffelzylinder in Position, so dass der Löffel nicht runterfallen kann, dann entriegle ich den Schnellwechsler und schaue ob der Bolzen entriegelt ist. Danach setze ich das Anbaugerät vorsichtig ab, nehme das neue Anbaugerät auf und verriegele den Schnellwechsler. Ich überzeuge mich, dass der Bolzen verriegelt ist und drücke das Anbaugerät mechanisch ab.","Ich entriegle den Bolzen, setzte das Anbaugerät ab, nehme das neue auf, verriegle den Bolzen und arbeite weiter.","Die Schnellwechseleinrichtung erleichtert den Gerätewechsel sehr, man muss aber nichts Besonderes beachten."],"a":0,"t":"hydraulik"},{"n":98,"q":"Die Dieselbetriebene Baumaschine beginnt zu stottern. Was machen Sie?","o":["Ich stelle den Motor ab und kontrolliere das Motorenöl. Danach starte ich den Motor wieder und lege einen kleineren Gang ein.","Ich schalte sofort den Motor aus, kontrolliere den Treibstofffüllstand, ist dieser leer, tanke ich auf. Ich schalte die Zündung ein, und kontrolliere ob der Dieselkreislauf wieder geschlossen ist. Falls dies nicht der Fall ist, muss gemäss Betriebsanleitung entlüftet werden. Dann starte ich den Motor wieder. Falls es eine andere Ursache hat, rufe ich einen Mechaniker.","Ich gebe Vollgas und hoffe, dass das Stottern aufhört."],"a":1,"t":"motor"},{"n":99,"q":"Die benzinbetriebene 80 kg Vibroplatte beginnt zu stottern und schwarz zu rauchen. Was machen Sie?","o":["Ich hole den Feuerlöscher, um bei einem Motorenbrand reagieren zu können.","Ich schalte sofort den Motor aus. Kontrolliere den Treibstoff. Ist der Richtige Treibstoff im Tank rufe ich den Mechaniker. Falls Diesel getankt wurde, entleere ich den Tank und die Leitungen komplett. Ich reinige die Zündkerze, ziehe vor dem Wiedereinsetzen 5-6 Mal am Starterseil um den Verbrennungsraum zu leeren. Dann setze ich die Zündkerze wieder ein und starte den Motor.","Ich warte 10 Minuten und versuche den abgekühlten Motor wieder zu starten, falls das Problem anhält wiederhol ich diese Vorgehensweise."],"a":1,"t":"motor"},{"n":100,"q":"Sie müssen mit dem 6 Tonnen Bagger eine Verbundsteinpalette vom Anhänger abladen. Worauf müssen Sie achten?","o":["Ich muss das Anbaugerät entfernen, geeignete Hebemittel verwenden, das Hilfspersonal klar instruieren, Handzeichen absprechen und darf den Bagger nicht überlasten.","Die Ladung darf mit dem Anbaugerät vorsichtig abgeladen werden.","Solange ich gelbe Dreitonnengurten verwende und alle Mitarbeiter Stahlkappenschuhe tragen, ist alles andere kein Problem."],"a":0,"t":"ladung"},{"n":101,"q":"In welcher Situation beim Arbeiten mit einem Bagger besteht die grösste Unfallgefahr?","o":["Auf- und Absteigen","Behinderte Sicht","Nicht gesicherte Arbeitseinrichtung"],"a":0,"t":"maschinen"},{"n":102,"q":"Auf Anweisung des Bauleiters müssen sie mit dem Raupenbagger das Trottoire befahren. Welche Sicherheitsmassnahmen treffen Sie?","o":["Keine, der Bauleiter würde uns dies sonst mitteilen.","Ich muss sicherstellen das keine Fussgänger behindert werden. Ist dies nicht möglich, muss ich Hilfspersonal beiziehen die gewährleisten, dass keine Fussgänger den Gefahrenbereich betreten. Die Strasse darf auf keinen Fall einfach befahren werden.","Ich erstelle eine temporäre Baustellensignalisation und leite die Fussgänger frühzeitig auf die andere Strassenseite um. Während den Arbeiten stelle ich eine Hilfsperson mit Warnbekleidung an die Strasse, die mir hilft, den Gefahrenbereich zu überwachen und den Fussgängern zu helfen."],"a":2,"t":"strasse"},{"n":103,"q":"Sie erhalten den Auftrag einen 80 cm tiefen Graben durch ein Grundstück zu erstellen. Worauf achten Sie bei der Arbeitsvorbereitung und bei der Arbeit selbst?","o":["Ich trenne Oberboden von Unterboden und deponiere beides separat.","Vor Beginn der Grabarbeiten studiere ich die Leitungspläne und sondiere allfällige Leitungen vorsichtig. Danach hebe ich den Graben aus, trenne Oberboden von Unterboden und deponiere beides separat.","Ich markiere den Grabenverlauf und beginne mit den Grabarbeiten und passe auf, dass ich keine Leitungen verletze."],"a":1,"t":"maschinen"},{"n":104,"q":"Letzte Woche besuchten Sie den Baugeräteführer Kurs. Der Vorarbeiter gibt Ihnen das Einverständnis Bagger fahren zu dürfen. Sie bekommen den Auftrag allein auf sich gestellt, einen Graben auszuheben. Wie reagieren Sie korrekt?","o":["Ich freu mich sehr über sein Vertrauen und lege sofort los.","Ich mache Ihn darauf aufmerksam, dass er mir zuerst die Maschine und die auszuführenden Arbeiten detailliert erklären muss. Ebenso soll er mir eine erfahrene Hilfsperson zur Seite stellen.","Ich verlange den Zündschlüssel, und frage wo ich die Maschine am Abend parkieren soll."],"a":1,"t":"sicherheit"},{"n":105,"q":"Wer ist für den sicheren Transport von Baumaschinen auf dem Anhänger verantwortlich?","o":["Der Fahrer.","Der Lader.","Der Fahrer und der Lader."],"a":2,"t":"ladung"},{"n":106,"q":"Sie erhalten den Auftrag einen 1.5 Tonnen Raupenbagger vom Magazin mit dem Anhänger auf die Baustelle mitzunehmen. Worauf muss geachtet werden, damit alles korrekt abläuft?","o":["Der Fahrer des Lieferwagens muss keine Anhängerprüfung im Ausweis eingetragen haben (B). Die Anhängelast des Zugfahrzeuges muss genug gross sein. Die Fahrweise ist der Last anzupassen.","Der Fahrer muss die Anhängerprüfung haben, Gemäss der Fahrzeugausweise kontrollieren sie die Stütz-, Deichsel- und Anhängelast. Es müssen genügend und der Last entsprechende Zurmittel zur Verfügung stehen. Die Zurrpunkte müssen bekannt sein. Die Last muss so auf dem Anhänger platziert werden das Stütz und Achslasten nicht überschritten werden. Das Gewicht auf der Antriebsachse muss genügend sein.","Es müssen mindestens 2 Stück 2.5 Tonnen Spanngurten zur Befestigung verwendet werden und der Fahrer muss die Anhängerprüfung eingetragen haben."],"a":1,"t":"ladung"},{"n":107,"q":"Sie müssen mit dem Raupenbagger ein Winkelelement versetzen. Wie ist das korrekte und komplette Vorgehen?","o":["Ich verwende nur geprüfte Anschlagmittel und arbeite vorsichtig.","Ich entferne das Anbaugerät. Ich verwende nur geprüfte Anschlagmittel mit entsprechender Traglast. Instruiere das Hilfspersonal und halte stets Blickkontakt. Handzeichen müssen abgesprochen werden.","Ich instruiere das Hilfspersonal und vereinbare Handzeichen. Dann versetzen wir das Element vorsichtig."],"a":1,"t":"maschinen"},{"n":108,"q":"Der Temporäre Mitarbeiter hängt Ihnen die grosse 500 kg Vibroplatte an den Bagger an. Die Gurte ist allerdings so lang, dass sie die Vibroplatte kaum von Boden anheben können. Wie gehen Sie vor?","o":["Ich mache Ihn darauf aufmerksam und sage ihm er soll die Gurte einmal um den Löffel wickeln, um sie zu verkürzen. Danach hebe ich die Last.","Ich mache Ihn darauf aufmerksam und verwende eine kürzere Gurte. Danach hebe ich die Last.","Ich mache Ihn darauf aufmerksam und verwende eine kürzere Gurte und gebe ihm den Auftrag zu schauen, dass der Griff der Platte nicht am Löffel anschlägt."],"a":1,"t":"anschlag"},{"n":109,"q":"Worauf achten Sie, wenn Sie Lasten an der Baumaschine anschlagen?","o":["Die Baumaschine muss einen geprüften Anschlaghacken haben. Die Hebemittel müssen vor dem Anschlagen überprüft werden. Während dem Anschlagen ist der Sicherheitshebel auszulösen und Hände weg von den Bedienelementen! Das Personal muss instruiert sein.","Es müssen geeignete Anschlagmittel verwendet werden, sonst muss nichts beachtet werden.","Die Last muss nur sicher angehoben werden können, sonst muss nichts beachtet werden."],"a":0,"t":"anschlag"},{"n":110,"q":"Was wird bei einem 2-Takt-Motor angesaugt?","o":["Benzin-Öl-Luftgemisch","Benzin-Luftgemisch","Nur Luft"],"a":0,"t":"motor"},{"n":111,"q":"Was wird bei einem Dieselmotor angesaugt?","o":["Diesel-Luftgemisch","Luft","Diesel-Öl-Luftgemisch"],"a":1,"t":"motor"},{"n":112,"q":"An was erkennt man einen Dieselmotor?","o":["Motor ist grösser als ein Benzinmotor","Zündkerze und Zündkabel vorhanden","Metallene Einspritzleitungen"],"a":2,"t":"motor"},{"n":113,"q":"An was erkennt man einen 4-Takt-Benzinmotor?","o":["Ölwanne mit Messstab, Zündkerze und Zündkabel.","Metallene Einspritzleitungen.","Keine Ölwanne sichtbar."],"a":0,"t":"motor"},{"n":114,"q":"Bei einem Motor ist der Luftfilter stark verschmutzt, wie sehen die Abgase aus?","o":["Bläulicher Rauch","Schwarzer Rauch","Weisser Rauch"],"a":1,"t":"motor"},{"n":115,"q":"Wie funktioniert ein Turbolader, welche Aussage trifft zu?","o":["Die Abgase werden noch einmal durch den Motor gedrückt mit hoher Geschwindigkeit.","Mit der Abgasgeschwindigkeit wird die Ansaugluft beschleunigt, um mehr Leistung zu erzeugen.","Der Turbo erhöht die Motorendrehzahl auf über 50 000 Umdrehungen."],"a":1,"t":"motor"},{"n":116,"q":"Bei einem passiven Dieselpartikelfilter-System trifft folgende Aussage zu?","o":["Dieses Filtersystem eignet sich vorwiegend bei Maschinen, die im Dauereinsatz stehen, da das Ausbrennen fortlaufend erfolgt über die Abgastemperatur.","Dieses Filtersystem braucht fremde Hilfe. (Additiv, Zusatzheizung, Brennoffen)","Diese Filtersysteme eignen sich für kurze Einsätze der Maschine. (z.B. Radlader im Magazin.)"],"a":0,"t":"umwelt"},{"n":117,"q":"Bei einem modernen Bagger unterscheidet man unter welchen beiden Hydraulik-Kreisläufen?","o":["Linker- und Rechter-Kreislauf","Vorsteuer- und Haupt-Kreislauf","Bedienungs- und Arbeits-Kreislauf"],"a":1,"t":"hydraulik"},{"n":118,"q":"Wieviel Gewicht können Sie mit einer 1 Tonnen Rundschlinge auf diese Weise heben?","o":["1 Tonne.","2 Tonnen.","0.8 Tonnen."],"a":1,"note":"Im Original ohne Bild: gemeint ist die Rundschlinge im U-Gang (senkrecht, beide Enden am Haken).","t":"anschlag"},{"n":119,"q":"Beim Verdichten von Kies kommt es zu starken Staubemissionen. Was können Sie dagegen tun?","o":["Ich bringe Wasser aus und kann dadurch den Staub binden.","Ich lege einen Plastik über die staubige Schicht.","Ich stoppe mit Verdichten und baue das Werkstück fertig."],"a":0,"t":"umwelt"},{"n":120,"q":"Beim Ableiten von Baustellenabwasser trifft folgende Aussage zu?","o":["Wenn ich das Wasser in die Kanalisation leite und nicht in Bäche und Flüsse muss ich nichts beachten.","In kleinen Mengen kann ich Wasser jederzeit in die Kanalisation einleiten.","Verschmutztes Wasser mit Festteilen muss über ein Absetzbecken und anschliessend über ein Neutralisationsbecken geleitet werden, wenn der pH-Wert über 9.0 liegt."],"a":2,"t":"umwelt"},{"n":121,"q":"Welche Aussage trifft bei einem Ölunfall zu, bei dem 8-9 Liter biologisches Hydrauliköl ausgelaufen ist.?","o":["Bei Biologischem Hydrauliköl muss ich nichts unternehmen.","Ich muss erst ab 10 Liter und mehr der Polizei und der Abteilung für Umweltschutz Meldung erstatten.","Ich melde den Unfall sofort der Alarmstelle (Polizei/Feuerwehr)."],"a":2,"t":"umwelt"},{"n":122,"q":"Wie wird der Bodendruck eines Raupenbaggers berechnet?","o":["Einsatzgewicht multipliziert mal Raupenlänge.","Einsatzgewicht dividiert durch Auflagefläche der Raupen.","Einsatzgewicht dividiert durch Raupenlänge mal Raupenbreite."],"a":1,"t":"maschinen"},{"n":123,"q":"Beim Verladen eines Raupenbaggers auf einen Kippanhänger müssen die Stecknägel der Kipperbrücke wie folgt gesteckt werden?","o":["Beide hinten","Beide vorne","Über Kreuz"],"a":1,"t":"ladung"},{"n":124,"q":"Bei Verladerampen für einen Maschinenverlad trifft folgende Aussage zu?","o":["Die Rampen müssen aus Aluminium sein.","Tragkraft muss genügend sein, die Rampen müssen gesichert sein gegen Wegrutschen.","Tragkraft muss genügend sein und einen seitlichen Rand aufweisen."],"a":1,"t":"ladung"},{"n":125,"q":"Was trifft zu bei Zurrgurten?","o":["Zurrgurten müssen einen gesicherten Hacken mit Klinke haben.","Müssen alle 2 Jahre geprüft werden.","Vor jedem Einsatz überprüfe ich die Zurrmittel auf Schäden."],"a":2,"t":"ladung"},{"n":126,"q":"Sie haben bei den Zurrgurten zwei unterschiedliche Teile (Lang- und Kurzteil) dürfen Sie diese anwenden?","o":["Wenn beide Teile intakt sind, die Breite und die LC Werte übereinstimmen.","Wenn beide Teile intakt sind, die Breite und die Farbe übereinstimmt.","Wenn beide Teile intakt sind, die Breite und der sHF Wert übereinstimmt."],"a":0,"t":"ladung"},{"n":127,"q":"Sie müssen Aushubmaterial mit dem Raddumper im Hang transportieren und kippen. Wie gehen Sie korrekt vor?","o":["Ich kippe immer bergwärts und fahre nicht schräg in den Hang.","Ich kippe immer gegen unten, damit das Material gut rutscht.","Ich fahre vorsichtig schräg in den Hang und kippe das Aushubmaterial."],"a":0,"t":"maschinen"},{"n":128,"q":"Sie beladen ein Fahrzeug mit Kies. Wie gehen Sie vor, damit die Arbeiten sowohl sicher als auch rationell sind?","o":["Ich fahre mit Schwung in den Kieshaufen und hebe das Hubgerüst schon beim losfahren an.","Ich fülle die Schaufel mehr als sonst und versuche etwas schneller als sonst zu fahren.","Ich stelle das Fahrzeug so hin, dass ich keine grossen Wendemanöver machen muss."],"a":2,"t":"maschinen"},{"n":129,"q":"Sie müssen mit dem Radlader Kies grob planieren. Wie ist die Schaufelstellung und in welche Richtung fahren Sie?","o":["Vorwärts, Hubgerüst angehoben und Schaufel im 45° Winkel nach unten, so sehe ich am besten, wie ich planiere.","Vorwärts, Schaufel flach auf dem Boden.","Beim Rückwärtsfahren darf man die Schaufel nicht im 45° Winkel kippen, es schadet der Hydraulik."],"a":1,"t":"maschinen"},{"n":130,"q":"Sie verdichten mit einer Vibroplatte Kies. Wann ist die Verdichtung mit diesem Gerät erreicht?","o":["Immer nach 3-4 Durchgängen.","Wenn Wasser an die Oberfläche drückt.","Wenn die Vibroplatte zu «Hüpfen» beginnt."],"a":2,"t":"maschinen"},{"n":131,"q":"Eine statische Walze hat folgende Eigenschaften?","o":["Sie hat eine grosse Frequenz.","Sie drückt nur mit dem Eigengewicht.","Sie hat eine grosse Amplitude."],"a":1,"t":"maschinen"},{"n":132,"q":"Welche Arbeiten schaden einer Vibroplatte?","o":["Verdichten von Splitt und Schotter","Verdichten auf einem harten Betonboden.","Verdichten von lehmigem Aushubmaterial."],"a":1,"t":"maschinen"},{"n":133,"q":"Bei einem Raupenbagger müssen Sie den Greifer montieren. Die Hydraulikschläuche lassen sich nicht montieren, da Sie nicht entlastet sind. Wie gehen Sie vor?","o":["Ich klopfe die Kupplungen gegen einen sauberen Gegenstand, um zu entlasten.","Ich rufe den Mechaniker.","Ich löse eine Schlauchverschraubung, um zu entlasten."],"a":2,"t":"hydraulik"},{"n":134,"q":"Die 4 Hauptaufgaben des Schmieröles sind?","o":["Schmieren, Heizen, Abdichten, Übertragung von Kräften","Schmieren, Abdichten, Kühlen, Reinigen","Schmieren, Kühlen, Filtern, Reinigen"],"a":1,"t":"motor"},{"n":135,"q":"Bei den Motorenölen steht das W für?","o":["Winter","Wartung","Wiederverwendbar"],"a":0,"t":"motor"},{"n":136,"q":"Ein Mehrbereichsöl wird wie folgt bezeichnet?","o":["SAE 10","SAE 30 W","SAE 5W-30"],"a":2,"t":"motor"},{"n":137,"q":"Der Diesel-Wasserabscheider zeigt folgendes Bild: Der Rote Ring ist in der Mitte des Schauglases. Was ist zu tun?","o":["Es hat zu wenig Diesel, möglichst bald auftanken, spätestens am Abend.","Über dem Ring ist Kondenswasser, dieses ablassen, danach Zündung einschalten und Dieselkreislauf auffüllen.","Unter dem Ring ist Kondenswasser dieses ablassen, danach Zündung einschalten und Dieselkreislauf auffüllen."],"a":2,"t":"motor"},{"n":138,"q":"Die Luftfilterüberwachungs-Anzeige zeigt Rot. Was ist zu tun?","o":["Luftfilter reinigen, ev. ersetzen und Anzeigenüberwachung zurücksetzen.","Anzeigenüberwachung zurücksetzen.","Luftfilter inkl. der innere Sicherheits-Patrone ausbauen und weiterarbeiten."],"a":0,"t":"motor"},{"n":139,"q":"Was versteht man unter einer Mischschmierung?","o":["Das ist die Motorenschmierung bei einem Dieselmotor mit Turbolader","Das ist die Schmierung eines 2-Takt Motors","Das ist die Schmierung bei einem 4-Motor der gemischt in allen Lagen betrieben werden kann."],"a":1,"t":"motor"},{"n":140,"q":"Sie müssen die Starterbatterie ausbauen bei einer Baumaschine, welchen Pol lösen Sie zuerst?","o":["Plus Pol.","Batterietrennschalter ausschalten und danach zuerst den Plus Pol.","Minus Pol."],"a":2,"t":"motor"},{"n":141,"q":"Welche Aussage trifft zu bei einem Hydrodynamischen Fahrantrieb?","o":["Selbstbremsende Wirkung, Hohe Fahrgeschwindigkeiten möglich","Stufenlose Geschwindigkeit, max. Zugkraft schon bei niedrigem Drehzahlbereich","Keine selbstbremsende Wirkung, max. Zugkraft eher im oberen Drehzahlbereich"],"a":2,"t":"hydraulik"},{"n":142,"q":"Wieviel Treibstoff dürfen sie in der Baubaracke lagern und wie?","o":["Max. 100 Liter Diesel und 100 Liter Benzin mit Auffangwanne","Max. 450 Liter Benzin und Diesel gesamt, mit Auffangwanne","Max. 100 Liter Diesel und Benzin gesamt, mit Auffangwanne"],"a":0,"t":"umwelt"},{"n":143,"q":"Welche Baumaschinen mit Dieselmotor benötigen einen Partikelfilter, damit diese die Luftreinhalteverordnung einhalten können?","o":["Baumaschinen mit Dieselmotor ab Jahrgang 2008","Baumaschinen mit Dieselmotor und einer Leistung über 18 kW","Nur Baumaschinen mit Dieselmotor über 18 kW die für den Kanton arbeiten"],"a":1,"t":"umwelt"},{"n":144,"q":"Welche Führerschein-Kategorie benötigen Sie für das Führen eines Radladers mit blauem Nummernschild und einer Höchstgeschwindigkeit von 25 km/h?","o":["Kategorie G 40","Kategorie M","Kategorie F"],"a":2,"t":"strasse"},{"n":145,"q":"Dürfen Sie an einem Dumper mit blauem Nummernschild einen Sachentransportanhänger ziehen?","o":["Nur wenn im Ausweis des Dumpers die Anhängelast eingetragen ist und der Anhänger nicht schwerer als 750 kg ist.","Niemals","Nur wenn im Ausweis des Dumpers die Anhängelast eingetragen ist und der Anhänger dieses Gewicht nicht überschreitet."],"a":1,"t":"strasse"},{"n":146,"q":"Was versteht man unter einer temporären Baustelle?","o":["Die Baustelle ist nur solange die Behinderung vorhanden ist, mit Leitkegel und Triopan zu signalisieren.","Die Baustelle ist nur für 1 – 2 Tage zu signalisieren und wird danach wieder weggeräumt.","Die temporäre Baustellen Signalisation ist nur für Unterhaltsarbeiten entlang einer Strecke. Diese ist nicht immer am selben Ort und verschiebt sich während den Arbeiten. (s. Bsp. Mulchen von Böschungen)"],"a":0,"t":"sicherheit"},{"n":147,"q":"Sie arbeiten mit einem Raupenbagger. Wiev den, dass der Kies auch bei einer starken Bremsung nicht aus der Mulde fällt."],"a":2,"t":"maschinen"},{"n":225,"q":"Sie müssen mit einem 3.5 Tonnen Raupenbagger eine Rasenfläche überqueren. Was ist bezüglich des Bodenschutzes zu beachten?","o":["Durch die Raupen wird die Last gleichmässig verteilt. Ich muss keine weiteren Massnahmen vornehmen.","Den Rasen mit einer Plastikfolie abdecken, so bleibt der Rasen sauber.","Ich lege Bodenschutzmatten oder stabile Bretter aus, und verteile die Last auf eine grössere Fläche."],"a":2,"t":"umwelt"},{"n":226,"q":"Was ist zu beachten, wenn Sie zähflüssigen Beton mit dem Raupendumper auf der Baustelle transportieren?","o":["Beton kann wie loses Kies transportiert werden.","Durch das Fahren verdichtet sich der Beton stark und bleibt beim Kippen in der Mulde kleben. Der Schwerpunkt verlagert sich und es besteht Kippgefahr. Vorsichtig und langsam abkippen.","Möglichst schnell abkippen, damit der Beton schnell aus der Mulde gleitet."],"a":1,"t":"maschinen"},{"n":227,"q":"Welche Aussagen sind in Bezug auf Walzen richtig?","o":["Mit Walzen kann in starkem Gefälle verdichtet werden.","Man unterscheidet zwischen dynamischer Verdichtung (Verdichtung durch Bewegung) und statischer Verdichtung (Verdichtung durch Gewicht).","Eine Grabenwalze eignet sich gut zum Einbau von Asphaltbelägen."],"a":1,"t":"maschinen"},{"n":228,"q":"Eine Starterbatterie hat pro Zelle ca. 2 Volt. Wie viele Zellen hat eine 12 Volt Batterie?","o":["8 Volt","6Volt","12 Volt"],"a":1,"t":"motor"},{"n":229,"q":"Was gehört beim Umgang mit Batterieflüssigkeit zwingend zur 1. Hilfe-Ausrüstung?","o":["Defibrilator","1. Hilfe Koffer","Augenspülung"],"a":2,"t":"motor"},{"n":230,"q":"Ausnahmefahrzeuge im Strassenverkehr besitzen folgendes Nummernschild:","o":["blau","gelb","braun"],"a":2,"t":"strasse"},{"n":231,"q":"Wie lautet die Notfallnummer der Ambulanz?","o":["145","144","117"],"a":1,"t":"sicherheit"},{"n":232,"q":"Was gehört nicht zum Umweltschutz auf der Baustelle?","o":["Bodenschutz","Personenschutz","Gewässerschutz"],"a":1,"t":"umwelt"},{"n":233,"q":"Welche Aussage trifft zu? Die Einspritzpumpe…","o":["…ist zuständig für die Scheibenwaschanlage.","…fördert Diesel vom Tank zur Regelpumpe.","…regelt die Einspritzmenge des Diesels."],"a":2,"t":"motor"},{"n":234,"q":"Darf eine Ladung zuhinterst auf dem Anhänger platziert werden?","o":["Ja, dann kann ich das leichte Material vorne laden.","Nur dann, wenn die Stützlast und die Achslast nicht unterschritten bzw. überschritten wird.","Ladungsverteilung spielt keine Rolle, solange die Nutzlast eingehalten wird."],"a":1,"t":"ladung"},{"n":235,"q":"Welche Aussage trifft zu? Der Batterietrennschalter…","o":["…liefert konstant Strom an die Scheinwerfer und Blinker.","…unterbricht den Stromkreislauf zur Starterbatterie.","…beschleunigt das Starten des Motors über das Zündschloss."],"a":1,"t":"motor"},{"n":236,"q":"Welche Aussage trifft zu? Die Zündkerze…","o":["…ist zuständig für die Zündung beim Dieselmotor.","…ist zuständig für die Zündung beim Benzinmotor.","…ist zuständig beim Vorglühen beim Dieselmotor."],"a":1,"t":"motor"},{"n":237,"q":"Welche Aussage trifft zu? Mit dem Refraktometer kann man…","o":["…den Einspritzdruck überprüfen.","…wird der Zustand des Aditiv bestimmt.","…die Frostbeständigkeit des Wasser- Frostschutzgemisch prüfen."],"a":2,"t":"motor"},{"n":238,"q":"Welche Aussage trifft zu? Unter Viskosität bezeichnet man…","o":["…die Fliesseigenschaft von Motorenölen","…die Wintertauglichkeit von Motorenölen","…den Verschmutzungsgrad von Motorenölen"],"a":0,"t":"motor"},{"n":239,"q":"Welche Aussage trifft zu? Neigungswinkel von Anschlagmittel…","o":["…haben keinen Einfluss auf die Tragfähigkeit","…über 60° sind nicht erlaubt","…über 45° sind nicht erlaubt"],"a":1,"t":"anschlag"},{"n":240,"q":"Welche Aussage trifft zu? Wenn Sie beim Raupenbagger die Fahrhebel nach vorne drücken…","o":["…fährt der Bagger in Richtung Hubarm","…fährt der Bagger in Richtung Leitrad","…fährt der Bagger in Richtung Antriebsrad"],"a":1,"t":"maschinen"},{"n":241,"q":"Bei einem Motor ist der Wasserabscheider voll. Er läuft aber noch. Wie sieht die Rauchfarbe der Abgase in den meisten Fällen aus?","o":["Bläulicher Rauch","Schwarzer Rauch","Weisser Rauch"],"a":2,"t":"motor"},{"n":242,"q":"Die Baumaschine hat einen hydrostatischen Fahrantrieb. Welche Aussage trifft zu?","o":["Hohe Fahrgeschwindigkeiten nicht möglich, keine selbstbremsende Wirkung.","Stufenlose Geschwindigkeit, max. Zugkraft schon bei niedrigem Drehzahlbereich.","Selbstbremsende Wirkung, max. Zugkraft eher im oberen Drehzahlbereich."],"a":1,"t":"hydraulik"},{"n":243,"q":"Was ist bei der Deichsellast bei einem 3,5 Tonnen Anhänger zu beachten?","o":["Sie darf nicht mehr als die Stützlast des Zugfahrzeuges betragen.","Sie darf max. 120 kg betragen.","20 % der Anhängelast des Zugfahrzeuges dürfen nicht überschritten werden."],"a":0,"t":"ladung"},{"n":244,"q":"Welche Wirkung hat der Fehlstromschutzschalter (FI)","o":["Er schützt die Batterie, bei grossen Maschinen (z. Bsp. Nasssteinfräse).","Er schützt die Person vor Stromschlägen.","Er schützt die Maschine vor Unterlast."],"a":1,"t":"motor"},{"n":245,"q":"Sie müssen einen Raupenbagger direkt nach einem ein stündigen Einsatz waschen. Was ist zu beachten?","o":["Ich spritze den ganzen Bagger inkl. Motorenbereich ab und lasse ihn trocknen.","Ich verwende warmes Wasser damit sich der Schmutz besser löst, und schmiere den Raupenbagger danach gemäss Schmierplan.","Ich lasse den Motor unter Volllast laufen und wasche den Bagger gemäss Bedienungsanleitung."],"a":1,"t":"maschinen"},{"n":246,"q":"Beim Schmieren eines Raupenbaggers, gehe ich folgender Massen vor?","o":["Schmiernippel reinigen, schmieren 2- 3 Stösse, Nippel nochmal reinigen.","Ich schmiere, bis es beim Bolzen herausdrückt.","1-2 Stösse reichen, und dies 1 Mal in der Woche."],"a":0,"t":"maschinen"},{"n":247,"q":"Treibstoff muss wie folgt gekennzeichnet sein","o":["Gebinde unter 5 Liter, gar nicht.","Mit Farbe, die dem Treibstoff entspricht, damit es keine Verwechslungen gibt.","Mit den Symbolen, Endzündbare Flüssigkeit und Umweltgefährdend sowie der Kennzeichnung des Inhalts."],"a":2,"t":"motor"},{"n":248,"q":"Ein 4-er Gehänge darf pro Strang 1 Tonne heben. Wieviel darf man heben bei einem Neigungswinkel von 0°?","o":["4 Tonnen","2 Tonnen","1 Tonne"],"a":1,"t":"anschlag"},{"n":249,"q":"Welche Kräfte wirken bei einem Maschinentransport in Fahrtrichtung?","o":["100 % des Maschinengewichtes","50 % des Maschinengewichtes","80 % des Maschinengewichtes"],"a":2,"t":"ladung"},{"n":250,"q":"Bei der Inbetriebnahme eines Raddumpers müssen Sie…","o":["…zwingend einen Ausweis der Kat. F besitzen.","…einen Bremstest durchführen und ich brauche den Baugeräteführerkurs.","…die Mulde sichern gegen das Drehen."],"a":1,"t":"maschinen"},{"n":251,"q":"Bei der statischen Verdichtung…","o":["…bleibt die Vibrationsplatte an der gleichen Stelle.","…wird mit dem Eigengewicht der Maschine verdichtet.","…wird durch Vibration verdichtet."],"a":1,"t":"maschinen"},{"n":252,"q":"Mit einer hohen Frequenz und kleiner Amplitude…","o":["…kann ich bindige Böden verdichten.","…arbeitet der Grabenstampfer.","…verdichte ich mit Vibrationsplatten."],"a":2,"t":"maschinen"},{"n":253,"q":"Mit einer grossen Amplitude…","o":["…arbeitet der Grabenstampfer.","…bewirkt man ein ebenes Planum.","…arbeiten alle Vibrationsplatten bis ca. 100 kg."],"a":0,"t":"maschinen"},{"n":254,"q":"Die Maschine besitzt eine Zündkerze und einen Oelmessstab für das Motorenöl. Welchen Treibstoff tanken Sie?","o":["Ich tanke mit Diesel.","Ich tanke mit 2-Takt Gerätebenzin.","Ich tanke mit Bleifreibenzin."],"a":2,"t":"motor"},{"n":255,"q":"Welchen Zweck hat die Sicherung bei elektrischen Anlagen?","o":["Personenschutz","Schutz des FI-Schalters","Schutz vor Überlast der Anlage"],"a":2,"t":"motor"},{"n":256,"q":"Wie lautet die Notrufnummer der Feuerwehr?","o":["117","118","145"],"a":1,"t":"sicherheit"},{"n":257,"q":"Wie nahe darf mit einem Bagger mit einem Maschinengewicht bis 12 Tonnen an einer Böschungskante gearbeitet werden?","o":["bis max. 50 cm, wenn der Untergrund dies zulässt.","bis max. 2 m, wenn der Untergrund dies zulässt.","bis max. 1 m, wenn der Untergrund dies zulässt."],"a":2,"t":"maschinen"},{"n":258,"q":"Welche Vorkehrungen treffen Sie bezüglich Arbeitssicherheit, wenn Sie einen 13 m tiefen Graben ausheben müssen?","o":["Es ist nichts Weiteres zu beachten.","Ich stelle den Bagger beim Verlassen der Baustelle über den Graben, damit niemand reinfällt.","Bevor Personen in einen Graben steigen, muss zwingend eine Grabenspriessung erstellt werden."],"a":2,"t":"sicherheit"},{"n":259,"q":"Wie nennt man die Zylinder bei einem Bagger an der Ausrüstung?","o":["Armzylinder, Stielzylinder, Löffelstielzylinder","Hubzylinder, Löffelzylinder, Stielzylinder","Hubarmzylinder, Löffelstielzylinder, Löffelzylinder"],"a":1,"t":"hydraulik"},{"n":260,"q":"Wo befindet sich bei einem Raupenbagger die Drehdurchführung?","o":["innerhalb des Drehkranzes","beim Powertilt","beim Schweinsupport"],"a":0,"t":"hydraulik"},{"n":261,"q":"Welche Höchstgeschwindigkeit darf ein Fahrzeug gemäss Fahrzeugausweis max. erreichen, damit es mit der Führerschein Kategorie F gefahren werden darf?","o":["max. 30 km/h","keine Beschränkung","max. 45 km/h"],"a":2,"t":"strasse"},{"n":262,"q":"Auf was müssen Sie achten, wenn Sie eine akkubetriebene Baumaschine zum Aufladen der Batterie an eine Kabeltrommel anschliessen?","o":["Ich darf die Batterie nicht an einer Kabelrolle aufladen.","Die Kabeltrommel muss ganz abgerollt werden.","Der Stromverteiler darf nicht durch eine Sicherung geschützt sein."],"a":1,"t":"motor"},{"n":263,"q":"Welche Aussage ist richtig: Mit der Ausbildung Baugeräteführer und dem Ausweis Kat. F…","o":["…darf ich nur auf abgesperrtem Gelände fahren.","…darf ich Gegengewichtsstapler bis 20 km/h fahren.","…darf ich keinen Gegengewichtsstapler fahren, dazu braucht es eine separate Ausbildung."],"a":2,"t":"strasse"},{"n":264,"q":"Welche Aussage ist richtig: Eine Baumaschine die breiter als 2.50 m ist und auf der Strasse fahren darf, benötigt…","o":["…ein weisses Kontrollschild.","…ein blaues Kontrollschild.","…ein braunes Kontrollschild."],"a":2,"t":"strasse"},{"n":265,"q":"Welche Vorschrift gilt bei einem Arbeitseinsatz entlang einer öffentlich befahrenen Strasse?","o":["Warnbekleidung und Signalisation gemäss Vorschriften müssen eingehalten werden.","Die Baustellensicherung, Signalisation und Blinklampen dürfen nur durch die Polizei aufgestellt werden.","Da es eine öffentliche Strasse ist reicht eine Absperrung mit Pilonen."],"a":0,"t":"strasse"},{"n":266,"q":"Wen kontaktieren Sie, wenn Sie unsicher sind beim Signalisieren einer Baustelle im öffentlichen Verkehr?","o":["Ich kann die Baustelle selbst signalisieren.","Ich beauftrage meine Mitarbeiter mit der Aufgabe.","Ich kontaktiere die örtlichen Behörden, z.B. die nächste Polizeistelle, aber nicht über den Notruf 117."],"a":2,"t":"strasse"},{"n":267,"q":"Auf was achten Sie, bei der Ausrichtung der Absperrlatten?","o":["Bei einer Eckausbildung schaue ich darauf, dass ein rotes und ein weisses Ende der Latten zusammenkommen.","Bei einer Eckausbildung schaue ich darauf, dass zwei weisse Enden der Latten zusammenkommen und die Reflektoren nach aussen schauen.","Absperrungen dürfen nur durch die öffentliche Behörde erstellt werden."],"a":1,"t":"strasse"},{"n":268,"q":"Wie befahren sie mit einem beladenen Radlader eine steile Steigung?","o":["Vorwärts","Dies spielt keine Rolle.","Rückwärts"],"a":0,"t":"maschinen"},{"n":269,"q":"Ihr Bagger verfügt über keinen Lasthacken. Dürfen Sie Lasten heben?","o":["Ich darf keine Lasten heben.","Die Last muss am Kübel befestigt werden.","Die Last muss so am Bagger angeschlagen werden, dass diese nicht abrutschen kann."],"a":0,"t":"anschlag"},{"n":270,"q":"Beim Bagger ist der Diesel ausgegangen, wie gehen Sie vor?","o":["Auftanken, starten und weiterarbeiten.","Auftanken, Zündung einschalten und ca. 1 Minute warten, starten, wenn dies nicht funktioniert, entlüften gemäss Handbuch.","Den Mechaniker bestellen."],"a":1,"t":"motor"},{"n":271,"q":"Was ist wichtig beim Anbringen von Antirutschmatten?","o":["Die raue Seite muss immer oben sein.","Die Ladung darf nur zur Hälfte darauf stehen.","Der Untergrund muss sauber sein, und die Ladung muss vollflächig darauf platziert werden."],"a":2,"t":"ladung"},{"n":272,"q":"Wie steigen Sie auf eine Baumaschine auf und ab?","o":["Möglichst schnell damit keine Zeit verloren geht.","Ich schaue auf einen sichern Stand und schaue, dass immer 3 Punkte an den Halte- und Aufstiegsvorrichtungen Kontakt haben.","Ich steige immer vorwärts ein und aus."],"a":1,"t":"sicherheit"},{"n":273,"q":"Sie beladen ein Fahrzeug für einen Transport ins Magazin","o":["Die Ladung darf die Seitenläden in der Breite nicht überschreiten.","Die Ladung darf max. 3m nach hinten ragen, ab Mitte Hinterachse.","Die Ladung darf nicht mehr als bis Mitte Steuerrad nach vorne ragen."],"a":0,"t":"ladung"},{"n":274,"q":"Was muss abgeklärt werden, bevor Sie mit einer Baumaschine eine Grünfläche auf einer Tiefgarage befahren?","o":["Wie die Tiefgarage abgedichtet ist.","Die Belastungsmöglichkeit der Tiefgarage und deren Aufbau.","Wie viele Autos darunter parkiert sind."],"a":1,"t":"umwelt"},{"n":275,"q":"Sie wollen sich auf der Baumaschine angurten, jedoch funktioniert der Gurtstraffer nicht mehr. Was tun Sie?","o":["Ohne mich anzugurten fange ich mit den Arbeiten an.","Ich muss den Bagger nur umstellen und brauche dafür keine Gurte.","Ohne Sicherheitsgurten darf die Maschine nicht in Betrieb genommen werden, der Mangel muss zuerst durch eine Fachkraft behoben werden."],"a":2,"t":"sicherheit"},{"n":276,"q":"Es regnet und Sie sichern ihre Baustelle innerorts mit Triopanen ab?","o":["Ich darf keine Baustelle absichern mit Triopanen.","Die Triopane müssen reflektierend sein und 90 cm Seitenlänge haben.","Die Triopane werden min. 50 m vor der Baustelle aufgestellt."],"a":1,"t":"strasse"},{"n":277,"q":"Dürfen Sie mit einer Baumaschine ins Wasser fahren?","o":["Genaue Angaben darüber entnehme ich in der Bedienungsanleitung. Zudem ist für Arbeiten in einem Gewässer eine Bewilligung nötig.","Ich kann immer im Wasser arbeiten.","Solange ich eine Schwimmweste trage, darf ich mit Baumaschinen im Wasser arbeiten."],"a":0,"t":"umwelt"},{"n":278,"q":"Benötigen Sie für einen Treibstofftransport von 650 Liter Diesel ein Begleitpapier?","o":["Nur bei gefüllten Baustellentanks.","Da der Transport in die Freigrenze fällt, benötige ich kein Begleitpapier.","Ja, auch bei leeren Baustellentanks."],"a":2,"t":"umwelt"},{"n":279,"q":"Sie müssen den Löffel des 8 Tonnen Baggers verladen. Auf was ist zu achten?","o":["Ein Zurrgurt genügt.","Wenn ich den Löffel in den Kies auf der Ladefläche lege, muss ich ihn nicht sichern.","Auf die Lastverteilung, die Nutzlast und eine genügende Verzurrung. Auch müssen unförmige Ladungen unterlegt und stabilisiert werden."],"a":2,"t":"ladung"},{"n":280,"q":"Sie müssen einen steilen Hang hochfahren mit dem Raupenbagger ohne Schild. Was ist zu beachten?","o":["Die Ausrüstung muss in Fahrtrichtung zeigen.","Die Ausrüstung muss Hang abwärts zeigen.","Nichts, einfach sehr vorsichtig fahren."],"a":0,"t":"maschinen"},{"n":281,"q":"Ein Arbeiter hat die praktische Prüfung beim Baugeräteführerkurs nicht bestanden. Was ist zu beachten?","o":["Er darf keine Baumaschinen führen.","Er bekommt eine befristete Lernfahrbestätigung mit der er unter Aufsicht in abgesperrtem Gelände Baumaschinen führen darf. Der Kurs muss wiederholt werden.","Nur die theoretische Prüfung muss nochmals wiederholt werden."],"a":1,"t":"sicherheit"},{"n":282,"q":"Ein Arbeiter kommt bei Ihnen, mit dem Dumper, Material abholen. Sie beladen den Dumper mit dem Bagger. Auf was achten Sie?","o":["Ich belade den Dumper mit möglichst viel Material, damit es weniger Fahrten braucht.","Ich belade erst wenn der Fahrer abgestiegen ist.","Für das überladen ist nur der Fahrer des Dumpers verantwortlich."],"a":1,"t":"maschinen"},{"n":283,"q":"Wo müssen die Handbücher der Baumaschinen gelagert werden?","o":["Im Büro des Betriebsinhabers, damit er diese bei einem Verkauf der Maschine mitgeben kann.","Im Magazin, so dass diese nicht verschmutzen.","Auf der Baumaschine oder an einem zugänglichen Ort für jeden Maschinisten."],"a":2,"t":"sicherheit"},{"n":284,"q":"Welches Mindestalter ist erforderlich für die Absolvierung der Führerprüfung Kat. F?","o":["14 Jahre","16 Jahre","18 Jahre"],"a":1,"t":"strasse"},{"n":285,"q":"Sie besitzen die Führerprüfung Kat. B. Welch folgende Aussage ist also richtig?","o":["Die Kat. F ist darin enthalten.","Ich darf keine Baumaschinen lenken.","Ich darf alle Baumaschinen lenken."],"a":0,"t":"strasse"},{"n":286,"q":"Sie haben einen Bauhelm mit Gehörschutz?","o":["Dieser ist nicht zugelassen für Baumaschinen.","Hat eine beschränkte Zulassungszeit und muss nach Ablauf ersetzt werden.","Darf eingesetzt werden, Bauhelme ohne Gehörschutz sind nicht erlaubt."],"a":1,"t":"sicherheit"},{"n":287,"q":"Dürfen Sie Arbeiten mit Baumaschinen alleine ausführen?","o":["Ja, dann gefährde ich niemanden.","Ja, sofern ich die Baugeräteführerausbildung habe.","Nein, Arbeiten mit besonderen Gefahren dürfen nie alleine ausgeführt werden."],"a":2,"t":"sicherheit"},{"n":288,"q":"Die Batterie des Raddumpers ist entladen. Wie gehen Sie vor beim Überbrücken?","o":["Ich muss nur die zwei Überbrückungskabel anschliessen. Die Reihenfolge spielt keine Rolle.","1. Pluspol vom Helferfahrzeug zum Pluspol Pannenfahrzeug. 2. Minuspol vom Helferfahrzeug zum Minuspol Pannenfahrzeug.","1. Minuspol vom Helferfahrzeug zum Minuspol Pannenfahrzeug. 2. Pluspol vom Helferfahrzeug zum Pluspol Pannenfahrzeug."],"a":1,"t":"motor"},{"n":289,"q":"Welche Aussage trifft zu, bei Verdichtungsarbeiten?","o":["Sobald das Wasser an die Oberfläche drückt, ist genügend verdichtet.","Die Verdichtung ist wirklich erst dann genügend, wenn der Grabenstampfer keine Spuren mehr hinterlässt.","Kies ist in Schichten zu verdichten."],"a":2,"t":"maschinen"},{"n":290,"q":"Sie nehmen mit dem Radlader und der Gabel eine Last auf. Welche Aussage trifft zu?","o":["Der Fahrer ist verantwortlich, dass die zulässige Belastung der Maschine nicht überschritten wird.","Paletten dürfen nur quer aufgenommen werden.","Sie müssen immer eine Hilfsperson beiziehen."],"a":0,"t":"maschinen"},{"n":291,"q":"Was versteht man im Datenblatt zu einem Radlader unter Kipplast?","o":["Ist die Last, die er aufnehmen kann, bis er seitlich im Hang kippt.","Ist die Nutzlast, die er Transportieren kann.","Ist die Last über die Vorderachse, bis er im statisch ungünstigsten Fall nach vorne kippt."],"a":2,"t":"maschinen"},{"n":292,"q":"Was versteht man im Datenblatt zu einem Radlader unter Nennlast?","o":["Ist 50% der Kipplast.","Ist die Last, die zugeladen ist, wenn man Material auf der Strasse transportiert, vorausgesetzt er ist mit blauen Nummernschildern eingelöst.","Ist das Gesamtgewicht der Maschine."],"a":0,"t":"maschinen"},{"n":293,"q":"Auf was müssen Sie achten, beim Baggerverlad auf einen Anhänger?","o":["Auf die Lastverteilung, damit das Leergewicht des Zugfahrzeuges nicht überschritten wird.","Auf die Lastverteilung, damit die Stütz- und Deichsellast nicht überschritten wird.","Auf die Lastverteilung, damit die Zuglast nicht überschritten wird."],"a":1,"t":"ladung"},{"n":294,"q":"Sie müssen eine Palette mit Verbundsteinen Transportieren, welche Aussage trifft zu?","o":["Es genügt eine Sicherung mit einem Abdecknetz.","Es genügt eine Sicherung mit einem Abdecknetz, wenn ich die Palette ganz an die Stirnwand stelle.","Die Ladung muss ausreichend gesichert werden, so dass sie auf keinen Fall verrutschen kann."],"a":2,"t":"maschinen"},{"n":295,"q":"Was versteht man unter einem hydraulischen Schnellwechsler?","o":["Ist ein System, um die Anbaugeräte von der Fahrerkabine aus zu Entfernen und zu Montieren.","Kommt nur bei Hydraulikbaggern vor.","Ist der Teil beim Bagger
