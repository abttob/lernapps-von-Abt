n und mache danach eine korrekte Inbetriebnahme.","Bevor ich mit den Arbeiten beginne, checke ich die Maschine auf allfällige Mängel. Da diese zu Lasten des Vermieters gehen, kann ich ohne weiteres mit den Arbeiten starten."],"a":1,"t":"sicherheit"}]};
const Q = D.q, T = D.topics;
const ICON = {sicherheit:'🦺',maschinen:'🚜',motor:'⚙️',hydraulik:'🛢️',ladung:'🚚',anschlag:'🪝',strasse:'🚦',umwelt:'🌱',pikto:'⚠️'};
const KEY = 'bgf-eba2-v1';
let P = {};        // Fortschritt: n -> {s:gesehen, c:richtig in Folge, r:richtig total, w:falsch total, l:letzte Antwort richtig 1/0}
let S = {len:10, big:false};
try{ const raw = JSON.parse(localStorage.getItem(KEY)||'{}'); P = raw.P||{}; S = Object.assign(S, raw.S||{}); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({P,S})); }catch(e){} }

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const isMastered = n => (P[n]&&P[n].c>=2);
const isWrong = n => (P[n]&&P[n].l===0);
const mastered = list => list.filter(q=>isMastered(q.n)).length;
const wrongList = () => Q.filter(q=>isWrong(q.n));

function applyFont(){ document.body.classList.toggle('big', !!S.big); }
$('#fontBtn').onclick = () => { S.big=!S.big; save(); applyFont(); };
applyFont();

function updHdr(){ $('#hdrStat').textContent = '⭐ ' + mastered(Q) + ' / ' + Q.length; }

/* ---------- Vorlesen ---------- */
const canSpeak = 'speechSynthesis' in window;
function speak(text){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v=>/de[-_]CH/i.test(v.lang)) || vs.find(v=>/^de/i.test(v.lang));
    if(v) u.voice = v;
    u.lang = v ? v.lang : 'de-DE';
    u.rate = 0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ if(canSpeak) try{speechSynthesis.cancel();}catch(e){} }

/* ---------- Bild gross ---------- */
function zoom(src){
  const z = document.createElement('div'); z.className='zoom';
  z.innerHTML = '<img alt="Bild gross" src="'+src+'">';
  z.onclick = () => z.remove();
  document.body.appendChild(z);
}

/* ---------- Startseite ---------- */
function home(){
  stopSpeak(); updHdr(); window.scrollTo(0,0);
  const m = mastered(Q), seen = Q.filter(q=>P[q.n]).length, w = wrongList().length;
  const pct = Math.round(m/Q.length*100);
  let h = `
  <section class="hero">
    <h1>Baugeräteführer – Theorie</h1>
    <p>300 Prüfungsfragen zum Üben. Eine Frage gilt als <b>gelernt ⭐</b>, wenn du sie 2-mal hintereinander richtig beantwortest.</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="stats">
      <div class="stat"><b>${m}</b><small>gelernt ⭐</small></div>
      <div class="stat"><b>${seen}</b><small>schon gesehen</small></div>
      <div class="stat"><b>${w}</b><small>noch falsch</small></div>
    </div>
  </section>

  <div class="card">
    <b>Wie viele Fragen pro Runde?</b>
    <div class="seg" id="lenSeg">${[10,20,30].map(n=>`<button data-l="${n}" class="${S.len===n?'on':''}">${n}</button>`).join('')}</div>
    <button class="btn primary" id="goMix">▶︎ Los geht's – gemischte Fragen</button>
    <button class="btn" id="goWrong" ${w?'':'disabled'}><span class="ic">🔁</span><span class="tx"><b>Fehler wiederholen</b><small>${w?w+' Fragen, die du zuletzt falsch hattest':'Noch keine Fehler – super!'}</small></span></button>
    <button class="btn" id="goExam"><span class="ic">📝</span><span class="tx"><b>Prüfung üben</b><small>30 Zufallsfragen, die Auflösung kommt erst am Schluss</small></span></button>
    <button class="btn" id="goLook"><span class="ic">🔎</span><span class="tx"><b>Nachschlagen</b><small>Alle Fragen mit der richtigen Antwort, mit Suche</small></span></button>
  </div>

  <h2>Nach Thema üben</h2>
  <div class="tiles">${Object.keys(T).map(k=>{
      const list = Q.filter(q=>q.t===k), mm = mastered(list);
      return `<button class="tile" data-t="${k}"><span class="ic">${ICON[k]}</span><b>${T[k]}</b><small>${mm} von ${list.length} gelernt</small><div class="bar"><div style="width:${Math.round(mm/list.length*100)}%"></div></div></button>`;
    }).join('')}
  </div>

  <h2>Einstellungen</h2>
  <div class="card">
    <p class="small" style="margin-top:0">Dein Fortschritt wird nur auf diesem Gerät gespeichert.</p>
    <button class="btn center" id="reset">🗑️ Fortschritt löschen</button>
  </div>
  <p class="small center">Fragenkatalog Baugeräteführer (JardinSuisse) · Lernapp für EBA 2. Lehrjahr</p>`;
  app.innerHTML = h;
  app.querySelectorAll('#lenSeg button').forEach(b=>b.onclick=()=>{S.len=+b.dataset.l;save();home();});
  $('#goMix').onclick = () => start('learn', pick(Q, S.len), 'Gemischt');
  $('#goWrong').onclick = () => start('fehler', shuffle(wrongList()).slice(0,S.len), 'Fehler wiederholen');
  $('#goExam').onclick = () => start('exam', shuffle(Q).slice(0,30), 'Prüfung');
  $('#goLook').onclick = () => lookup();
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const k=b.dataset.t; start('learn', pick(Q.filter(q=>q.t===k), S.len), T[k]);});
  const r = $('#reset'); let armed=false;
  r.onclick = () => { if(!armed){armed=true;r.textContent='Wirklich alles löschen? Nochmals tippen';r.style.borderColor='var(--no)';setTimeout(()=>{if(armed){armed=false;r.textContent='🗑️ Fortschritt löschen';r.style.borderColor='';}},4000);} else {P={};save();home();} };
}

/* Fragen auswählen: zuerst neue und falsche, gelernte zuletzt */
function pick(pool, k){
  const score = q => { const p=P[q.n]; if(!p) return 0; if(p.l===0) return 0.5; if(isMastered(q.n)) return 3; return 1.5; };
  return shuffle(pool).map(q=>({q,s:score(q)+Math.random()*0.9})).sort((a,b)=>a.s-b.s).slice(0,k).map(x=>x.q);
}

/* ---------- Runde ---------- */
let R = null;
function start(mode, list, label){
  if(!list.length) return;
  R = {mode, label, list, i:0, res:[], streak:0, done:false, t0:Date.now()};
  R.orders = list.map(()=>shuffle([0,1,2]));
  show();
}

function record(q, ok){
  const p = P[q.n] || (P[q.n]={s:0,c:0,r:0,w:0,l:1});
  p.s++; if(ok){p.r++;p.c++;p.l=1;} else {p.w++;p.c=0;p.l=0;}
  save();
}

function show(){
  stopSpeak(); updHdr(); window.scrollTo(0,0);
  const q = R.list[R.i], ord = R.orders[R.i], exam = R.mode==='exam';
  const pct = Math.round(R.i/R.list.length*100);
  let h = `
  <div class="qmeta"><span>Frage <b>${R.i+1}</b> von ${R.list.length}</span><span class="tag">${ICON[q.t]} ${T[q.t]}</span></div>
  <div class="bar" style="margin-bottom:12px"><div style="width:${pct}%"></div></div>
  <div class="card pop">
    <div class="tools">
      ${canSpeak?'<button class="tbtn" id="say">🔊 Vorlesen</button>':''}
      <span style="flex:1"></span>
      ${!exam&&R.streak>=3?`<span class="streak">🔥 ${R.streak} richtig in Folge</span>`:''}
    </div>
    <div class="small">Nr. ${q.n}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.img?`<img class="qimg" src="${q.img}" alt="Bild zur Frage ${q.n}" id="qimg">`:''}
    ${q.note?`<div class="note">ℹ️ ${esc(q.note)}</div>`:''}
    <div id="opts">${ord.map((oi,k)=>`<button class="btn opt" data-oi="${oi}"><span class="lt">${'ABC'[k]}</span><span class="tx">${esc(q.o[oi])}</span></button>`).join('')}</div>
    <div id="after"></div>
  </div>
  <button class="btn center" id="quit" style="border:0;background:none;color:var(--muted)">Runde abbrechen</button>`;
  app.innerHTML = h;
  if(q.img) $('#qimg').onclick = () => zoom(q.img);
  if(canSpeak) $('#say').onclick = () => speak(q.q + '. ' + ord.map((oi,k)=>'ABC'[k]+': '+q.o[oi]).join('. '));
  $('#quit').onclick = () => { R.res.length ? result() : home(); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
}

function answer(oi){
  const q = R.list[R.i]; if(R.res.length>R.i) return;
  const ok = oi===q.a, exam = R.mode==='exam';
  R.res.push({q, oi, ok}); record(q, ok);
  R.streak = ok ? R.streak+1 : 0;
  app.querySelectorAll('.opt').forEach(b=>{
    const v=+b.dataset.oi; b.disabled=true; b.style.opacity=1;
    if(exam){ if(v===oi) b.classList.add('pick'); }
    else { if(v===q.a) b.classList.add('ok'); else if(v===oi) b.classList.add('no'); }
  });
  const last = R.i===R.list.length-1;
  let fb = '';
  if(!exam){
    const praise = ['Richtig! 👍','Genau! 💪','Super! 🎉','Stimmt! ✅','Bravo! 👏'];
    fb = ok ? `<div class="fb ok">${praise[Math.floor(Math.random()*praise.length)]}${isMastered(q.n)?' Diese Frage ist jetzt gelernt ⭐':''}</div>`
            : `<div class="fb no">Leider falsch. Richtig ist die grüne Antwort. Lies sie nochmals gut durch.</div>`;
  }
  $('#after').innerHTML = fb + `<button class="btn dark" id="next">${last?'Zum Resultat':'Weiter ➜'}</button>`;
  $('#next').onclick = () => { if(last) result(); else { R.i++; show(); } };
  $('#next').focus({preventScroll:true});
  if(!exam && !ok) $('#after').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- Resultat ---------- */
function result(){
  stopSpeak(); updHdr(); window.scrollTo(0,0);
  const n = R.res.length, r = R.res.filter(x=>x.ok).length, pct = n?Math.round(r/n*100):0;
  const wrong = R.res.filter(x=>!x.ok);
  const msg = pct===100?'Perfekt! Alles richtig! 🏆':pct>=80?'Sehr gut gemacht! 💪':pct>=60?'Gut! Mit etwas Übung schaffst du es. 👍':'Nicht aufgeben! Wiederhole die Fehler. 🔁';
  const min = Math.max(1, Math.round((Date.now()-R.t0)/60000));
  let h = `
  <div class="card center pop">
    <div class="small">${esc(R.label)} · ${min} Min.</div>
    <div class="big-score">${r} / ${n}</div>
    <div class="bar" style="margin:6px 0 10px"><div style="width:${pct}%;background:${pct>=80?'var(--ok)':pct>=60?'var(--yel)':'var(--no)'}"></div></div>
    <b>${pct} % richtig</b><br>${msg}
  </div>
  ${wrong.length?`<button class="btn primary" id="again">🔁 Diese ${wrong.length} Fehler nochmals üben</button>`:''}
  <button class="btn dark" id="new">▶︎ Neue Runde</button>
  <button class="btn center" id="home">🏠 Zur Startseite</button>
  ${wrong.length?`<h2>Das musst du dir noch merken</h2>`+wrong.map(x=>`
    <div class="wrong-item">
      <div class="small">Nr. ${x.q.n} · ${T[x.q.t]}</div>
      <b>${esc(x.q.q)}</b>
      ${x.q.img?`<img src="${x.q.img}" alt="" style="max-height:100px;max-width:60%;display:block;margin:6px 0">`:''}
      <div class="a">✔ ${esc(x.q.o[x.q.a])}</div>
      <div class="y">✘ Deine Antwort: ${esc(x.q.o[x.oi])}</div>
    </div>`).join(''):''}`;
  app.innerHTML = h;
  if(wrong.length) $('#again').onclick = () => start('fehler', shuffle(wrong.map(x=>x.q)), 'Fehler wiederholen');
  $('#new').onclick = () => { const m=R.mode, l=R.label;
    if(m==='exam') start('exam', shuffle(Q).slice(0,30), 'Prüfung');
    else { const k=Object.keys(T).find(k=>T[k]===l); start('learn', pick(k?Q.filter(q=>q.t===k):Q, S.len), k?l:'Gemischt'); } };
  $('#home').onclick = home;
}

/* ---------- Nachschlagen ---------- */
function lookup(){
  stopSpeak(); window.scrollTo(0,0);
  app.innerHTML = `
  <button class="btn center" id="back">← Zurück</button>
  <h1>Nachschlagen</h1>
  <p class="sub">Alle 300 Fragen mit der richtigen Antwort.</p>
  <input type="search" id="s" placeholder="Suchen, z. B. Batterie, Zurrgurte, Kat. F …" autocomplete="off">
  <div style="height:8px"></div>
  <select id="f"><option value="">Alle Themen</option>${Object.keys(T).map(k=>`<option value="${k}">${ICON[k]} ${T[k]}</option>`).join('')}</select>
  <p class="small" id="cnt"></p>
  <div id="list"></div>`;
  $('#back').onclick = home;
  const run = () => {
    const s = $('#s').value.trim().toLowerCase(), f = $('#f').value;
    const res = Q.filter(q => (!f||q.t===f) && (!s || String(q.n)===s || (q.q+' '+q.o[q.a]).toLowerCase().includes(s)));
    $('#cnt').textContent = res.length + ' Fragen';
    $('#list').innerHTML = res.map(q=>`<div class="look"><div class="n">Nr. ${q.n} · ${ICON[q.t]} ${T[q.t]} ${isMastered(q.n)?'· ⭐':''}</div><div class="q">${esc(q.q)}</div>${q.img?`<img src="${q.img}" alt="" loading="lazy">`:''}<div class="a">✔ ${esc(q.o[q.a])}</div></div>`).join('');
  };
  $('#s').oninput = run; $('#f').onchange = run; run();
}

/* Tastatur: 1/2/3 oder A/B/C, Enter = weiter */
document.addEventListener('keydown', e=>{
  if(!R || !$('#opts')) return;
  const k = e.key.toLowerCase(), idx = {'1':0,'2':1,'3':2,'a':0,'b':1,'c':2}[k];
  if(idx!==undefined && !$('#next')){ const b = app.querySelectorAll('.opt')[idx]; if(b) b.click(); }
  else if(k==='enter' && $('#next') && document.activeElement!==$('#next')){ $('#next').click(); }
});

home();
</script>
</body>
</html>
