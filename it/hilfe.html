<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IT-Hilfe – BBZ BL</title>
<meta name="theme-color" content="#205C90">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap narrow" style="margin:0 auto">
  <div class="hero">
    <h1>🛟 IT-Hilfe</h1>
    <p>Etwas funktioniert nicht? Hier findest du Anleitungen und Lösungen für die häufigsten Probleme.</p>
    <input id="q" type="search" placeholder="Suchen, z.B. «Drucker» oder «Passwort vergessen»" aria-label="Hilfe durchsuchen" style="margin-top:6px;border:0">
  </div>
  <div id="topics"></div>
  <p id="none" class="card hide">Nichts gefunden. Schau unter <a href="#kontakt" onclick="openT('kontakt')">Kontakt</a>, wer dir weiterhilft.</p>
</main>
<script src="assets/common.js"></script>
<script src="assets/content.js"></script>
<script>
  ITO.header("hilfe");
  const { HELP } = ITO_CONTENT, { esc, $ } = ITO;
  $("#topics").innerHTML = HELP.map(t =>
    '<details class="topic" id="' + t.id + '" data-k="' + esc((t.title + " " + t.keys + " " + t.faq.map(f => f[0]).join(" ")).toLowerCase()) + '"><summary><span class="ico">' + t.ico + "</span>" + esc(t.title) + '</summary><div class="body">' +
    t.body() + (t.videos ? "<div>" + t.videos.map(v => '<a class="video-btn" href="' + v[1] + '" target="_blank" rel="noopener">' + esc(v[0]) + "</a>").join("") + "</div>" : "") +
    t.faq.map(f => '<div class="faq"><h4>' + esc(f[0]) + "</h4><div>" + f[1] + "</div></div>").join("") +
    "</div></details>").join("");
  function openT(id){ const d = document.getElementById(id); if(d){ d.open = true; setTimeout(() => d.scrollIntoView({behavior:"smooth", block:"start"}), 50); } }
  if(location.hash) openT(location.hash.slice(1));
  window.addEventListener("hashchange", () => openT(location.hash.slice(1)));
  $("#q").addEventListener("input", e => {
    const v = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll(".topic").forEach(d => {
      const hit = !v || v.split(/\s+/).every(w => d.dataset.k.includes(w) || d.textContent.toLowerCase().includes(w));
      d.classList.toggle("hide", !hit); if(hit) n++; d.open = !!v && hit && v.length > 2;
    });
    $("#none").classList.toggle("hide", n > 0);
  });
</script>
</body>
</html>
